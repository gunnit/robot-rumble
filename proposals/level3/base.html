// CHESTNUT WOODS: misty forest layers, light shafts through the canopy
// ============================================================
// A tree trunk: lit side (the light comes from the upper left), shaded side, long twisted bark grooves (chestnut
// bark spirals), roots spreading where it meets the undergrowth, a branch or two up into the canopy
function trunk(px, x, tw, y0, y1, pal, o) {
  const lean = (hsh(x * 0.37 + o.s) - 0.5) * (o.lean || 0), per = tw > 14 ? 5 : 4;
  for (let y = y0; y < y1; y++) {
    const t = (y - y0) / (o.ground - y0), flare = ss(o.ground - 26, o.ground + 8, y);
    const ww = Math.max(2, Math.round(tw * (0.76 + 0.24 * Math.min(1, t)) + flare * tw * 0.8));
    const xl = Math.round(x + lean * (1 - Math.min(1, t)) - ww / 2 + Math.sin(y / 23 + x) * (tw > 12 ? 1.2 : 0.4));
    px.rect(xl, y, ww, 1, P(pal[1]));
    const lw = Math.max(1, Math.round(ww * 0.15)), sw = Math.max(1, Math.round(ww * 0.27));
    px.rect(xl, y, lw, 1, P(pal[0]));
    px.rect(xl + ww - sw, y, sw, 1, P(pal[2]));
    if (ww >= 6) {
      const shift = Math.floor(y * o.twist);
      for (let k = 1; k < ww - 1; k++) {
        const g = ((k + shift) % per + per) % per, id = Math.floor((k + shift) / per), seg = Math.floor((y + id * 7) / (5 + (id & 3) * 3));
        if (g === 0 && hsh(id * 7.3 + seg * 1.9 + x) > 0.22) px.dot(xl + k, y, P(pal[3]));
        else if (g === 1 && k < ww * 0.6 && hsh(id * 3.1 + seg * 2.3 + x) > 0.5) px.dot(xl + k, y, P(pal[0]));
      }
    }
    if (o.moss && ww >= 4 && y > o.ground - 96 && y < o.ground + 8) {
      const dy = ss(o.ground - 96, o.ground + 6, y);
      for (let k = 0; k < ww; k++) {
        const side = 0.3 + 0.7 * k / ww, n = vn2(k / 2.6 + x * 0.37, y / 3.2, o.s), m = dy * side * 0.72;
        if (n < m) px.dot(xl + k, y, P(n < m - 0.16 || vn2(k / 2.6 + x * 0.37, (y - 1) / 3.2, o.s) < m ? o.moss : o.mossL || o.moss));
      }
    }
  }
  if (o.branch && tw >= 7) for (const sd of [-1, 1]) {
    if (hsh(x * 5 + sd) < 0.3) continue;
    const by = o.cy + 4 + hsh(x * 9 + sd) * 26, len = tw * (1.2 + hsh(x * 3 + sd) * 0.8);
    for (let k = 0; k <= len; k++) px.disc(x + lean * 0.3 + sd * k, by - k * (0.7 + 0.3 * hsh(x + sd)), Math.max(0.6, tw * 0.22 * (1 - k / len * 0.65)), P(k < len * 0.3 ? pal[1] : sd < 0 ? pal[0] : pal[2]));
  }
}

// A canopy: leaf clumps darker underneath and sunlit on top, flecks of light, hanging sprigs of long leaves
function canopy(px, X1, o) {
  const clumps = [];
  for (let x = -24; x < X1 + 24; x += o.step * (0.6 + 0.8 * hsh(x * 0.31 + o.s))) {
    const r = lerp(o.r[0], o.r[1], hsh(x * 0.53 + o.s * 3)), y = o.cy + (hsh(x * 0.91 + o.s) - 0.4) * o.amp;
    clumps.push([x, y, r]);
  }
  if (o.solid != null) px.rect(-10, o.solid, X1 + 10, o.cy - o.solid, P(o.leaf[1]));
  if (o.top != null) for (let x = -24; x < X1 + 24; x += o.step * 0.7) {
    const r = lerp(o.r[0], o.r[1], hsh(x * 0.37 + o.s * 5)) * 0.9, y = o.top + (hsh(x * 0.77 + o.s) - 0.5) * o.amp * 0.8;
    px.disc(x, y, r, P(o.leaf[1])); px.rect(x - r, y, r * 2 + 1, o.cy - y, P(o.leaf[1]));
  }
  for (const [x, y, r] of clumps) px.disc(x, y, r, P(o.leaf[0]));
  for (const [x, y, r] of clumps) px.disc(x - 1, y - 2, r - 1.5, P(o.leaf[1]));
  // light on the leaves: small bright clumps, more toward the top
  for (let i = 0; i < (X1 + 40) * o.lit; i++) {
    const x = -20 + hsh(i * 3.7 + o.s) * (X1 + 40), y = (o.top != null ? o.top - 6 : o.cy - 24) + hsh(i * 5.1 + o.s) * (o.cy - (o.top != null ? o.top - 6 : o.cy - 24));
    if (px.get(x, y) !== P(o.leaf[1])) continue;
    const r = 1 + hsh(i * 2.3) * 1.6;
    px.disc(x, y, r, P(o.leaf[2])); px.disc(x + r + 0.5, y + 1, Math.max(0.5, r - 0.6), P(o.leaf[2])); px.dot(x - 1, y + r, P(o.leaf[0]));
    if (hsh(i * 7.9) > 0.55) px.dot(x - 1, y - 1, P(o.leaf[3] || o.leaf[2]));
  }
  if (o.hang) for (let x = -10; x < X1; x += 2) {
    if (hsh(x * 3.9 + o.s) < 0.62) continue;
    let y = o.cy + 2;
    while (y < o.cy + o.amp + o.r[1] && px.get(x, y)) y++;
    const n = 2 + Math.round(hsh(x * 1.7) * 4);
    px.rect(x, y - 1, 1, n, P(o.leaf[hsh(x * 5.1) > 0.4 ? 0 : 1]));
    if (n > 3) px.dot(x + (hsh(x) > 0.5 ? 1 : -1), y + 1, P(o.leaf[0]));
  }
}

function forest(px, o) {
  const X1 = px.w - 10;
  let x = -14 + hsh(o.s) * o.gap;
  while (x < X1 + 14) {
    const tw = Math.round(lerp(o.tw[0], o.tw[1], hsh(x * 0.71 + o.s)));
    trunk(px, Math.round(x), tw, o.cy - 10, H, o.bark, o);
    x += o.gap * (0.5 + hsh(x * 1.37 + o.s));
  }
  canopy(px, X1, o);
  // undergrowth: a mossy floor, fern clumps and bushes, boulders near the front
  const U = o.under, G0 = o.ground;
  for (let x = -14; x < X1 + 14; x += 4) {
    const r = 3 + hsh(x * 0.7 + o.s) * 5 * (fbm(x / 40, o.s, 2) + 0.4);
    px.disc(x, G0 + 5 - r * 0.5, r, P(U[0]));
  }
  px.rect(-10, G0 + 4, X1 + 10, H - G0, P(U[0]));
  for (let x = -14; x < X1 + 14; x += 4) {
    const r = 2 + hsh(x * 0.7 + o.s) * 4 * (fbm(x / 40, o.s, 2) + 0.3);
    if (hsh(x * 2.2 + o.s) > 0.35) px.disc(x - 1, G0 + 4 - r * 0.6, r - 1, P(U[1]));
    if (hsh(x * 4.4 + o.s) > 0.7) px.dot(x - 2, G0 + 2 - r, P(U[2]));
  }
  if (o.ferns) for (let x = 6; x < X1; x += 14 + Math.round(hsh(x + o.s) * 26)) fern(px, x, G0 + 6, o.ferns * (0.7 + hsh(x * 3) * 0.6), U[1], U[2]);
  if (o.flecks) for (let x = 0; x < X1; x += 9 + Math.round(hsh(x * 1.9 + o.s) * 30)) {
    const y = G0 + 3 + Math.round(hsh(x * 2.7 + o.s) * 6), r = 2 + hsh(x * 4.3) * 4;
    px.ell(x, y, r, 1, P(o.flecks[0])); px.rect(x - r * 0.4, y, Math.max(1, r * 0.8), 1, P(o.flecks[1]));
  }
  if (o.rocks) for (let x = 30; x < X1; x += 80 + Math.round(hsh(x * 3 + o.s) * 110)) {
    const rw = 9 + hsh(x) * 12, ry = G0 + 7;
    px.ell(x, ry, rw, rw * 0.55, P('#5f6e62')); px.ell(x - 2, ry - 2, rw - 3, rw * 0.42, P('#7f8f82'));
    px.ell(x - 4, ry - rw * 0.38, rw * 0.55, 2, P(o.moss)); px.rect(x - rw * 0.45, ry - rw * 0.42 - 1, rw * 0.45, 1, P('#a0c060'));
  }
}

// Light shafts falling from the upper left through the canopy (soft, drawn over the middle layers)
function shaftStrip(S, p) {
  const w = W + 22 + Math.ceil((S.cam1 - S.cam0) * p), px = new Pix(w, H, 0), C = rgbOf('#fff3c6');
  const beams = [];
  for (let x = -40; x < w; x += 70 + hsh(x) * 90) beams.push([x, 8 + hsh(x * 3) * 22, 0.18 + hsh(x * 7) * 0.22]);
  for (let y = 0; y < H; y++) {
    const fy = ss(0, 30, y) * (1 - ss(150, 245, y));
    if (fy <= 0) continue;
    for (const [bx, bw, a] of beams) {
      const c = bx + y * 0.42;
      for (let x = Math.floor(c - bw / 2); x <= c + bw / 2; x++) {
        if (x < 0 || x >= w) continue;
        const e = 1 - Math.abs(x - c) / (bw / 2), al = Math.round(255 * a * fy * Math.min(1, e * 2.2));
        const i = y * w + x, old = LE ? px.d[i] >>> 24 : px.d[i] & 255;
        if (al > old) px.d[i] = pk(C[0], C[1], C[2], al);
      }
    }
  }
  return { p, top: 0, h: H, c: px.canvas() };
}

// A band of drifting mist (alpha) that wraps seamlessly at its width (the noise comes from two lookup tables)
function fogStrip(w, h, s) {
  const px = new Pix(w, h, 0), C = rgbOf('#f2f7f2');
  const A = new Float32Array(w * 2), Q = 16, u0 = -w / 13, B = new Float32Array(Math.ceil((2 * w / 13 + h / 9) * Q) + 2);
  for (let x = -w; x < w; x++) A[x + w] = fbm(x / 45, s, 3);
  for (let i = 0; i < B.length; i++) B[i] = fbm(u0 + i / Q, s + 3, 2);
  const n = (x, y) => { const u = (x / 13 + y / 9 - u0) * Q, i = Math.floor(u); return 0.55 * A[x + w] + 0.45 * lerp(B[i], B[i + 1], u - i); };
  for (let y = 0; y < h; y++) {
    const fy = Math.sin(Math.PI * y / h);
    for (let x = 0; x < w; x++) {
      const v = lerp(n(x, y), n(x - w, y), x / w), a = Math.round(255 * clamp(fy * fy * (v * 1.4 - 0.3), 0, 1) * 0.8);
      if (a > 0) px.d[y * w + x] = pk(C[0], C[1], C[2], a);
    }
  }
  return px.canvas();
}
// Draw a horizontally wrapping band (fog, cloud decks) scrolled by `off`
function band(g, img, off, y) {
  const w = img.width;
  for (let x = -10 - Math.round(wrap(off, w)); x < W + 10; x += w) g.drawImage(img, x, y);
}

  g.fillStyle = '#e8e6e2'; g.fillRect(x - 5, y - 5, 10, 2);
  g.fillStyle = '#4a5a72'; for (let k = -4; k < 5; k += 2) g.fillRect(x + k, y - 5, 1, 1);
  g.fillStyle = '#e8b030'; g.fillRect(x - dir * 2, y - 7, 2, 2);
  g.fillStyle = 'rgba(255,255,255,0.7)'; g.fillRect(x + dir * 9, y - 1, 1, 2);
}

function smoke(g, x, y, k, t) {
  for (let i = 0; i < 5; i++) {
    const u = ((t * 0.35 + i * 9 + k * 13) % 45) / 45;
    g.fillStyle = 'rgba(236,236,240,' + (0.55 * (1 - u)).toFixed(2) + ')';
    const s = 1 + Math.round(u * 3);
    g.fillRect(Math.round(x + u * 10 * (1 + WX.wind) + Math.sin(u * 6 + k) * 1.5), Math.round(y - u * 26), s, s);
  }
}

function turbine(g, x, y, i) {
  g.fillStyle = '#eef2f6'; g.fillRect(x, y, 1, 13);
  const a = G.t * 0.045 + i * 1.7;
  for (let b = 0; b < 3; b++) {
    const ang = a + b * 2.094;
    for (let r = 1; r <= 5; r++) g.fillRect(Math.round(x + Math.cos(ang) * r), Math.round(y + Math.sin(ang) * r), 1, 1);
  }
  g.fillStyle = '#ffffff'; g.fillRect(x, y, 1, 1);
}

// ============================================================
// The four scenes (screen space, painting the whole screen)
// ============================================================
function drawHome(g, cx) {
  const S = SCN[0], L = LAY[0], sunX = 330 - Math.round(cx * 0.02);
  skyFill(g, AM.sky, 'am', SKYB[0]);
  sun(g, sunX, 62, 1);
  clouds(g, cx, CL_HOME, 'am', 1);
  blit(g, L[0], S, cx);
  blit(g, L[1], S, cx);
  // the lighthouse on Monte Faro
  const lh = LIVE.lh[0] - 1 - offOf(L[1], S, cx), ly = LIVE.lh[1] - 9, on = G.t % 110 < 16;
  if (on) {
    g.fillStyle = '#ffffff'; g.fillRect(lh, ly, 2, 2);
    g.fillStyle = 'rgba(255,246,176,0.55)'; g.fillRect(lh - 1, ly - 1, 4, 4); g.fillRect(lh - 5, ly, 12, 1); g.fillRect(lh, ly - 4, 2, 10);
  }
  blit(g, L[2], S, cx);
  const o2 = offOf(L[2], S, cx);
  sparkles(g, cx, L[2], S, sunX, 130, 170, 34);
  // sailboats and the ferry crossing the ria
  for (let i = 0; i < 5; i++) {
    const bx = Math.round(wrap(i * 173 + G.t * (0.025 + i * 0.006) * (i % 2 ? 1 : -1), 760) - 60 - o2), by = 133 + i * 6 + Math.round(Math.sin(G.t * 0.03 + i) * 0.6);
    if (bx > -12 && bx < W + 12) boat(g, bx, by, i % 3, i === 2 ? '#ffe8d0' : '#ffffff');
  }
  const f1 = Math.round(wrap(G.t * 0.09 + 380, 900) - 100 - o2), f2 = Math.round(800 - wrap(G.t * 0.075 + 610, 900) - o2);
  if (f2 > -50 && f2 < W + 50) ferry(g, f2, 138, -1);
  if (f1 > -50 && f1 < W + 50) ferry(g, f1, 145, 1);
  // red lights on the cranes
  if (G.t % 60 < 30) { g.fillStyle = '#ff4a3a'; for (const x of [372, 383, 414]) g.fillRect(x - o2, x === 383 ? 95 : 107, 1, 1); }
  gulls(g, cx, 5, 64, 0.16);
  blit(g, L[3], S, cx);
  blit(g, L[4], S, cx);
  const o4 = offOf(L[4], S, cx);
  LIVE.chim0.forEach(([x, y], k) => { if (x - o4 > -20 && x - o4 < W + 20) smoke(g, x - o4, y, k, G.t); });
  blit(g, L[5], S, cx);
}

// part: 0 = everything, 1 = only the misty depths (sky to the light shafts), 2 = only the two nearest rows of trees
function drawWoods(g, cx, part) {
  const S = SCN[1], L = LAY[1];
  if (part !== 2) {
  skyFill(g, WOODS_SKY, 'woods', SKYB[1]);
  clouds(g, cx, CL_WOODS, 'noon', 1);
  blit(g, L[0], S, cx);
  g.globalAlpha = 0.8; band(g, FOGS[0], cx * 0.08 + G.t * 0.05, 132); g.globalAlpha = 1;
  blit(g, L[1], S, cx);
  g.globalAlpha = 0.7; band(g, FOGS[1], cx * 0.18 + G.t * 0.09, 176); g.globalAlpha = 1;
  blit(g, L[2], S, cx);
  g.globalAlpha = 0.75 + 0.25 * Math.sin(G.t * 0.017);
  blit(g, SHAFT, S, cx);
  g.globalAlpha = 1;
  motes(g, cx, 28, 0.35);
  }
  if (part === 1) return;
  blit(g, L[3], S, cx);
  blit(g, L[4], S, cx);
}

// pollen and dust drifting in the light
function motes(g, cx, n, p) {
  for (let i = 0; i < n; i++) {
    const t = G.t + i * 211, x = Math.round(wrap(hsh(i * 3.7) * 700 + Math.sin(t * 0.007 + i) * 30 + t * 0.06 - cx * p, W + 40) - 20);
    const y = Math.round(40 + hsh(i * 9.1) * 170 + Math.sin(t * 0.011 + i * 2) * 12 + Math.sin(t * 0.004) * 6);
    const tw = Math.sin(t * 0.09 + i) > 0.2;
    g.fillStyle = tw ? 'rgba(255,250,220,0.95)' : 'rgba(255,246,200,0.45)';
    g.fillRect(x, y, 1, 1);
    if (tw && i % 5 === 0) { g.fillStyle = 'rgba(255,250,220,0.35)'; g.fillRect(x - 1, y, 3, 1); g.fillRect(x, y - 1, 1, 3); }
  }
}

function drawFarm(g, cx) {
  const S = SCN[2], L = LAY[2], st = stormAt(cx), rain = rainAt(cx), q = Math.round(st * 40);
  skyFill(g, mixStops(FARM_FAIR, FARM_STORM, q / 40), 'farm' + q, SKYB[2]);
  sun(g, 300 - Math.round((cx - S.cam0) * 0.02), 40, 0.75 * (1 - ss(0, 0.5, st)));
  clouds(g, cx, CL_FARM, 'noon', 1 - ss(0.1, 0.6, st));
  if (st > 0.01) {
    g.globalAlpha = st;
    band(g, DECK[0], cx * 0.05 + G.t * 0.12, -14 - Math.round((1 - st) * 40));
    band(g, DECK[1], cx * 0.09 + G.t * 0.22, -26 - Math.round((1 - st) * 50));
    g.globalAlpha = 1;
    clouds(g, cx, CL_SCUD, 'grey', ss(0.25, 0.85, st));
  }
  const tint = (Ly, a) => { if (a > 0.005) { g.fillStyle = rgba('#7d8794', a); g.fillRect(-10, Ly.top, W + 20, Ly.y1 + (Ly.y1 >= H ? 10 : 0) - Ly.top); } };
  blit(g, L[0], S, cx);
  const o0 = offOf(L[0], S, cx);
  LIVE.tur.forEach(([x, y], i) => turbine(g, x - o0, y, i));
  tint(L[0], 0.55 * st);
  if (rain > 0.02) rainSheets(g, cx, 0.45 * rain, 0, 0.3, RAINB[0]);
  blit(g, L[1], S, cx);
  tint(L[1], 0.4 * st);
  blit(g, L[2], S, cx);
  const o2 = offOf(L[2], S, cx);
  LIVE.chim2.forEach(([x, y], k) => { if (x - o2 > -20 && x - o2 < W + 20) smoke(g, x - o2, y, k, G.t); });
  tint(L[2], 0.26 * st);
  if (rain > 0.02) rainSheets(g, cx, 0.35 * rain, 1, 0.5, RAINB[1]);
  blit(g, L[3], S, cx);
  tint(L[3], 0.14 * st);
  blit(g, L[4], S, cx);
  tint(L[4], 0.06 * st);
}

function drawOrchard(g, cx) {
  const S = SCN[3], L = LAY[3], k = warmAt(cx), q = Math.round(k * 40), rb = rainbowAt(cx);
  skyFill(g, mixStops(PM_CLEAN, PM_WARM, q / 40), 'orch' + q, SKYB[3]);
  clouds(g, cx, CL_ORCH, 'pm', 1);
  blit(g, L[0], S, cx);
  if (rb > 0.01) { g.globalAlpha = rb; g.drawImage(RAINBOW, -30 - Math.round((cx - S.cam0) * 0.02) + 20, 0); g.globalAlpha = 1; }
  blit(g, L[1], S, cx);
  const o1 = offOf(L[1], S, cx);
  sparkles(g, cx, L[1], S, -999, 130, 172, 0);
  for (let i = 0; i < 4; i++) {
    const bx = Math.round(wrap(i * 211 + G.t * (0.03 + i * 0.008) * (i % 2 ? -1 : 1), 760) - 40 - o1), by = 133 + i * 4;
    if (bx > -12 && bx < W + 12) boat(g, bx, by, 1 + (i % 2), '#ffffff');
  }
  // cars crossing the Rande bridge
  for (const [ph, dir, c, v] of LIVE.cars) {
    const u = wrap(ph + dir * G.t * v / (BR.R - BR.L + 40), 1), x = Math.round(BR.L - 20 + u * (BR.R - BR.L + 40)) - o1;
    if (x > -4 && x < W + 4) { g.fillStyle = c; g.fillRect(x, BR.D - 2 + (dir > 0 ? 0 : 1), 2, 1); }
  }
  gulls(g, cx, 4, 70, 0.16);
  blit(g, L[2], S, cx);
  blit(g, L[3], S, cx);
  blit(g, L[4], S, cx);
}

const SCENES = [drawHome, drawWoods, drawFarm, drawOrchard];

// Rain streak tiles, tiled across the screen (integer blits keep them crisp)
const RV = [3.6, 5.4, 7.6], RX = [0, 0, 0];   // fall speed of each sheet; how far the gusts have blown it sideways
function rainSheets(g, cx, a, i, par, yb) {
  if (a <= 0.005) return;
  const ox = wrap(Math.round(RX[i] - cx * par), TILE), oy = wrap(Math.round(G.t * RV[i]), TILE), y1 = yb || H + 10;
  g.globalAlpha = Math.min(1, a);
  for (let y = oy - TILE; y < y1; y += TILE) for (let x = ox - TILE; x < W + 10; x += TILE) {
    if (y + TILE <= y1) g.drawImage(RAIN[i], x, y); else g.drawImage(RAIN[i], 0, 0, TILE, y1 - y, x, y, TILE, y1 - y);
  }
  g.globalAlpha = 1;
}

// draw a scene (or part of one) over what is there at alpha a: straight onto the screen when opaque, else via BUF
function over(fn, cx, part, a) {
  if (a <= 0.004) return;
  if (a >= 0.996) { fn(ctx, cx, part); return; }
  const bg = BUF.getContext('2d');
  bg.clearRect(-10, -10, W + 20, H + 20);
  fn(bg, cx, part);
  ctx.globalAlpha = a;
  ctx.drawImage(BUF, -10, -10);
  ctx.globalAlpha = 1;
}
L2.drawBG = function (cx) {
  if (!ready()) { ctx.fillStyle = '#8fd0ff'; ctx.fillRect(-10, -10, W + 20, H + 20); return; }
  const w = weights(cx);
  let i = 0;
  while (i < 3 && w[i] <= 0) i++;
  if (i > 2 || w[i + 1] <= 0) { SCENES[i](ctx, cx, 0); return; }
  const k = w[i + 1];
  if (i === 2) { SCENES[2](ctx, cx, 0); over(SCENES[3], cx, 0, k); return; }
  // into and out of the woods: the open scene stays underneath while the misty forest closes in, and the nearest
  // trunks only fade in once the mist is mostly there (they step out of the fog instead of hanging as see-through
  // columns over the open sky); leaving, the near trunks melt back into the mist first, then the mist lifts
  const enter = i === 0;
  SCENES[enter ? 0 : 2](ctx, cx, 0);
  over(drawWoods, cx, 1, enter ? ss(0, 0.65, k) : 1 - ss(0.35, 1, k));
  over(drawWoods, cx, 2, enter ? ss(0.45, 0.9, k) : 1 - ss(0.1, 0.55, k));
};

// ============================================================
// Particles: petals, leaves and butterflies (world x, screen y), on a private random stream
// ============================================================
const parts = [], flies = [];
const PETAL = ['#ffd2e4', '#ffb0d0', '#fff2f8', '#f592bc'];
const LEAF = ['#6a9a3a', '#86ac40', '#a8b840', '#b07a3a'];
const FLY = [['#ffffff', '#d8dce8'], ['#ffe066', '#e8b830'], ['#ffa040', '#c86020']];
let T = 0;
function stepParticles() {
  const cx = G.cam.x, w = weights(cx), wind = WX.wind, onL2 = typeof LEVELS !== 'undefined' && LV === LEVELS[1];
  const garden = w[0] * (1 - ss(520, 900, cx)), orchard = w[3] * WX.rainbow * (1 - WX.rain);
  if (parts.length < 80) {
    if (garden > 0 && rnd() < 0.16 * garden) {
      if (rnd() < 0.7) parts.push({ x: 300 + rr(-20, 22), y: rr(104, 136), vx: wind, vy: rr(0.25, 0.45), ph: rr(0, 6.3), c: Math.floor(rr(0, 4)), land: 0 });
      else parts.push({ x: rr(250, 560), y: rr(-4, 60), vx: wind, vy: rr(0.3, 0.5), ph: rr(0, 6.3), c: Math.floor(rr(0, 4)), land: 0 });
    }
    if (orchard > 0 && rnd() < 0.4 * orchard) {
      if (rnd() < 0.55) parts.push({ x: cx + W + rr(4, 30), y: rr(30, 210), vx: wind * 1.2, vy: rr(0.15, 0.4), ph: rr(0, 6.3), c: Math.floor(rr(0, 4)), land: 0 });
      else parts.push({ x: cx + rr(0, W + 60), y: -4, vx: wind, vy: rr(0.3, 0.5), ph: rr(0, 6.3), c: Math.floor(rr(0, 4)), land: 0 });
    }
    if (w[1] > 0 && rnd() < 0.07 * w[1]) parts.push({ x: cx + rr(-20, W + 40), y: rr(-6, 24), vx: wind * 0.5, vy: rr(0.35, 0.6), ph: rr(0, 6.3), c: Math.floor(rr(0, 4)), land: 0, leaf: true });
  }
  for (const p of parts) {
    if (p.land) { if (--p.land <= 0) p.dead = true; continue; }
    p.vx += ((p.leaf ? 0.6 : 1.2) * wind - p.vx) * 0.03;
    p.x += p.vx + Math.sin(p.ph + T * 0.05) * (p.leaf ? 0.45 : 0.3);
    p.y += p.vy + Math.sin(p.ph * 1.7 + T * 0.09) * 0.22;
    const gy = onL2 ? groundAt(p.x) : H;
    if (p.y >= gy - 1) { p.y = gy - 1; p.land = 80 + Math.floor(rnd() * 90); }
    if (p.x < cx - 40 || p.x > cx + W + 90 || p.y > H) p.dead = true;
  }
  for (let i = parts.length - 1; i >= 0; i--) if (parts[i].dead) parts.splice(i, 1);
  // butterflies in the sunny parts
  const sunny = garden + w[0] * 0.5 + w[2] * (1 - ss(2900, 3150, cx)) + w[3] * WX.rainbow;
  if (flies.length < Math.round(3 * Math.min(1, sunny)) && rnd() < 0.02) {
    const x = cx + rr(60, W + 40);
    flies.push({ x, y: (onL2 ? groundAt(x) : 200) - rr(24, 60), tx: x, ty: 0, t: 0, c: Math.floor(rr(0, 3)), ph: rr(0, 6) });
  }
  for (const f of flies) {
    if (--f.t <= 0) { f.tx = f.x + rr(-60, 60); f.ty = (onL2 ? groundAt(f.tx) : 200) - rr(14, 60); f.t = 60 + Math.floor(rnd() * 90); }
    const dx = f.tx - f.x, dy = f.ty - f.y, d = Math.hypot(dx, dy) || 1;
    f.x += dx / d * 0.55 + Math.sin(T * 0.13 + f.ph) * 0.3;
    f.y += dy / d * 0.4 + Math.sin(T * 0.21 + f.ph) * 0.45;
    if (f.x < cx - 40 || f.x > cx + W + 100) f.dead = true;
  }
  for (let i = flies.length - 1; i >= 0; i--) if (flies[i].dead) flies.splice(i, 1);
}

L2.skyLoad = function (cp) {
  ready();
  seed = 0x2f6b37 + Math.round(cp || 0);
  parts.length = 0; flies.length = 0; T = 0;
  weatherNow();
  for (let i = 0; i < 240; i++) { T++; stepParticles(); }
};
L2.skyUpdate = function () {
  T++;
  weatherNow();
  stepParticles();
  // the rain is blown sideways harder in the gusts (the streaks lean with the storm wind)
  const gust = clamp(-WX.wind / 0.62, 0.35, 1.7);
  for (let i = 0; i < 3; i++) RX[i] = wrap(RX[i] + RV[i] * SLANT * gust, TILE * 64);
};

// ============================================================
// Overlay (screen space, after the world): light tints, petals, leaves, butterflies, rain
// ============================================================
let warmGrad = null, goldGrad = null;
L2.drawOverlay = function (cx) {
  if (!ready()) return;
  const w = weights(cx), wx = weatherNow();
  // a warm morning light from the sun's side, a golden afternoon toward the boss
  if (!warmGrad) {
    warmGrad = ctx.createRadialGradient(330, 60, 10, 330, 60, 430);
    warmGrad.addColorStop(0, 'rgba(255,214,150,0.22)'); warmGrad.addColorStop(1, 'rgba(255,214,150,0)');
    goldGrad = ctx.createLinearGradient(0, 0, 0, H);
    goldGrad.addColorStop(0, 'rgba(255,190,110,0.16)'); goldGrad.addColorStop(1, 'rgba(255,160,90,0.04)');
  }
  if (w[0] > 0) { ctx.globalAlpha = w[0]; ctx.fillStyle = warmGrad; ctx.fillRect(-10, -10, W + 20, H + 20); }
  const gold = w[3] * warmAt(cx);
  if (gold > 0.01) { ctx.globalAlpha = gold; ctx.fillStyle = goldGrad; ctx.fillRect(-10, -10, W + 20, H + 20); }
  ctx.globalAlpha = 1;
  // a few big soft shafts in front, in the woods
  if (w[1] > 0) { ctx.globalAlpha = 0.2 * w[1]; ctx.drawImage(SHAFT.c, offOf(SHAFT, SCN[1], cx), 0, W + 20, H, -10, 0, W + 20, H); ctx.globalAlpha = 1; }
  // petals and leaves
  for (const p of parts) {
    const x = Math.round(p.x - cx), y = Math.round(p.y);
    if (x < -4 || x > W + 4) continue;
    if (p.land) ctx.globalAlpha = Math.min(1, p.land / 40);
    const f = Math.floor(p.ph * 3 + T * (p.leaf ? 0.12 : 0.2)) % 4;
    if (p.leaf) {
      ctx.fillStyle = LEAF[p.c];
      if (f === 0) ctx.fillRect(x - 1, y, 3, 1); else if (f === 1) { ctx.fillRect(x - 1, y - 1, 1, 1); ctx.fillRect(x, y, 2, 1); } else if (f === 2) ctx.fillRect(x, y - 1, 1, 3); else { ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x - 1, y, 2, 1); }
    } else {
      ctx.fillStyle = PETAL[p.c];
      ctx.fillRect(x, y, f === 1 ? 1 : 2, f === 3 ? 2 : 1);
    }
    ctx.globalAlpha = 1;
  }
  // butterflies
  for (const f of flies) {
    const x = Math.round(f.x - cx), y = Math.round(f.y), up = Math.floor(T / 4 + f.ph) % 2, c = FLY[f.c];
    ctx.fillStyle = '#3a3030'; ctx.fillRect(x, y, 1, 2);
    ctx.fillStyle = c[0];
    if (up) { ctx.fillRect(x - 2, y - 2, 2, 2); ctx.fillRect(x + 1, y - 2, 2, 2); }
    else { ctx.fillRect(x - 2, y, 2, 2); ctx.fillRect(x + 1, y, 2, 2); }
    ctx.fillStyle = c[1]; ctx.fillRect(x - 1, y + (up ? -1 : 1), 1, 1); ctx.fillRect(x + 1, y + (up ? -1 : 1), 1, 1);
  }
  // rain: a darker sky, three sheets of streaks, splashes on the ground
  const r = wx.rain;
  if (r > 0.01) {
    ctx.fillStyle = 'rgba(28,38,58,' + (0.16 * r).toFixed(3) + ')'; ctx.fillRect(-10, -10, W + 20, H + 20);
    rainSheets(ctx, cx, 0.5 * r, 0, 0.6);
    rainSheets(ctx, cx, 0.6 * ss(0.15, 0.6, r), 1, 0.9);
    rainSheets(ctx, cx, 0.55 * ss(0.5, 1, r), 2, 1.1);
    ctx.fillStyle = 'rgba(220,234,246,0.85)';
    for (let i = 0, n = Math.round(40 * r); i < n; i++) {
      const cyc = 14 + (i % 5) * 3, t = G.t + i * 13, life = t % cyc, gen = Math.floor(t / cyc);
      if (life > 6) continue;
      const sx = Math.round(hsh(i * 7.31 + gen * 1.37) * (W + 20)) - 10, y = Math.round(groundAt(cx + sx)) - 1;
      if (life < 2) ctx.fillRect(sx, y - 1, 1, 2);
      else if (life < 4) { ctx.fillRect(sx - 1, y - 2, 1, 1); ctx.fillRect(sx + 1, y - 2, 1, 1); ctx.fillRect(sx, y, 1, 1); }
      else { ctx.fillRect(sx - 2, y - 1, 1, 1); ctx.fillRect(sx + 2, y - 1, 1, 1); }
    }
  }
};
}
</script>
<script>
// ---- src/level2_world.js ----
'use strict';
var L2 = L2 || {};
// ============================================================
// Mission 2 world layer (VIGO HILLS): the ground, the granite house and the horreo, walls, gorse and ferns, the
// chestnut woods and the stream, the farm, the cherry orchard, the platforms, the foreground plants and the two
// interactive tree props (PROP_TYPES cherrytree, chestnuttree).
// L2 hooks: worldLoad, worldUpdate, drawBehind, drawGround, drawPlat, drawFront.
// Static art is built pixel by pixel into offscreen canvases (hard edges, OUT outlines, 3-tone shading) at load;
// the ground and the platforms are baked once the terrain is known (worldLoad). Each frame only the living parts are
// drawn on top: wind sway, water, smoke, the door, flags, puddles and rain sheen, falling petals and burrs.
// ============================================================
{
// ============================================================
// Build helpers: pixel buffers baked into canvases (deterministic: no Math.random anywhere in this file's drawing)
// ============================================================
const NONE = -1;
const I = s => parseInt(s.slice(1, 7), 16);
const P = (...s) => s.map(I);
const OUTI = I(OUT);
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// stable noise 0..1 per integer point
const NZ = (() => { const r = rng(20251101), a = new Float32Array(16384); for (let i = 0; i < a.length; i++) a[i] = r(); return a; })();

const gl = x => Math.round(groundAt(x + 0.5));
// a strip buffer covering x0..x1 from `up` px above the highest ground to `down` px below the lowest
function stripBuf(x0, x1, up, down) {
  let t = Infinity, bt = -Infinity;
  for (let x = x0 - 2; x <= x1 + 2; x++) { t = Math.min(t, gl(x) - up); bt = Math.max(bt, gl(x) + down); }
  const b = buf(x1 - x0 + 5, bt - t + 1);
  b.x0 = x0 - 2; b.y0 = t;
  return b;
}
function stripSprite(b) { return { img: bake(b), w: b.w, h: b.h, x: b.x0, y: b.y0 }; }
// courses of granite stones that follow the slope, rounded capstones, moss and lichen
function backWall(x0, x1, h, seed) {
  const b = stripBuf(x0, x1, h + 3, 3), X = x => x - b.x0, Y = y => y - b.y0;
  for (let x = x0; x <= x1; x++) {
    const g = gl(x);
    for (let y = g - h; y <= g + 3; y++) {
      const hy = g + 3 - y, row = Math.floor(hy / 6), j = hy % 6, off = row * 7 + (nz(row, seed) * 9 | 0);
      const bw = 9 + (nz(Math.floor((x + off) / 13), row + seed) * 5 | 0), i = (x + off) % 13;
      const tone = nz(Math.floor((x + off) / 13), row * 3 + seed + 1);
      let c = tone < 0.3 ? GRAN[2] : tone > 0.8 ? GRAN[0] : GRAN[1];
      if (i >= bw || j === 0) c = GRAN[4];
      else if (j === 1 || i === 0) c = GRAN[3];
      else if (j === 5 || i === bw - 1) c = tone > 0.8 ? I('#f0eadc') : GRAN[0];
      if (c !== GRAN[4] && nz(x * 3 + seed, y * 5) > 0.95) c = I('#7d7466');
      put(b, X(x), Y(y), c);
    }
    // capstones: a rounded row on top
    const cap = (x + seed) % 9, ch = cap === 0 || cap === 8 ? 1 : 2;
    for (let k = 1; k <= ch; k++) put(b, X(x), Y(g - h - k), k === ch ? GRAN[0] : GRAN[1]);
    if (cap === 0) put(b, X(x), Y(g - h), GRAN[4]);
    const m = nz(x >> 1, seed + 3);
    if (m > 0.5) { put(b, X(x), Y(g - h - ch - 1), m > 0.75 ? MOSS[0] : MOSS[1]); if (m > 0.8) put(b, X(x), Y(g - h - ch), MOSS[2]); }
    if (nz(x, seed + 9) > 0.93) for (let k = 0; k < 3; k++) put(b, X(x), Y(g - h + k), MOSS[k ? 2 : 1]);
    if (nz(x >> 2, seed + 11) > 0.9) put(b, X(x), Y(g - h + 4), I('#c9c46c'));
  }

}

L2.worldUpdate = function () {
  const p = G.p, w = weather();
  if (p && !p.dead) {
    const inW = p.x > 1982 && p.x < 2158;
    if (inW && p.onGround && !lastGround && lastPVY > 1.5) { splash(p.x, 10, true); Snd.noise(0.18, 0.08, 1800); }
    wade(p, p, 0);

  let n = 1;
  for (const e of G.enemies) if (e.active && !e.dead && e.x > 1960 && e.x < 2180) wade(e, e, n++);
  // the arena's cherry trees shed blossom while the boss shakes them
  if (G.treeShake > 0 && G.cam.x > 5500) {
    for (const d of DECOR) if (d[2] === 'btree' && d[1] > G.cam.x - 60 && d[1] < G.cam.x + W + 60 && fr() < 0.5) petalPuff(d[1] + frr(-30, 30), gl(d[1]) - 92, 1, 0.8);

      f.vy = Math.min(f.vy + 0.03, lf ? 0.7 : 0.5);

    }
  }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].t >= fx[i].life || fx[i].x < G.cam.x - 80) fx.splice(i, 1);
};

// ============================================================
// Pixel grid: shapes painted with palette letters, shaded (light top edge, dark underside) and outlined with k,
// then turned into a makeSprite sprite. Used at load for the animals and the flying cage parts.
// ============================================================
function grid(w, h) {
  const g = [];
  for (let y = 0; y < h; y++) g.push(new Array(w).fill('.'));
  const put = (x, y, c) => { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; };
  const o = {
    w, h,
    at: (x, y) => x >= 0 && y >= 0 && x < w && y < h ? g[y][x] : '.',
    p(x, y, c) { put(x, y, c); return o; },
    r(x, y, rw, rh, c) { for (let j = 0; j < rh; j++) for (let i = 0; i < rw; i++) put(x + i, y + j, c); return o; },
    e(cx, cy, rx, ry, c) {
      for (let y = Math.floor(cy - ry) - 1; y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx) - 1; x <= cx + rx + 1; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1.04) put(x, y, c);
      }
      return o;
    },
    // a thick line (wd px wide, centred on the path)
    l(x0, y0, x1, y1, c, wd = 1) {
      const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) || 1;
      for (let i = 0; i <= n; i++) {
        const x = x0 + (x1 - x0) * i / n, y = y0 + (y1 - y0) * i / n;
        o.r(Math.round(x - wd / 2), Math.round(y - wd / 2), wd, wd, c);
      }
      return o;
    },
    // filled polygon (pixel centres inside)
    t(pts, c) {
      let y0 = Infinity, y1 = -Infinity;
      for (const q of pts) { y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
      for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
        const yc = y + 0.5, xs = [];
        for (let i = 0; i < pts.length; i++) {
          const a = pts[i], b = pts[(i + 1) % pts.length];
          if ((a[1] <= yc) !== (b[1] <= yc)) xs.push(a[0] + (yc - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
        }
        xs.sort((m, n) => m - n);
        for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.ceil(xs[i] - 0.5); x + 0.5 <= xs[i + 1]; x++) put(x, y, c);
      }
      return o;
    },
    // 3-tone shading of colour c: lt where nothing is above, dk where nothing is below (dk2 one row higher)
    shade(c, lt, dk, dk2) {
      const s = g.map(r => r.slice()), at = (x, y) => x >= 0 && y >= 0 && x < w && y < h ? s[y][x] : '.';
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (s[y][x] !== c) continue;
        if (lt && at(x, y - 1) === '.') g[y][x] = lt;
        else if (dk && at(x, y + 1) === '.') g[y][x] = dk;
        else if (dk2 && at(x, y + 2) === '.') g[y][x] = dk2;
      }
      return o;
    },
    // 1px OUT outline around everything painted
    outline() {
      const s = g.map(r => r.slice()), at = (x, y) => x >= 0 && y >= 0 && x < w && y < h ? s[y][x] : '.';
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        if (s[y][x] === '.' && (at(x - 1, y) !== '.' || at(x + 1, y) !== '.' || at(x, y - 1) !== '.' || at(x, y + 1) !== '.')) g[y][x] = 'k';
      }
      return o;
    },
    sprite(pal) { return makeSprite(g.map(r => r.join('')), pal); }
  };
  return o;
}

// ============================================================
// The animals (art faces right; drawn facing the hero). Each kind: palette, grid size, anchor (ax = body centre,
// feet on the grid's second-to-last row, its outline on the ground), legs [hip x, far] and a painter for the
// body, head and tail; the shared builder adds the legs for each pose, shades, outlines and makes the sprites.
// ============================================================
// leg poses: per leg [foot dx, lift]; legs are ordered back far, back near, front far, front near
const GALLOP = [
  [[-4, 1], [-3, 0], [4, 2], [3, 0]],   // stretched out
  [[-1, 0], [1, 2], [1, 1], [-2, 0]],   // landing on the front legs
  [[2, 2], [3, 3], [-2, 2], [-3, 3]],   // gathered under the belly, off the ground
  [[-2, 0], [0, 1], [2, 1], [0, 0]]     // pushing off with the hind legs
];
function legPose(pose, i, len) {
  if (pose.legs === 'run') { const [dx, lift] = GALLOP[pose.f][i]; return [Math.round(dx * Math.min(1, len / 7)), Math.min(lift, len - 3)]; }
  if (pose.legs === 'jump') return i < 2 ? [-2, 2] : [2, 3];
  if (pose.legs === 'rear') return i < 2 ? [0, 0] : [3, 5];
  return [0, 0];
}

// paint one pose of one animal into a sprite
function beastSprite(K, ps) {
  const g = grid(K.w, K.h), feet = K.h - 2;
  if (!K.biped) {
    const leg = (i, near) => {
      const [hx, far] = K.legs[i];
      if (!!far === near) return;
      const [dx, lift] = legPose(ps, i, K.legLen), fy = feet - lift, top = K.hip, n = fy - top;
      for (let y = top; y <= fy; y++) {
        const x = Math.round(hx + dx * (y - top) / Math.max(1, n));
        const c = y === fy ? (far ? K.footFar : K.foot) : K.low && y > fy - 4 ? K.low : far ? K.legFar : K.leg;
        g.r(x, y, 2, 1, c);
      }
    };
    for (let i = 0; i < 4; i++) leg(i, false);
    K.paint(g, ps);
    for (let i = 0; i < 4; i++) leg(i, true);
  } else K.paint(g, ps);
  K.face(g, ps.face);
  for (const s of K.shade) g.shade(...s);
  g.outline();
  return g.sprite(K.pal);
}
for (const k in KINDS) {
  const K = KINDS[k];
  K.fr = {};
  for (const name in POSES) K.fr[name] = beastSprite(K, POSES[name]);
}

// the cage: the back bars before the animal, the posts, bars, top plate, hazard base and lock-eye after it
function cageBack(K) {
  const x0 = -(K.cw >> 1), top = -K.ch, n = Math.max(2, Math.round(K.cw / 8) - 1);
  ctx.globalAlpha = 0.55;
  R(x0 + 2, top + 4, K.cw - 4, 1, METD);
  for (let i = 0; i <= n; i++) R(x0 + Math.round((i + 0.5) * K.cw / (n + 1)), top + 4, 1, K.ch - 8, METD);
  ctx.globalAlpha = 1;
}
function cageFront(K, o, near, rattle) {
  const x0 = -(K.cw >> 1), x1 = x0 + K.cw, top = -K.ch + rattle, bh = K.ch - 6 - rattle, n = Math.max(2, Math.round(K.cw / 8) - 1);
  // bars: a dark edge and a lit edge, so the animal shows between them
  for (let i = 1; i <= n; i++) { const x = x0 + Math.round(i * K.cw / (n + 1)) - 1; R(x, top + 3, 1, bh, OUT); R(x + 1, top + 3, 1, bh, METL); R(x + 1, top + bh, 1, 3, MET); }
  // corner posts
  for (const px of [x0, x1 - 2]) { RO(px, top + 2, 2, bh + 1, MET); R(px, top + 2, 1, bh + 1, METL); }
  // top plate with rivets
  RO(x0 - 1, top, K.cw + 2, 3, METD); R(x0 - 1, top, K.cw + 2, 1, METL);
  for (let x = x0 + 2; x < x1 - 1; x += 5) R(x, top + 1, 1, 1, METDD);
  // base: hazard stripes
  RO(x0 - 1, -4, K.cw + 2, 4, METDD);
  for (let r = 0; r < 3; r++) for (let x = x0 - 1 + ((r + 4) & 3); x < x1 + 1; x += 4) R(x, -3 + r, Math.min(2, x1 + 1 - x), 1, '#f1c40f');
  R(x0 - 1, -4, K.cw + 2, 1, '#6a737e');
  // the robot lock-eye on top: blinks, faster with the hero close, and watches him
  const look = G.p ? clamp(Math.round((G.p.x - o.x) / 40), -1, 1) : 0, rate = near ? 8 : 24, on = Math.floor((o.t + o.id * 7) / rate) % 2 === 0;
  blob([[-4, top - 4, 8, 4], [-3, top - 5, 6, 1]], METD); R(-3, top - 4, 6, 1, METL); R(-4, top - 1, 8, 1, METDD);
  RO(-2, top - 3, 4, 2, '#2a0c0c'); R(-1 + look, top - 3, 2, 2, on ? EVIL : '#7a1f1f'); if (on) R(-1 + look, top - 3, 1, 1, '#ffd0cc');
  R(0, top - 8, 1, 3, METDD); R(0, top - 9, 1, 1, on ? EVIL : '#5a1a1a');
}

// a little heart (5x4 + outline) for the happy animals
const HEART5 = ['.x.x.', 'xxxxx', '.xxx.', '..x..'];
function heart(x, y, c) {
  for (let r = 0; r < 4; r++) for (let i = 0; i < 5; i++) if (HEART5[r][i] === 'x') R(x + i - 1, y + r - 1, 3, 3, OUT);
  for (let r = 0; r < 4; r++) for (let i = 0; i < 5; i++) if (HEART5[r][i] === 'x') R(x + i, y + r, 1, 1, r === 0 && i < 2 ? '#ffc2cc' : c);
}
function sparkle(x, y, s, c) { R(x - s, y, s * 2 + 1, 1, c); R(x, y - s, 1, s * 2 + 1, c); }

// draw one animal sprite with the feet at (dx, dy), facing f, optionally rotated round its hind feet; headOnly draws
// just the head (over the cage bars: the face pressed between them)
function beast(K, fr, f, dx, dy, rot, headOnly) {
  const s = K.fr[fr], oy = -(s.h - 1);
  ctx.save(); ctx.translate(Math.round(dx), Math.round(dy)); ctx.scale(f, 1);
  if (rot) { const px = -K.ax + 6; ctx.translate(px, 0); ctx.rotate(rot); ctx.translate(-px, 0); }
  if (headOnly) { const [x0, y0, x1, y1] = K.head; ctx.beginPath(); ctx.rect(x0 - K.ax, y0 + oy, x1 - x0, y1 - y0); ctx.clip(); }
  spr(s, -K.ax, oy);
  ctx.restore();
}

function drawTied(K, o) {
  const p = G.p, t = o.t + o.id * 37, near = !!p && !p.dead && Math.abs(p.x - o.x) < 150;
  let face = -1, fr = 'stand', dx = 0, dy = 0, rattle = 0, peek = near;
  if (near) {
    // excited: watches the hero and hops, the cage rattles when it lands
    face = p.x < o.x ? -1 : 1;
    const h = t % 34;
    if (h < 12) { dy = -Math.round(Math.sin(h / 12 * Math.PI) * 4); fr = 'jump'; }
    else fr = (t >> 3) % 2 ? 'wag' : 'happy';
    if (h >= 12 && h < 15) rattle = 1;
  } else {
    // nervous: peeks out between the bars, looks back over its shoulder, shivers, blinks
    const ph = t % 240;
    if (ph >= 40 && ph < 96) { dx = -Math.round(Math.sin((ph - 40) / 56 * Math.PI) * 3.4); fr = 'look'; peek = dx < -1; }
    else if (ph >= 140 && ph < 180) face = 1;
    else if (ph >= 200 && ph < 218) dx = (t >> 1) % 2 ? -1 : 0;
    if (t % 150 < 6) fr = 'blink';
  }
  cageBack(K);
  beast(K, fr, face, dx, -4 + dy, 0);
  cageFront(K, o, near, rattle);
  if (peek && face < 0) {
    ctx.save(); ctx.beginPath(); ctx.rect(-(K.cw >> 1) - 8, -K.ch + 3 + rattle, K.cw + 16, K.ch); ctx.clip();
    beast(K, fr, face, dx, -4 + dy, 0, true);
    ctx.restore();
  }
  // HELP! in a speech bubble over the cage, on and off
  if (Math.floor(t / 40) % 2 === 0) {
    const by = -K.ch - 23 + (Math.floor(t / 10) % 2);
    RO(-16, by, 33, 11, '#ffffff'); R(-16, by + 10, 33, 1, '#d8dce6');
    R(-2, by + 11, 5, 1, '#ffffff'); R(-1, by + 12, 3, 1, '#ffffff'); R(0, by + 13, 1, 1, '#ffffff');
    R(-3, by + 11, 1, 1, OUT); R(3, by + 11, 1, 1, OUT); R(-2, by + 12, 1, 1, OUT); R(2, by + 12, 1, 1, OUT); R(-1, by + 13, 1, 1, OUT); R(1, by + 13, 1, 1, OUT); R(0, by + 14, 1, 1, OUT);
    text('HELP!', 1, by + 2, '#e0302a', 1, 'center', null);
  }
}

// freed: hop out, then each animal's own happy move (the salute), then run home
function drawFreed(k, K, o) {
  const t = o.t;
  let face = -1, fr = 'happy', dx = 0, dy = 0, rot = 0;
  if (o.state === 'free') {
    const u = t / 24;
    dy = -Math.round(Math.sin(u * Math.PI) * 10 + 4 * (1 - u));
    fr = u > 0.08 && u < 0.92 ? 'jump' : 'wag';
    // the burst: a white flash where the cage was, fading
    if (t < 6) { ctx.globalAlpha = 0.9 - t * 0.15; pdisc(0, -(K.ch >> 1), 14 - t * 2, '#fffbe8'); ctx.globalAlpha = 1; }
  } else if (o.state === 'salute') {
    const s = t - 24;
    switch (k) {
      case 'dog': { // a spinning jump, tongue out, tail going
        const u = Math.min(1, s / 26);
        dy = -Math.round(Math.sin(u * Math.PI) * 12);
        if (s < 26) { face = Math.floor(s / 4) % 2 ? 1 : -1; fr = 'jump'; } else fr = (s >> 2) % 2 ? 'wag' : 'happy';
        break;
      }
      case 'sheep': // boing boing boing
        dy = -Math.round(Math.abs(Math.sin(s * 0.24)) * 7);
        fr = dy < -1 ? 'jump' : 'happy';
        break;
      case 'pony': { // rears up on its hind legs
        const u = clamp(s / 30, 0, 1);
        rot = -Math.sin(u * Math.PI) * 0.55;
        fr = s < 30 ? 'rear' : 'happy';
        break;
      }
      case 'cow': // a happy hop, the bell swinging
        dy = -Math.round(Math.abs(Math.sin(s * 0.16)) * 5);
        fr = dy < -1 ? 'jump' : (s >> 2) % 2 ? 'wag' : 'happy';
        break;
      case 'hen': // flaps and hops
        dy = -Math.round(Math.abs(Math.sin(s * 0.3)) * 6);
        fr = (s >> 1) % 2 ? 'jump' : 'happy';
        break;
      case 'goat': { // a big twisting leap
        const u = Math.min(1, s / 28);
        dy = -Math.round(Math.sin(u * Math.PI) * 13);
        rot = s < 28 ? Math.sin(u * Math.PI * 2) * 0.3 : 0;
        fr = s < 28 ? 'jump' : 'happy';
        break;
      }
    }
  } else {
    // run home: legs going, a little bounce
    const sp = k === 'hen' ? 2 : k === 'dog' ? 3 : 4, f = Math.floor(t / sp) % 4;
    fr = 'run' + f;
    dy = k === 'sheep' || k === 'goat' ? -Math.round(Math.abs(Math.sin(t * 0.35)) * 3) : -(f % 2);
    // dust kicked up behind: each puff stays where it was made while the animal runs on (2.2 px a frame)
    for (let i = 0; i < 3; i++) {
      const age = (t % 7) + i * 7, r = 1 + (age >> 3);
      if (age > 18) continue;
      ctx.globalAlpha = 0.55 * (1 - age / 19);
      pdisc(Math.round(K.ax * 0.6 + age * 2.2), -1 - (age >> 2), r, '#e2d2b0');
    }
    ctx.globalAlpha = 1;
  }
  beast(K, fr, face, dx, dy, rot);
  // hearts floating up, sparkles round it
  if (t < 90) for (let i = 0; i < 4; i++) {
    const a = t - i * 12;
    if (a < 0 || a > 46) continue;
    const hx = Math.round((hsh(o.id * 7 + i) - 0.5) * 22 + Math.sin(a * 0.15 + i) * 3), hy = Math.round(-K.ch * 0.6 - 6 - a * 0.55);
    if (a < 40 || a % 4 < 2) heart(hx - 2, hy, i % 2 ? '#ff5a7a' : '#ff3b5c');
  }
  if (t < 30) for (let i = 0; i < 5; i++) {
    const a = i / 5 * Math.PI * 2 + t * 0.05, r = 6 + t * 0.7;
    if ((t + i) % 4 < 3) sparkle(Math.round(Math.cos(a) * r), Math.round(-K.ch / 2 + Math.sin(a) * r * 0.7), t < 15 ? 1 : 0, i % 2 ? '#ffe066' : '#ffffff');
  }
}

// the cage bursting: bars, plate, base halves and the lock-eye fly off (engine particles), sparks, smoke, a ring
function burst(K, o) {

  for (let x = 7; x <= K.cw - 8; x += 6) { const side = x < K.cw / 2 ? -1 : 1; part(BAR_SPR, x0 + x, cy, side * rand(1.2, 2.6), rand(-3.8, -2.2), rand(-0.35, 0.35)); }
  part(BAR_SPR, x0 + 1, cy, -rand(1.6, 2.4), rand(-3, -2), -0.3); part(BAR_SPR, x0 + K.cw - 2, cy, rand(1.6, 2.4), rand(-3, -2), 0.3);
  part(PLATE_SPR, o.x, o.y - K.ch, rand(-0.6, 0.6), -4.4, rand(-0.25, 0.25));
  part(EYE_SPR, o.x, o.y - K.ch - 5, rand(-1.2, 1.2), -5.6, rand(0.3, 0.5) * (rand(0, 1) < 0.5 ? -1 : 1));
  part(BASE_SPR, o.x - K.cw / 4, o.y - 2, -rand(0.8, 1.4), -1.8, -0.15); part(BASE_SPR, o.x + K.cw / 4, o.y - 2, rand(0.8, 1.4), -1.8, 0.15);
  sparks(o.x, o.y - K.ch, 10, '#ffe066'); sparks(o.x, cy, 6, '#ffffff');
  for (let i = 0; i < 5; i++) G.parts.push({ type: 'smoke', x: o.x + rand(-K.cw / 2, K.cw / 2), y: o.y - rand(2, K.ch), vx: rand(-0.6, 0.6), vy: rand(-0.8, -0.2), life: rand(26, 40), max: 40, size: rand(3, 5) });
  G.rings.push({ x: o.x, y: cy, r: K.cw * 0.8, t: 0, max: 12 });
  G.shake = Math.max(G.shake, 1.5);
}

for (const k of Object.keys(KINDS)) {
  const K = KINDS[k];
  POW_KINDS[k] = {
    thanks: K.thanks,

    onFree(o) { burst(K, o); popSound(); SOUNDS[k](0.36); }

}

function makeIntro() {
  let t = 0, skipped = false, eagleOK = true;
  const at = n => t === n;
  // where the two eagles are at frame t: in from the right, swooping low over the hero, up and away left
  const eaglePos = i => {
    const s = t - IT.eagles - i * 16, x = 520 + i * 26 - s * 6.2;
    const u = clamp((520 - x) / 560, 0, 1);
    return { x, y: 46 + i * 12 + Math.sin(u * Math.PI) * 30 - u * u * 18, s };
  };
  return {
    start() {
      t = 0; skipped = false;
      G.introDoor = 0; G.introKeys = {}; G.p.hidden = true; G.p.facing = 1;
    },
    update() {
      t++;
      const p = G.p;
      // Enter skips to the start banner: hero outside, door shut
      if (!skipped && t > 10 && t < IT.go && pressed.Enter) {
        skipped = true; t = IT.go;
        p.hidden = false; G.introDoor = 0;
        if (p.x < 180) { p.x = 190; p.y = groundAt(p.x); }
      }
      // sound and story beats
      if (at(14)) chirp(0);
      if (at(32)) chirp(0.05);
      if (at(IT.door)) creak();
      if (at(IT.show)) p.hidden = false;
      if (at(IT.close + IT.closeLen)) { thud(); dust(120, 176, 3); }
      if (at(IT.eagles + 4)) screech(0);
      if (at(IT.eagles + 22)) screech(0.02);
      if (at(IT.go - 16)) howl(0);                       // far away down the hill: the wolves are coming
      if (at(IT.go)) { G.big = { s: 'MISSION 2 START!', t: 130 }; say('Mission two, start!'); }
      if (at(IT.banner)) G.banner = { s: SECTIONS[0].name, t: 200 };
      // the door: eased open, held, eased shut
      if (!skipped) {
        G.introDoor = t < IT.door ? 0 : t < IT.door + IT.doorLen ? ease((t - IT.door) / IT.doorLen)
          : t < IT.close ? 1 : Math.max(0, 1 - ease((t - IT.close) / IT.closeLen));
      }
      // the hero: out of the door, a glance back at the thud, then aiming up at the eagles going over
      G.introKeys = {
        right: (!skipped && t > IT.walk && t <= IT.walk + IT.walkLen) || at(IT.front),
        left: at(IT.back),
        up: t >= IT.up0 && t < IT.up1
      };
      if (t < IT.end) return false;
      p.hidden = false; G.introDoor = 0; G.introKeys = {};
      return true;
    },
    draw() {
      const cx = Math.round(G.cam.x);
      ctx.save(); ctx.translate(-cx, 0);
      // sparrows: pecking on the ridge, then away when the eagles scream
      const flee = t - IT.eagles - 6;
      for (const [sx, sy, i] of SPARROWS) {
        if (flee < 0) {
          const pk = (t + i * 23) % 70;
          sparrow(sx + (pk > 50 && pk < 56 ? 1 : 0), sy, pk > 30 && pk < 44 && (pk >> 2) % 2 ? 1 : 0, (t + i * 40) % 160 < 90 ? 1 : -1);
        } else if (flee < 120) {
          const fx = sx - flee * (1.6 + i * 0.4), fy = sy - flee * (1.1 + i * 0.3) - Math.sin(flee * 0.3) * 2;
          sparrow(fx, fy, (flee >> 2) % 2 ? 2 : 3, -1);
        }
      }
      // the hero takes in the view, then "!" when the eagles scream
      if (t >= IT.say0 && t < IT.eagles + 6 && !G.p.hidden) {
        const bx = Math.round(G.p.x) + 2, by = Math.round(G.p.y) - 58 + (t < IT.say0 + 4 ? IT.say0 + 4 - t : 0);
        RO(bx - 38, by, 77, 13, '#ffffff'); R(bx - 38, by + 12, 77, 1, '#d8dce6');
        R(bx - 6, by + 13, 4, 1, '#ffffff'); R(bx - 5, by + 14, 2, 1, '#ffffff');
        R(bx - 7, by + 13, 1, 1, OUT); R(bx - 2, by + 13, 1, 1, OUT); R(bx - 6, by + 14, 1, 1, OUT); R(bx - 3, by + 14, 1, 1, OUT); R(bx - 5, by + 15, 2, 1, OUT);
        text('WHAT A VIEW!', bx + 1, by + 3, '#2a3a6a', 1, 'center', null);
      }
      const ex = t - IT.eagles - 6;
      if (ex >= 0 && ex < 34 && !G.p.hidden) text('!', Math.round(G.p.x) + 1, Math.round(G.p.y) - 50 - (ex < 6 ? 6 - ex : 0), '#ffe066', 2, 'center');
      // the robot eagles
      for (let i = 0; i < 2; i++) {
        const q = eaglePos(i);
        if (q.s < 0 || q.x < -40 || q.x > 540) continue;
        const e = { type: 'eagle', x: q.x + cx, y: q.y, facing: -1, t: t + i * 9, st: q.s, hitT: 0, state: 'glide', glide: false, flap: (q.s * 0.055 + i * 0.4) % 1, cry: q.s < 18 || (q.s > 30 && q.s < 44) ? 6 : 0, alt: q.y };
        if (eagleOK && ENEMY_TYPES.eagle) {
          try { ENEMY_TYPES.eagle.draw(e); } catch (err) { eagleOK = false; FLASH = false; ctx.setTransform(1, 0, 0, 1, -cx, 0); errorOnce(err); }
        } else {
          // stand-in silhouette: a steel V with a red eye
          const wy = Math.round(Math.sin(q.s * 0.35) * 4), x = Math.round(e.x), y = Math.round(e.y);
          ctx.fillStyle = OUT; ctx.beginPath(); ctx.moveTo(x - 20, y - 8 - wy); ctx.lineTo(x, y - 4); ctx.lineTo(x + 20, y - 8 - wy); ctx.lineTo(x, y); ctx.fill();
          RO(x - 6, y - 6, 12, 5, MET); R(x - 7, y - 5, 2, 2, EVIL);
        }
      }
      ctx.restore();
      // letterbox bars: slide in at the start, out at the end
      const k = t < 10 ? ease(t / 10) : t > IT.out ? 1 - ease((t - IT.out) / (IT.end - IT.out)) : 1;
      const bh = Math.round(BARS * k);
      if (bh > 0) {
        ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, W, bh); ctx.fillRect(0, H - bh, W, bh);
        ctx.fillStyle = '#1c1c2a'; ctx.fillRect(0, bh - 1, W, 1); ctx.fillRect(0, H - bh, W, 1);
        // where we are: a caption in the bottom bar, fading in and out
        const ca = Math.min(1, (t - 20) / 16, (130 - t) / 16);
        if (ca > 0) {
          ctx.globalAlpha = ca;
          gFlag(W / 2 - 52, H - bh + 13);
          text('VIGO, GALICIA', W / 2 + 8, H - bh + 13, '#f4e2b8', 1, 'center', null);
          ctx.globalAlpha = 1;
        }
      }
    }
  };
}

const CARD_COLS = [['#3f9a52', '#1b5a32', '#8be0a8'], ['#3b8fd1', '#1d4f7a', '#bfe3ff'], ['#d35400', '#7e3200', '#ffc08a']];
// The boss named on a mission card: the boss of the mission's (last) boss lock, else any boss type in its waves
function bossOf(L) {
  const locks = (L.locks || []).slice().reverse();
  for (const l of [...locks.filter(l => l.boss), ...locks]) for (const w of l.waves) { const t = ENEMY_TYPES[w.t]; if (t && t.boss) return t; }
  return null;
}

function lockIcon(x, y) {
  const b = Math.round(Math.sin(G.t * 0.08) * 2);
  RO(x - 8, y - 15 + b, 3, 12, '#9aa3ab'); RO(x + 5, y - 15 + b, 3, 12, '#9aa3ab'); RO(x - 8, y - 17 + b, 16, 3, '#9aa3ab');
  R(x - 7, y - 17 + b, 14, 1, '#d5dbe0');
  RO(x - 11, y - 4 + b, 22, 17, '#f1c40f'); R(x - 11, y - 4 + b, 22, 2, '#fff3a0'); R(x - 11, y + 11 + b, 22, 2, '#b7950b');
  R(x - 2, y + b, 4, 4, OUT); R(x - 1, y + 3 + b, 2, 5, OUT);
}

// Filled pixel ellipse (crisp edges, unlike circ)
function pixelDisc(x, y, r, col, ry = r) {
  for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(r * Math.sqrt(1 - (dy / ry) * (dy / ry))); R(x - w, y + dy, w * 2 + 1, 1, col); }
}
// Tree crown from overlapping ellipses [x, y, rx, ry] with one shared outline (like blob)
function crown(parts, col) {
  for (const [x, y, rx, ry] of parts) pixelDisc(x, y, rx + 1, OUT, ry + 1);
  for (const [x, y, rx, ry] of parts) pixelDisc(x, y, rx, col, ry);
}

  }

  // the ría: far shore with Vigo's lights, then water with the moon's reflection

// big: titles at 2x (narrow cards with 3+ missions drop them all to 1x when one doesn't fit)
function missionCard(i, bx, by, bw, bh, big) {
  const L = LEVELS[i], sel = !!L && G.level === i, cx = bx + bw / 2;
  const [c1, c2, c3] = CARD_COLS[i % CARD_COLS.length];
  selectCard(bx, by, bw, bh, sel, c1, c2);
  if (!L && G.lockT > 0 && G.lockT % 10 < 5) { ctx.strokeStyle = '#ff9a1f'; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2); }
  const px = bx + 8, py = by + 8, pw = bw - 16, ph = 96;
  ctx.fillStyle = OUT; ctx.fillRect(px - 1, py - 1, pw + 2, ph + 2);
  ctx.save(); ctx.beginPath(); ctx.rect(px, py, pw, ph); ctx.clip();
  if (L) {
    if (L.preview) L.preview(px, py, pw, ph); else drawPlainPreview(px, py, pw, ph, c1, c2);
    if (!sel) { ctx.fillStyle = 'rgba(10,10,30,0.55)'; ctx.fillRect(px, py, pw, ph); }
  } else drawLockedPreview(px, py, pw, ph);
  ctx.restore();
  if (L) {
    const boss = bossOf(L), n = (L.sections || []).length, room = bw - 8;
    const areas = n + (n === 1 ? ' AREA' : ' AREAS'), bossLine = boss && boss.bossName ? 'BOSS: ' + boss.bossName : '';

    text(L.mission || 'MISSION ' + (i + 1), cx, by + 112, sel ? '#ffe066' : '#777788', 1, 'center');
    text(L.title || '', cx, by + (big ? 124 : 127), sel ? '#ffffff' : '#777788', big ? 2 : 1, 'center');
    const info = areas + (bossLine ? '   ' + bossLine : ''), ic = sel ? c3 : '#666677';
    if (info.length * 6 - 1 <= room) text(info, cx, by + 146, ic, 1, 'center');
    else { text(areas, cx, by + 142, ic, 1, 'center'); if (bossLine) text(bossLine, cx, by + 154, ic, 1, 'center'); }
  } else {
    text('MISSION ' + (i + 1), cx, by + 112, '#9a9ab0', 1, 'center');
    text('COMING SOON', cx, by + 124, G.lockT > 0 && G.lockT % 10 < 5 ? '#ffe066' : '#b8a060', 2, 'center');
    text('A NEW ADVENTURE!', cx, by + 146, '#8a8aa0', 1, 'center');

}

function draw() {
  switch (G.state) {
    case 'title': drawTitle(); break;
    case 'missions': drawMissions(); break;
    case 'select': drawSelect(); break;
    case 'play': drawPlay(); break;
    case 'pause': drawPause(); break;
    case 'over': drawOver(); break;
    case 'win': drawWin(); break;
    case 'allclear': drawAllClear(); break;
  }
  if (!Music.on && G.state !== 'play' && G.state !== 'pause') text('MUSIC OFF', W - 6, H - 10, '#888888', 1, 'right');
  if (G.fade > 0) { ctx.fillStyle = 'rgba(0,0,0,' + G.fade.toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
}

window.drawPlay = drawPlay;
window.draw = draw;
}
</script>
<script>
// ---- src/main.js ----
'use strict';
// ============================================================
// Main loop (fixed 60 updates per second) and dev hooks.
// Everything is private to this block except window.devStart.
// ============================================================
{
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function frame(now) {
  requestAnimationFrame(frame); // first, so nothing below can stop the loop
  acc += Math.min(now - last, 100);
  last = now;
  // An error doesn't stop the game (errorOnce logs it once): a failed update still counts as a step, so the game
  // keeps its speed on any screen, and the frame is drawn whatever happened in the updates
  while (acc >= STEP) {
    try { update(); } catch (err) { errorOnce(err); }
    acc -= STEP;
    for (const k in pressed) delete pressed[k];
  }
  try { draw(); } catch (err) { errorOnce(err); resetCanvas(); }
  if (now - errorAt < 2000) errorNote();
}

// Undo the canvas state a failed draw left behind (open save()s with their transforms, clips and alpha; the hit
// flash), keeping what it drew: restore() does nothing once no save() is left
function resetCanvas() {
  FLASH = false;
  for (let i = 0; i < 64; i++) ctx.restore();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.imageSmoothingEnabled = false;
}

// While errors happen (and 2 s after the last one) a note over the picture says so: index.html has no error box
function errorNote() {
  try {
    ctx.fillStyle = 'rgba(110,0,0,0.85)'; ctx.fillRect(W / 2 - 93, H - 16, 186, 12);
    text('OOPS! ERROR - SEE THE CONSOLE', W / 2, H - 14, '#ffffff', 1, 'center', null);
  } catch (err) { /* the font itself may be what is broken: the console has it */ }
}

// ============================================================
// Dev hooks (dev.html?level=2&x=1200, the test harness, the browser console)
// ============================================================
// Flat test arena: the listed enemy types appear ahead of the player, again and again
function sandboxLevel(types) {
  let wait = 0;
  return {
    mission: 'SANDBOX', title: 'TEST ARENA', end: 1e6, heroStart: 60, terrain: null,
    sections: [{ x: 0, name: 'SANDBOX: ' + types.join(' ') }],
    plats: [], spawns: [], pows: [], props: [], locks: [], music: 'main', bossMusic: 'boss', intro: null,
    drawBG() {
      const g = ctx.createLinearGradient(0, 0, 0, GROUND);
      g.addColorStop(0, '#5a8fc0'); g.addColorStop(1, '#cfe3f0');
      ctx.fillStyle = g; ctx.fillRect(-10, -10, W + 20, GROUND + 20);
    },
    drawGround(cx) {
      R(cx - 12, GROUND, W + 24, H - GROUND, '#6b5a45'); R(cx - 12, GROUND, W + 24, 3, '#7fa65a');
      // a ruler every 50px so positions are easy to read in screenshots
      for (let x = Math.floor((cx - 12) / 50) * 50; x < cx + W + 12; x += 50) {
        R(x, GROUND + 3, 1, x % 200 ? 4 : 8, '#3d3226');
        if (x % 200 === 0) text(String(x), x + 3, GROUND + 6, '#e8dcc8', 1, 'left', null);
      }
    },
    load() { wait = 0; },
    update() {
      G.winT = 0; // a beaten boss comes back instead of ending the run
      // a fresh group a second after the last one is gone
      if (G.enemies.length) { wait = 60; return; }
      if (--wait <= 0) types.forEach((t, i) => { const e = makeEnemy({ t, x: G.p.x + 150 + i * 60 }); if (!e.dead) G.enemies.push(e); });
    }
  };
}

// Set up a game: { level: mission number (1 = Mission 1), hero: 0|1, x: start x, god, sandbox: ['wolf', ...], frames }.
// Without x the mission starts from its beginning (intro included); with x it is built straight at that spot, no intro.
// Runs `frames` updates synchronously, draws once and returns a summary.
window.devStart = function (o = {}) {
  dbg.god = !!o.god;
  G.hero = o.hero ? 1 : 0;
  G.score = 0;
  if (o.sandbox) LV = sandboxLevel([].concat(o.sandbox));
  else {
    const i = (o.level || 1) - 1;
    if (!LEVELS[i]) throw new Error('devStart: mission ' + (i + 1) + ' is not loaded (' + LEVELS.length + ' missions)');
    G.level = i; LV = LEVELS[i];
  }
  if (o.x == null) beginMission(0, true);
  else {
    // jump ahead: locks before the camera count as done, enemies from there on are spawned
    beginMission(clamp(o.x - W * 0.42, 0, LV.end - W), false);
    G.p.x = o.x; G.p.y = groundAt(o.x);
  }
  for (let i = 0; i < (o.frames || 0); i++) { update(); for (const k in pressed) delete pressed[k]; }
  draw();
  const p = G.p;
  return { level: o.sandbox ? 'sandbox' : G.level + 1, state: G.state, intro: G.intro, x: Math.round(p.x), cam: Math.round(G.cam.x), hearts: p.hearts, lives: G.lives, score: G.score, enemies: G.enemies.length, section: G.section };
};

// dev.html?level=2&x=1200&hero=1&god=1 (or ?sandbox=wolf,eagle) starts straight in that state
const devQuery = {};
for (const kv of location.search.slice(1).split('&')) { const [k, v = ''] = kv.split('='); if (k) devQuery[k] = decodeURIComponent(v); }
if (devQuery.level || devQuery.sandbox) {
  try {
    devStart({
      level: +devQuery.level || 1, hero: +devQuery.hero || 0, x: devQuery.x ? +devQuery.x : null, god: devQuery.god === '1',
      sandbox: devQuery.sandbox ? devQuery.sandbox.split(',') : null
    });
  } catch (err) {
    // a broken start must not leave a dead page: report it and show the title screen instead
    console.error('Robot Rumble: devStart from the address bar failed (showing the title screen instead):', err);
    G.state = 'title'; G.intro = false; G.fade = 1; Music.stop();
    resetCanvas();
  }
}
requestAnimationFrame(frame);
}
</script>
