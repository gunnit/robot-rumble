// ============================================================
// Composition: the parts on two small canvases (made once), then drawn turned and tilted
// ============================================================
const CW = 116, CH = 88, OX = 50, OY = 76;
function layer() { const c = document.createElement('canvas'); c.width = CW; c.height = CH; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; return [c, g]; }
const [backC, bc] = layer(), [frontC, fc] = layer();
const put = (g, s, x, y, wt) => g.drawImage(wt ? s.white : s.img, OX + Math.round(x) - s.ox, OY + Math.round(y) - s.oy);
const mod = (a, m) => ((a % m) + m) % m;
const plateOn = (n, i) => KEEP.indexOf(i) < n;

// st: { f, sus, wa, fa, gi, recoil, plates, wt, muzzle, cflash, puff, beacon, flagK, fire }
function compose(st) {
  const wt = st.wt, y = Math.round(st.sus);
  bc.clearRect(0, 0, CW, CH); fc.clearRect(0, 0, CW, CH);
  // behind the hero: canopy post and roof, seat back, antenna and flag, the turret with its cannon, the beacon
  put(bc, BACK, 0, y, wt);
  put(bc, FLAG[st.f > 0 ? 0 : 1][st.flagK & 3], 0, y, wt);
  put(bc, CANNON, -st.recoil, y, wt);
  put(bc, TURRET, 0, y, wt);
  put(bc, BEACON[st.beacon ? 1 : 0], 0, y, wt);
  if (st.beacon && !wt) put(bc, GLOW, 0, y, false);
  if (st.cflash) put(bc, CFLASH, MUZ[0] - st.recoil + 1, MUZ[1] + y, false);
  // in front of the hero: body and plates, wheels, mudguard, steering wheel, exhaust cap, the nose gun
  put(fc, BODY, 0, y, wt);
  for (let i = 0; i < 3; i++) { if (plateOn(st.plates, i)) put(fc, PLATES[i], 0, y, wt); else holes(i, y); }
  put(fc, REAR[Math.floor(mod(st.wa, Math.PI / 3) / (Math.PI / 36)) % 12], REAR_AT[0], REAR_AT[1] + st.wy, wt);
  put(fc, FRONT[Math.floor(mod(st.fa, Math.PI / 4) / (Math.PI / 24)) % 6], FRONT_AT[0], FRONT_AT[1] + st.wy, wt);
  put(fc, FENDER, 0, y, wt);
  if (plateOn(st.plates, 3)) put(fc, PLATES[3], 0, y, wt); else holes(3, y);
  put(fc, STEER, 0, y, wt);
  put(fc, CAP[st.puff ? 1 : 0], 0, y, wt);
  put(fc, MG[st.gi], MG_AT[0], MG_AT[1] + y, wt);
  put(fc, BALL, MG_AT[0], MG_AT[1] + y, wt);
  if (st.muzzle) { const a = st.gi * GSTEP; put(fc, MFLASH[st.gi], MG_AT[0] + Math.cos(a) * (MG_LEN + 1), MG_AT[1] + y - Math.sin(a) * (MG_LEN + 1), false); }
  if (st.fire) put(fc, FLAME[(G.t >> 2) & 1], 6, -27 + y, false);
}
function holes(i, y) {
  fc.fillStyle = PAL.i;
  for (const [hx, hy] of HOLES[i]) fc.fillRect(OX + hx, OY + hy + y, 1, 1);
}
function blit(cv, v) {
  ctx.save();
  ctx.translate(v.x, v.y);
  if (v.rot) ctx.rotate(v.rot);
  ctx.scale(v.f, 1);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(cv, -OX, -OY);
  ctx.restore();
}
// world position of a local point (facing right, level) for the view v = { x, y, rot, f }
function world(v, lx, ly) {
  const c = Math.cos(v.rot), s = Math.sin(v.rot), X = lx * v.f;
  return { x: v.x + X * c - ly * s, y: v.y + X * s + ly * c };
}
// the ground line through both wheels' contact points (facing f): its height under x and its slope angle
function line(x, f) {
  const xa = x + REAR_AT[0] * f, xb = x + FRONT_AT[0] * f, ya = groundAt(xa), yb = groundAt(xb), k = (yb - ya) / (xb - xa);
  return { y: ya + k * (x - xa), rot: Math.atan(k) };
}
// tilt in 2 degree steps, none on gentle ground, so the pixels stay calm
const tilt = rot => Math.abs(rot) < 0.025 ? 0 : Math.round(rot / 0.035) * 0.035;

// The hero in the seat, hands on the steering wheel (the hero's own gun is clipped away)
function seatHero(p, v, sus) {
  const s = world(v, -7, -13 + sus);
  ctx.save();
  ctx.translate(Math.round(s.x), Math.round(s.y)); ctx.scale(v.f, 1);
  ctx.beginPath(); ctx.rect(-30, -60, 60, 39); ctx.rect(-30, -21, 37, 30); ctx.clip();
  drawHero(HEROES[G.hero], 0, 0, 1, { pose: 'idle', t: p.t, aim: 'fwd', weapon: 'pistol', muzzle: 0 });
  ctx.restore();
}
// Boarding: the hero hops from where they stood into the seat (k 0 -> 1)
function hopHero(p, r, v, k) {
  const s = world(v, -7, -13 + r.sus), x0 = p.x + r.hopX, y0 = p.y + r.hopY;
  drawHero(HEROES[G.hero], x0 + (s.x - x0) * k, y0 + (s.y - y0) * k - Math.sin(k * Math.PI) * 7, p.facing, { pose: 'jump', t: p.t, aim: 'fwd', weapon: p.weapon, muzzle: 0 });
}

// Wading through the stream: water over the wheels, ripples
const WATER = 234;
function wet(x) { return groundAt(x) > WATER + 0.5; }
function water(x0, x1) {
  for (let x = Math.floor(x0); x < x1; x += 2) {
    const gy = Math.round(groundAt(x));
    if (gy <= WATER) continue;
    const top = WATER + (Math.sin(G.t * 0.2 + x * 0.35) > 0.55 ? -1 : 0);
    ctx.fillStyle = 'rgba(79,159,210,0.6)'; ctx.fillRect(x, top, 2, gy - top + 1);
    ctx.fillStyle = (x + (G.t >> 2)) % 6 < 2 ? '#ffffff' : '#bfe6ff'; ctx.fillRect(x, top, 2, 1);
  }
}

// 'GET IN!' over a parked tractor, bouncing
function prompt(o) {
  const b = Math.round(Math.abs(Math.sin(G.t * 0.12)) * -4), x = Math.round(o.x - 6 * o.facing), y = Math.round(o.y) - 80 + b;
  text('GET IN!', x, y - 10, '#ffe066', 1, 'center');
  blob([[x - 1, y, 3, 3], [x - 3, y + 3, 7, 1], [x - 2, y + 4, 5, 1], [x - 1, y + 5, 3, 1], [x, y + 6, 1, 1]], '#ffe066');
  R(x - 1, y, 1, 3, '#fff6c2');
}

// One tractor on screen: the back layer, the hero (behind the cab, or in front of it while hopping in), the front
// layer, then the stream's water over the wheels
function drawTractor(v, st, hero, heroFront, armour) {
  compose(st);
  blit(backC, v);
  if (hero && !heroFront) hero();
  blit(frontC, v);
  if (hero && heroFront) hero();
  wade(v);
  smokeColumn(v, st.sus, armour);
}
// Smoke column over a badly hurt bonnet (armour 2 and less): pixel puffs rising and growing, drawn from G.t
const SMOKE = ['#57525e', '#3f3b45', '#2e2b33'];
function smokeColumn(v, sus, armour) {
  if (armour > 2) return;
  const b = world(v, 7, -29 + sus), n = armour <= 1 ? 5 : 3;
  for (let i = 0; i < n; i++) {
    const k = ((G.t * (armour <= 1 ? 0.03 : 0.022) + i / n) % 1), rr = 1.5 + k * 3.5;
    const x = Math.round(b.x - v.f * k * 9 + Math.sin(k * 6 + i) * 2), y = Math.round(b.y - k * 30);
    ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.fillStyle = SMOKE[armour <= 1 ? 2 : 1]; circ(x, y, rr + 1);
    ctx.fillStyle = SMOKE[armour <= 1 ? 1 : 0]; circ(x - 1, y - 1, rr);
  }
  ctx.globalAlpha = 1;
}
function wade(v) {
  if (!wet(v.x - 30) && !wet(v.x) && !wet(v.x + 30)) return;
  water(v.x - 34, v.x + 34);
  for (const [lx, rr] of [[REAR_AT[0], 11], [FRONT_AT[0], 7]]) {
    const wx = Math.round(v.x + lx * v.f), k = (G.t >> 2) & 3;
    if (!wet(wx)) continue;
    R(wx - rr - 3 - k, WATER - 1, 4, 1, '#ffffff'); R(wx + rr + k, WATER - 1, 4, 1, '#ffffff');
    R(wx - rr + 1, WATER, rr * 2 - 1, 1, '#e8f6ff');
  }
}
// a sprite's centre in local coordinates, and its mirror image (plates flying off a tractor facing left)
const mid = s => [s.w / 2 - s.ox, s.h / 2 - s.oy];
function flipped(s) {
  const c = document.createElement('canvas'); c.width = s.w; c.height = s.h;
  const g = c.getContext('2d'); g.scale(-1, 1); g.drawImage(s.img, -s.w, 0);
  return { img: c, w: s.w, h: s.h };
}
const PLATES_FLIP = PLATES.map(flipped);

// ============================================================
// The ride: state and helpers
// ============================================================
const ARMOUR = 6, SHELLS = 15, TOP = 1.6, BOARD = 18, HOP = -3.4, GRAV = 0.24, MGV = 7, SHELL_V = 3.9, SHELL_G = 0.2;
const newRide = () => ({
  type: 'tractor', armour: ARMOUR, shells: SHELLS, ga: 0, cd: 0, ccd: 0, vx: 0, rot: 0, sus: 1, susV: 0, wa: 0, fa: 0,
  recoil: 0, muzzle: 0, cflash: 0, puff: 0, puffT: 0, hitT: 0, board: 0, hopX: 0, hopY: 0, flagK: 0, flagT: 0, t: 0,
  air: false, wet: false, hello: false
});
const platesFor = a => clamp(a - 2, 0, 4);   // every hit but the last knocks a plate off
const viewAt = (x, y, rot, f) => ({ x: Math.round(x), y: Math.round(y), rot: tilt(rot), f });
// a gun at angle a (up from forward) pointing into the world, for the view v
function dirOf(v, a) {
  const lx = Math.cos(a) * v.f, ly = -Math.sin(a), c = Math.cos(v.rot), s = Math.sin(v.rot);
  return { x: lx * c - ly * s, y: lx * s + ly * c };
}
// the compose state: one object, refilled for each tractor drawn
const ST = { f: 1, sus: 0, wy: 0, wa: 0, fa: 0, gi: 0, recoil: 0, plates: 4, wt: false, muzzle: false, cflash: false, puff: false, beacon: false, flagK: 0, fire: false };
function stateOf(r, f, sus, wt) {
  ST.f = f; ST.sus = sus; ST.wy = r.air ? 2 : 0; ST.wa = r.wa; ST.fa = r.fa;
  ST.gi = clamp(Math.round(r.ga / GSTEP), 0, 12); ST.recoil = Math.round(r.recoil); ST.plates = platesFor(r.armour);
  ST.wt = wt; ST.muzzle = r.muzzle > 0; ST.cflash = r.cflash > 2; ST.puff = r.puff > 0;
  ST.beacon = ((G.t >> 4) & 1) === 1; ST.flagK = r.flagK; ST.fire = r.armour <= 1;
  return ST;
}
// the timers every tractor runs, parked or driven: suspension spring (rest 1px down, so the nose gun never fires
// higher than feet - 14), flag, cooldowns, flashes
function tick(r, fast) {
  r.t++;
  r.susV += (1 - r.sus) * 0.3 - r.susV * 0.28;
  r.sus = clamp(r.sus + r.susV, 0, 2.6);
  if (--r.flagT <= 0) { r.flagT = fast ? 4 : 7; r.flagK = (r.flagK + 1) & 3; }
  if (r.hitT > 0) r.hitT--;
  if (r.cd > 0) r.cd--;
  if (r.ccd > 0) r.ccd--;
  if (r.muzzle > 0) r.muzzle--;
  if (r.cflash > 0) r.cflash--;
  if (r.puff > 0) r.puff--;
  if (r.recoil > 0) r.recoil = Math.max(0, r.recoil - 0.35);
}
// exhaust: the cap flips open with each puff; quicker, bigger puffs with the throttle open
function exhaust(v, r, hard, quiet) {
  r.puffT -= hard ? 3 : 1;
  if (r.puffT > 0) return;
  r.puffT = 26; r.puff = 4;
  const s = world(v, 10, -41 + Math.round(r.sus));
  G.parts.push({ type: 'smoke', x: s.x, y: s.y, vx: -v.f * rand(0.2, 0.5), vy: -rand(0.5, 0.8), life: hard ? 40 : 30, max: 40, size: hard ? 2.4 : 1.7 });
  if (!quiet) Snd.tone('square', 70, 50, 0.05, 0.02);
}
// a badly hurt tractor smokes from the bonnet (and sparks at the last armour point)
function hurtSmoke(v, r) {
  if (r.armour > 2 || r.t % (r.armour <= 1 ? 3 : 5)) return;
  const s = world(v, 7 + rand(-3, 3), -28 + Math.round(r.sus));
  G.parts.push({ type: 'smoke', x: s.x, y: s.y, vx: -v.f * rand(0.1, 0.4), vy: -rand(0.6, 0.9), life: 48, max: 48, size: rand(2.4, 3.6) });
  if (r.armour <= 1 && r.t % 12 === 0) sparks(s.x, s.y + 2, 2, '#ffb52e');
}
function splash(x, n, dir) {
  for (let i = 0; i < n; i++) {
    G.parts.push({ type: 'spark', x: x + rand(-4, 4), y: WATER - 1, vx: dir * rand(0.2, 1.3) + rand(-0.4, 0.4), vy: -rand(1.2, 2.6), g: 0.16, life: rand(14, 24), max: 24, size: rand(0, 1) < 0.4 ? 2 : 1, c: rand(0, 1) < 0.5 ? '#ffffff' : '#bfe6ff' });
  }
}

// ============================================================
// Driving (RIDES.tractor.update): ←/→ throttle and brake, Z hop, X nose gun (↑ swings it up), C cannon, ↓+Z out
// ============================================================
function rideUpdate(p, r) {
  const moving = Math.abs(r.vx) > 0.6;
  tick(r, moving);
  p.crouch = false; p.onPlat = null; p.aim = 'fwd'; p.kb = 0;
  if (r.board > 0) {
    // hopping into the seat: the tractor waits, then the engine roars
    const gl = line(p.x, p.facing);
    p.vx = 0; p.vy = 0; p.y = gl.y; p.onGround = true; r.rot = gl.rot;
    if (--r.board === 0) {
      r.susV += 1.2; r.puffT = 0;
      Snd.tone('sawtooth', 45, 130, 0.4, 0.09); Snd.noise(0.35, 0.12, 600);
      const v = viewAt(p.x, p.y, r.rot, p.facing), s = world(v, 10, -41);
      for (let i = 0; i < 3; i++) G.parts.push({ type: 'smoke', x: s.x + rand(-2, 2), y: s.y - i * 3, vx: -p.facing * rand(0.2, 0.6), vy: -rand(0.6, 1.1), life: 46, max: 46, size: 2.4 + i * 0.4 });
    }
    return;
  }
  const L = ctl('left'), Rt = ctl('right'), D = ctl('down');
  if (D && ctlTap('jump')) { getOut(p, r); return; }
  const mv = L && !Rt ? -1 : Rt && !L ? 1 : 0;
  if (mv && mv !== p.facing) { p.facing = mv; dust(p.x, p.y, 3); }
  // throttle: speed up gently, brake hard against the motion, roll to a stop; a little faster downhill
  if (mv) r.vx += (r.vx * mv < 0 ? 0.16 : 0.07) * mv;
  else r.vx -= Math.sign(r.vx) * Math.min(Math.abs(r.vx), 0.05);
  let gl = line(p.x, p.facing);
  const top = TOP * clamp(1 + Math.sin(gl.rot) * Math.sign(r.vx) * 2, 0.75, 1.25);
  r.vx = clamp(r.vx, -top, top);
  // the screen edges stop the throttle (no snapping back: a bear pushing the tractor must not fight with this)
  if ((r.vx < 0 && p.x + r.vx < G.cam.x + 30) || (r.vx > 0 && p.x + r.vx > G.cam.x + W - 30)) r.vx = 0;
  p.x += r.vx;
  p.vx = r.vx;
  gl = line(p.x, p.facing);
  // hop (a thump and dust on landing), else stick to the ground
  if (p.onGround) {
    if (ctlTap('jump')) {
      p.vy = HOP; p.onGround = false; r.susV -= 0.8;
      Snd.tone('square', 110, 280, 0.1, 0.06);
      dust(p.x + REAR_AT[0] * p.facing, gl.y, 3); dust(p.x + FRONT_AT[0] * p.facing, gl.y, 2);
    } else p.y = gl.y;
  }
  if (!p.onGround) {
    p.vy = Math.min(p.vy + GRAV, 6); p.y += p.vy;
    if (p.y >= gl.y) {
      const hard = p.vy;
      p.y = gl.y; p.vy = 0; p.onGround = true;
      if (hard > 1.5) {
        r.susV += hard * 0.6; G.shake = Math.max(G.shake, hard * 0.8);
        if (wet(p.x)) splash(p.x, 10, 0);
        else { dust(p.x + REAR_AT[0] * p.facing, gl.y, 5); dust(p.x + FRONT_AT[0] * p.facing, gl.y, 4); }
        Snd.noise(0.14, 0.22, 420); Snd.tone('sine', 120, 45, 0.14, 0.2);
      }
    }
  }
  r.air = !p.onGround;
  r.rot += (gl.rot - r.rot) * (p.onGround ? 0.3 : 0.08);
  // wheels roll with the speed; bumps on the track
  const fwd = r.vx * p.facing;
  r.wa += fwd / 11; r.fa += fwd / 7;
  if (p.onGround && Math.abs(r.vx) > 0.4 && rand(0, 1) < 0.06) r.susV += rand(0.2, 0.6);
  const v = viewAt(p.x, p.y, r.rot, p.facing);
  // dust from the big wheel, or splashes in the stream
  const inWater = wet(p.x + REAR_AT[0] * p.facing) || wet(p.x + FRONT_AT[0] * p.facing);
  if (inWater && !r.wet && Math.abs(r.vx) > 0.3) splash(p.x, 8, Math.sign(r.vx));
  r.wet = inWater;
  if (p.onGround && Math.abs(r.vx) > 0.3) {
    if (inWater) { if (r.t % 3 === 0) { splash(p.x + REAR_AT[0] * p.facing, 2, -Math.sign(r.vx)); splash(p.x + FRONT_AT[0] * p.facing, 1, Math.sign(r.vx)); } }
    else if (Math.abs(r.vx) > 0.5 && r.t % 7 === 0) dust(p.x + (REAR_AT[0] - 6) * p.facing, groundAt(p.x + (REAR_AT[0] - 6) * p.facing), 1, -Math.sign(r.vx));
  }
  exhaust(v, r, !!mv, false);
  hurtSmoke(v, r);
  // nose gun: holding ↑ swings it up to 90 degrees, letting go swings it back; X fires along it
  r.ga = ctl('up') ? Math.min(Math.PI / 2, r.ga + 0.11) : Math.max(0, r.ga - 0.13);
  if (ctl('fire') && r.cd <= 0) fireGun(p, r, v);
  if (ctlTap('bomb')) {
    if (r.shells > 0 && r.ccd <= 0) fireCannon(p, r, v);
    else if (r.shells <= 0) { Snd.tone('square', 220, 160, 0.06, 0.06); G.texts.push({ x: p.x, y: p.y - 70, s: 'NO SHELLS!', t: 50, c: '#ff8a5c' }); }
  }
}

// Nose machine gun: 1 damage, quick, a little spread; shots start inside the barrel so a wolf touching the bumper is
// hit too (they show from the tip on). rideGun marks them for the MEGA BEAR, whose plating halves them.
function fireGun(p, r, v) {
  r.cd = 5; r.muzzle = 3;
  const a = clamp(Math.round(r.ga / GSTEP), 0, 12) * GSTEP, d = dirOf(v, a), sy = Math.round(r.sus), j = rand(-0.3, 0.3);
  const m = world(v, MG_AT[0] + Math.cos(a) * 4, MG_AT[1] + sy - Math.sin(a) * 4);
  G.pb.push({ x: m.x, y: m.y, vx: d.x * MGV - d.y * j, vy: d.y * MGV + d.x * j, dmg: 1, life: 75, age: 0, rideGun: true, update: ageUp, draw: drawShot });
  const c = world(v, MG_AT[0] - 3, MG_AT[1] + sy - 3);
  G.parts.push({ type: 'debris', x: c.x, y: c.y, vx: -v.f * rand(0.4, 1.1), vy: -rand(1.4, 2.2), g: 0.2, life: 28, max: 28, size: 1, c: '#e8b43a' });
  Snd.hmg();
}
const ageUp = b => { b.age++; };
function drawShot(b) {
  if (b.age < 2) return;
  const sp = Math.hypot(b.vx, b.vy) || 1, ux = b.vx / sp, uy = b.vy / sp, x = Math.round(b.x), y = Math.round(b.y);
  R(Math.round(b.x - ux * 7), Math.round(b.y - uy * 7), 2, 2, '#ff8c1a');
  R(Math.round(b.x - ux * 4) - 1, Math.round(b.y - uy * 4) - 1, 3, 3, '#ffb52e');
  R(x - 1, y - 1, 3, 3, '#ffe066'); R(x, y, 1, 1, '#ffffff');
}

// Cannon: a shell in an arc that bursts on a robot, the ground, or a boulder, egg or log in its way (radius 30, 8)
function fireCannon(p, r, v) {
  r.shells--; r.ccd = 34; r.recoil = 4; r.cflash = 7; r.susV += 0.9;
  const d = dirOf(v, CANNON_A), m = world(v, MUZ[0], MUZ[1] + Math.round(r.sus));
  G.pb.push({ x: m.x - d.x * 3, y: m.y - d.y * 3, vx: d.x * SHELL_V, vy: d.y * SHELL_V, dmg: 8, life: 240, age: 0,
    update: shellUpdate, draw: drawShell, onHit: shellBurst, onGround: shellGround, onProp: () => true, onPow: () => true });
  for (let i = 0; i < 4; i++) G.parts.push({ type: 'smoke', x: m.x + d.x * 4 + rand(-2, 2), y: m.y + d.y * 4 + rand(-2, 2), vx: d.x * rand(0.3, 0.9), vy: d.y * 0.5 - rand(0.1, 0.4), life: rand(22, 34), max: 34, size: rand(2, 3.5) });
  r.vx -= d.x * 0.5;
  G.shake = Math.max(G.shake, 2);
  Snd.cannon();
}
function shellUpdate(b) {
  b.age++; b.vy += SHELL_G;
  if (b.age % 2 === 0) G.parts.push({ type: 'smoke', x: b.x - b.vx * 1.5, y: b.y - b.vy * 1.5, vx: 0, vy: -0.2, life: 22, max: 22, size: 1.8 });
  for (const s of G.eb) {
    if (s.life > 0 && (s.shoot || (EB_TYPES[s.k] && EB_TYPES[s.k].shootable)) && Math.hypot(s.x - b.x, s.y - b.y) < 10) {
      s.life = 0; b.life = 0; blast(b.x, b.y, 30, 8, 'player'); return;
    }
  }
}
function shellBurst(b) { blast(b.x, b.y, 30, 8, 'player'); }
function shellGround(b) { const gy = groundAt(b.x); blast(b.x, gy - 5, 30, 8, 'player'); dust(b.x, gy, 6); }
function drawShell(b) {
  const s = SHELL[mod(Math.round(Math.atan2(b.vy, b.vx) / (Math.PI / 4)), 8)], sp = Math.hypot(b.vx, b.vy) || 1;
  const tx = b.x - b.vx / sp * 5, ty = b.y - b.vy / sp * 5;
  R(Math.round(tx - b.vx / sp * 3) - 1, Math.round(ty - b.vy / sp * 3) - 1, 2, 2, '#ff8c1a');
  R(Math.round(tx) - 1, Math.round(ty) - 1, 3, 3, (G.t >> 1) & 1 ? '#ffd23f' : '#fff3b0');
  ctx.drawImage(s.img, Math.round(b.x) - s.ox, Math.round(b.y) - s.oy);
}

// ============================================================
// Damage, getting out, the wreck
// ============================================================
function rideHurt(p, r) {
  const v = viewAt(p.x, p.y, r.rot, p.facing), before = platesFor(r.armour);
  r.armour = Math.max(0, r.armour - 1); r.hitT = 8; r.susV += 1.2;
  G.shake = Math.max(G.shake, 3.5);
  const c = world(v, rand(-12, 16), rand(-30, -14));
  sparks(c.x, c.y, 10); sparks(c.x, c.y, 4, '#ffffff');
  Snd.clank(); Snd.tone('square', 320, 110, 0.18, 0.09);
  for (let n = before; n > platesFor(r.armour); n--) plateOff(v, KEEP[n - 1], r.sus);
  if (r.armour <= 0) { wreck(p, r); return; }
  p.inv = 60;
  if (r.armour === 2) G.texts.push({ x: p.x, y: p.y - 66, s: 'ARMOUR LOW!', t: 70, c: '#ff8a5c' });
}
function plateOff(v, i, sus) {
  const [lx, ly] = mid(PLATES[i]), w = world(v, lx, ly + Math.round(sus));
  G.parts.push({ type: 'sprite', s: v.f > 0 ? PLATES[i] : PLATES_FLIP[i], x: w.x, y: w.y, vx: v.f * (lx > 0 ? 1 : -1) * rand(0.6, 1.8), vy: -rand(3, 4.5), g: 0.2, rot: 0, vr: rand(-0.35, 0.35), life: 70, max: 70 });
  sparks(w.x, w.y, 5);
}
// a parked tractor where the ride stands (armed: the hero may get in again at once)
function park(x, f, r, armed) {
  r.vx = 0; r.muzzle = 0; r.cflash = 0; r.air = false; r.board = 0; r.hitT = 0;
  const o = { k: 'tractor', x, y: line(x, f).y, hitT: 0, dead: false, facing: f, r, armed, doomed: 0, parts: null, near: false };
  G.props.push(o);
  return o;
}
// ↓ + Z: the hero hops out of the seat and the tractor stays where it stands, armour and shells kept
function getOut(p, r) {
  const v = viewAt(p.x, p.y, r.rot, p.facing), s = world(v, -7, -13 + Math.round(r.sus));
  park(p.x, p.facing, r, false);
  exitRide(p, false);
  p.x = s.x; p.y = Math.min(s.y, groundAt(s.x));
  Snd.tone('square', 300, 150, 0.1, 0.06);
}
// armour 0: the hero is thrown clear, the tractor blinks and blows up 0.7 s later where it stands
function wreck(p, r) {
  const v = viewAt(p.x, p.y, r.rot, p.facing), s = world(v, -7, -13 + Math.round(r.sus));
  const o = park(p.x, p.facing, r, false);
  o.k = 'tractorwreck'; o.doomed = 42;   // not a ride any more (the harness bot walks into rides)
  exitRide(p, true);
  p.x = s.x; p.y = Math.min(s.y, groundAt(s.x));
  G.texts.push({ x: o.x, y: o.y - 78, s: 'JUMP!', t: 50, c: '#ff8a5c' });
  Snd.hurt();
}
function doomUpdate(o, v) {
  const r = o.r;
  o.doomed--;
  G.shake = Math.max(G.shake, 1.2);
  if (o.doomed % 5 === 0) { const s = world(v, rand(-20, 22), rand(-30, -8)); sparks(s.x, s.y, 3, '#ffb52e'); }
  if (o.doomed % (o.doomed > 20 ? 10 : 5) === 0) Snd.tone('square', 880, 880, 0.05, 0.06);
  hurtSmoke(v, r);
  if (o.doomed <= 0) explode(o, v);
}
function explode(o, v) {
  blast(o.x, o.y - 18, 44, 10, 'player');   // a big boom that also hits robots close by
  G.later.push({ t: 8, x: o.x - 16 * o.facing, y: o.y - 34, s: 1.1 }, { t: 15, x: o.x + 14 * o.facing, y: o.y - 16, s: 0.9 });
  G.sflash = Math.max(G.sflash, 0.45); G.shake = Math.max(G.shake, 7);
  debris(o.x, o.y - 20, 10, PAL.r); debris(o.x, o.y - 20, 8, PAL.p); debris(o.x, o.y - 10, 6, PAL.t);
  // the big wheel bounces and rolls away; the small wheel, the turret, the plates and the exhaust cap tumble
  const parts = o.parts = [];
  const add = (s, lx, ly, vx, vy, vr, rad, roll) => {
    const w = world(v, lx, ly);
    parts.push({ s, x: w.x, y: w.y, vx: vx * o.facing, vy, rot: 0, vr: vr * o.facing, rad, roll, life: rand(120, 160) | 0, smoke: !roll && rad > 5 });
  };
  add(REAR[0], REAR_AT[0], REAR_AT[1], -rand(1.4, 2.2), -rand(4.6, 5.4), -0.2, 11.5, true);
  add(FRONT[0], FRONT_AT[0], FRONT_AT[1], rand(1.6, 2.4), -rand(3.6, 4.4), 0.3, 7.5, true);
  add(TURRET, -13, -57, rand(-0.8, 0.8), -rand(4.4, 5.2), rand(-0.25, 0.25), 6, false);
  add(CANNON, -2, -59, rand(0.6, 1.4), -rand(4.2, 5), rand(0.2, 0.4), 3, false);
  add(BITS[0], 8, -20, rand(0.8, 2), -rand(3.5, 5), rand(0.2, 0.45), 3, false);
  add(BITS[0], -10, -22, -rand(0.8, 2), -rand(3.5, 5), -rand(0.2, 0.45), 3, false);
  add(BITS[1], 22, -12, rand(1.2, 2.4), -rand(3, 4.4), rand(0.3, 0.5), 3, false);
  add(BITS[1], -32, -18, -rand(1.2, 2.4), -rand(3, 4.4), -rand(0.3, 0.5), 3, false);
  const [fx, fy] = mid(FLAG[0][0]);
  add(FLAG[0][0], fx, fy, -rand(0.4, 1), -rand(2.5, 3.5), rand(-0.1, 0.1), 4, false);
  add(CAP[0], 11, -37, rand(-1, 1), -rand(4.5, 6), 0.5, 2, false);
  o.boomT = 0;
}
function wreckUpdate(o) {
  let alive = false;
  o.boomT++;
  for (const q of o.parts) {
    if (q.life <= 0) continue;
    if (--q.life <= 0 || q.x < G.cam.x - 40 || q.x > G.cam.x + W + 40) { q.life = 0; continue; }
    alive = true;
    q.vy = Math.min(q.vy + 0.22, 7); q.x += q.vx; q.y += q.vy; q.rot += q.vr;
    const gy = groundAt(q.x) - q.rad;
    if (q.y >= gy) {
      q.y = gy;
      if (q.vy > 1.2) { q.vy *= -0.42; q.vx *= 0.8; dust(q.x, gy + q.rad, 2); if (!q.roll) q.vr *= 0.5; }
      else { q.vy = 0; q.vx *= q.roll ? 0.985 : 0.85; if (!q.roll) q.vr *= 0.7; }
      if (q.roll) q.vr = q.vx / q.rad;
    }
    if (q.smoke && q.life % 6 === 0) G.parts.push({ type: 'smoke', x: q.x, y: q.y, vx: 0, vy: -0.4, life: 26, max: 26, size: 1.6 });
  }
  if (!alive && o.boomT > 60) o.dead = true;
}
// the flying parts (rotation in 15 degree steps, so they stay pixel-crisp) and a scorch mark that fades
function drawWreck(o) {
  const a = clamp(1 - o.boomT / 170, 0, 1);
  if (a > 0) {
    const x = Math.round(o.x), y = Math.round(groundAt(o.x));
    ctx.fillStyle = 'rgba(38,26,22,' + (0.55 * a).toFixed(2) + ')';
    ctx.fillRect(x - 20, y - 1, 40, 2); ctx.fillRect(x - 14, y - 2, 28, 1); ctx.fillRect(x - 26, y, 52, 1);
  }
  for (const q of o.parts) {
    if (q.life <= 0) continue;
    ctx.save();
    ctx.translate(Math.round(q.x), Math.round(q.y));
    ctx.rotate(Math.round(q.rot / (Math.PI / 12)) * Math.PI / 12);
    ctx.scale(o.facing, 1);
    if (q.life < 20) ctx.globalAlpha = q.life / 20;
    ctx.drawImage(q.s.img, -Math.round(q.s.w / 2), -Math.round(q.s.h / 2));
    ctx.restore();
  }
}

// ============================================================
// Drawing the ride, and the HUD panel
// ============================================================
function rideDraw(p, r) {
  const v = viewAt(p.x, p.y, r.rot, p.facing);
  const idle = Math.abs(r.vx) < 0.2 && !r.air, sus = Math.round(r.sus) + (idle ? (G.t >> 3) & 1 : 0);
  const wt = r.hitT > 4 || (p.inv > 0 && r.hitT <= 0 && p.inv % 10 < 2);
  const st = stateOf(r, p.facing, sus, wt);
  if (r.board > 0) {
    const k = 1 - r.board / BOARD;
    drawTractor(v, st, () => hopHero(p, r, v, k), k < 0.55, r.armour);
  } else drawTractor(v, st, p.hidden ? null : () => seatHero(p, v, sus), false, r.armour);
}
function rideHud(r) {
  spr(ICON, 128, 7);
  text('TRACTOR', 155, 8, '#ffe066');
  // armour: six bolted segments, green, then yellow, then red and blinking; the one just lost flashes white
  const col = r.armour > 3 ? ['#8be0a8', '#d4ffe0'] : r.armour > 1 ? ['#ffd23f', '#fff3b0'] : ['#ff6b6b', '#ffc2c2'];
  const blink = r.armour <= 2 && G.t % 30 < 12;
  for (let i = 0; i < ARMOUR; i++) {
    const x = 156 + i * 7;
    if (i === r.armour && r.hitT > 0) RO(x, 21, 5, 4, '#ffffff');
    else if (i < r.armour) { RO(x, 21, 5, 4, blink ? col[1] : col[0]); R(x, 21, 5, 1, col[1]); }
    else { RO(x, 21, 5, 4, '#3a3a4a'); R(x + 2, 22, 1, 1, '#22222e'); }
  }
  spr(SHELL_ICON, 204, 18);
  text('X' + r.shells, 228, 20, r.shells ? '#ffffff' : G.t % 30 < 15 ? '#ff6b6b' : '#7a3a3a', 1, 'right');
}

RIDES.tractor = {
  update: rideUpdate,
  box: p => ({ x: p.x - 24, y: p.y - 40, w: 48, h: 40 }),
  draw: rideDraw,
  hurt: rideHurt,
  hud: rideHud
};

// ============================================================
// The parked tractor (level prop { k: 'tractor', x }): idling, 'GET IN!' while the hero is near, boarded by walking
// into it. Also the tractor left behind by ↓ + Z, and the doomed one about to blow up.
// ============================================================
function propUpdate(o) {

// ============================================================
// EAGLE: glides in high, circles, then screeches + red aim line (telegraph) and dives at where the hero was,
// pulls up and climbs away; sometimes carries an egg-bomb over the hero (blinking) and drops it
// ============================================================
// wing pose for elevation k (1 up .. -1 down): [wrist x, y, tip x, y] relative to the shoulder
function wingPose(k) {
  if (k >= 0) return [lerp(-8, -4, k), lerp(-3, -11, k), lerp(-19, -8, k), lerp(-5, -19, k)];
  const m = -k;
  return [lerp(-8, -4, m), lerp(-3, 5, m), lerp(-19, -9, m), lerp(-5, 11, m)];
}
function drawWing(sx, sy, k, far) {
  const [wx, wy, tx, ty] = wingPose(k);
  const ax = sx + wx, ay = sy + wy, bx = sx + tx, by = sy + ty;
  const dx = bx - sx, dy = by - sy, d = Math.hypot(dx, dy) || 1;
  let px = dy / d, py = -dx / d;
  if (px > 0.2 || (Math.abs(px) <= 0.2 && py < 0)) { px = -px; py = -py; }
  const fc = far ? METDD : METD, fl = far ? METD : MET, ac = far ? METD : MET;
  // feathers: outline pass then fill, longer toward the tip (the last two are the fingered primaries)
  const F = [];
  for (let i = 0; i < 6; i++) {
    const u = i / 5, ux = u < 0.45 ? lerp(sx, ax, u / 0.45) : lerp(ax, bx, (u - 0.45) / 0.55), uy = u < 0.45 ? lerp(sy, ay, u / 0.45) : lerp(ay, by, (u - 0.45) / 0.55);
    const len = 4 + u * 5 - (i === 5 ? 2 : 0), ex = ux + px * len + (dx / d) * u * 3, ey = uy + py * len + (dy / d) * u * 3;
    F.push([ux, uy, ex, ey]);
  }
  for (const f of F) pl(f[0], f[1], f[2], f[3], 2, fc, true);
  for (const f of F) pl(f[0], f[1], f[2], f[3], 2, fc);
  for (const f of F) pl(f[0], f[1], lerp(f[0], f[2], 0.6), lerp(f[1], f[3], 0.6), 1, fl);
  limb([sx, sy, ax, ay, bx, by], 3, ac, far ? null : METL);
  if (!far) { R(Math.round(ax), Math.round(ay), 1, 1, METDD); R(Math.round(lerp(sx, ax, 0.5)), Math.round(lerp(sy, ay, 0.5)) - 1, 1, 1, '#ffffff'); }
}

function drawEagle(e) {
  if (e.pieces) { drawPieces(e); return; }
  const s = e.state, t = e.t;
  // aim line (telegraph): red dashes marching toward the target, a reticle on it
  if ((s === 'aim') && !e.hitT) {
    const sx = e.x, sy = e.y - 6, d = Math.hypot(e.tx - sx, e.ty - sy), n = Math.floor(d / 4), lock = e.st >= 12;
    for (let i = 1; i < n; i++) {
      if ((i + Math.floor(e.st / 2)) % 3 === 0) continue;
      const k = i / n;
      R(Math.round(lerp(sx, e.tx, k)) - 1, Math.round(lerp(sy, e.ty, k)) - 1, 2, 2, lock && (e.st >> 2) % 2 ? '#ffffff' : EVIL);
    }
    const r = lock ? 5 : 8 - e.st / 4, c = (e.st >> 2) % 2 ? EVIL : '#ffffff';
    R(Math.round(e.tx - r), Math.round(e.ty), 3, 1, c); R(Math.round(e.tx + r - 2), Math.round(e.ty), 3, 1, c);
    R(Math.round(e.tx), Math.round(e.ty - r), 1, 3, c); R(Math.round(e.tx), Math.round(e.ty + r - 2), 1, 3, c);
  }
  ctx.save(); ctx.translate(Math.round(e.x), Math.round(e.y)); ctx.scale(e.facing, 1);
  FLASH = e.hitT > 0;
  if (s === 'dive' || s === 'pullup') drawEagleDive(e);
  else {
    // wing beat: flapping, gliding (wings held up in a shallow V) or the fast beat of the telegraph
    let k;
    if (s === 'aim') k = Math.sin(e.st * 0.7) * 0.8 + 0.2;
    else if (e.glide) k = 0.25 + Math.sin(t * 0.05) * 0.08;
    else k = Math.sin(e.flap * Math.PI * 2);
    const bob = Math.round(-k * 1.2);
    drawWing(1, -10 + bob, k, true);
    // tail fan
    for (const [ex, ey] of [[-17, -11], [-18, -8], [-16, -5]]) pl(-8, -8 + bob, ex, ey + bob, 2, SNOW, true);
    for (const [ex, ey] of [[-17, -11], [-18, -8], [-16, -5]]) pl(-8, -8 + bob, ex, ey + bob, 2, SNOW);
    R(-17, -11 + bob, 2, 1, METL); R(-16, -6 + bob, 2, 1, METL);
    // talons (holding the egg-bomb while carrying)
    const carry = s === 'carry';
    limb([-1, -4 + bob, carry ? -1 : -3, carry ? 1 + bob : -1 + bob], 2, GDD);
    limb([2, -4 + bob, carry ? 3 : 0, carry ? 1 + bob : -1 + bob], 2, GD);
    if (carry) {
      sp(EGG[(e.st >> 2) % 2], 1, 6 + bob);
      R(-2, 1 + bob, 2, 1, GD); R(3, 1 + bob, 2, 1, GD);
    }
    // body
    colBody([[-9, -9, -5], [-6, -11, -3], [0, -12, -2], [5, -12, -3], [8, -10, -5]], x => bob, MET, METD, METDD, 2, 2);
    R(-5, topAt(-5) + 2, 9, 1, METDD); R(-3, topAt(-3) + 3, 6, 1, METDD);
    R(-6, botAt(-6) - 1, 3, 1, GD); R(-1, botAt(-1) - 2, 1, 1, METL); R(3, botAt(3) - 2, 1, 1, METL);
    // head
    const open = s === 'aim' || (e.cry > 0);
    sp(EAGLE_HEAD[open ? 1 : 0], 6, -9 + bob);
    R(6, -19 + bob, 1, 2, METDD); R(6, -20 + bob, 1, 1, (t >> 4) % 2 ? EVIL : '#ffd0cc'); // antenna light
    if (s === 'aim' && !FLASH) {
      const on = (e.st >> 2) % 2;
      ctx.fillStyle = 'rgba(255,70,50,0.5)'; ctx.fillRect(8, -16 + bob, 6, 4);
      R(9, -15 + bob, 2, 1, on ? '#ffffff' : EVIL);
    }
    drawWing(-1, -9 + bob, k, false);
    R(-3, -9 + bob, 2, 2, METL);
  }
  FLASH = false; ctx.restore();
}

// diving: wings swept up and back into a V, talons out in front, head and beak leading (crisp strokes along the dive line)
function drawEagleDive(e) {
  const a = Math.atan2(e.dvy, Math.abs(e.dvx) + 0.01), ca = Math.cos(a), sa = Math.sin(a);
  const P = (u, v) => [u * ca + v * sa, -7 + u * sa - v * ca]; // u along the dive, v to its upper side
  const D = (u, v) => [u * ca + v * sa, u * sa - v * ca];
  const o = e.state === 'pullup' ? 3 : 0;                       // pulling up: the wings spread wider
  const wing = (du, dv, far) => {
    const s0 = P(1 + du, 2 + dv), w1 = P(-4 + du, 9 + dv + o), w2 = P(-12 + du - o, 13 + dv + o);
    const F = [];
    for (let i = 0; i < 6; i++) {
      const k = 0.2 + i * 0.16, b = k < 0.5 ? [lerp(s0[0], w1[0], k * 2), lerp(s0[1], w1[1], k * 2)] : [lerp(w1[0], w2[0], k * 2 - 1), lerp(w1[1], w2[1], k * 2 - 1)];
      const d = D(-4 - i * 0.7, -1.2 - i * 0.2);
      F.push([b[0], b[1], b[0] + d[0], b[1] + d[1]]);
    }
    for (const f of F) pl(f[0], f[1], f[2], f[3], 2, OUT, true);
    for (const f of F) pl(f[0], f[1], f[2], f[3], 2, far ? METDD : METD);
    if (!far) for (const f of F) pl(f[0], f[1], lerp(f[0], f[2], 0.5), lerp(f[1], f[3], 0.5), 1, MET);
    limb([s0[0], s0[1], w1[0], w1[1], w2[0], w2[1]], 3, far ? METD : MET, far ? null : METL);
    if (!far) { R(Math.round(w1[0]), Math.round(w1[1]), 1, 1, METDD); R(Math.round(lerp(s0[0], w1[0], 0.5)), Math.round(lerp(s0[1], w1[1], 0.5)), 1, 1, '#ffffff'); }
  };
  wing(-2, -1, true);
  // tail fan
  for (const v of [-2, 0, 2]) { const t0 = P(-7, 0), t1 = P(-14, v); pl(t0[0], t0[1], t1[0], t1[1], 2, SNOW, true); }
  for (const v of [-2, 0, 2]) { const t0 = P(-7, 0), t1 = P(-14, v); pl(t0[0], t0[1], t1[0], t1[1], 2, SNOW); }
  // body: a dark steel torpedo with a lighter back stripe and a rivet
  const b0 = P(-7, 0), b1 = P(5, 0);
  pl(b0[0], b0[1], b1[0], b1[1], 6, METD, true); pl(b0[0], b0[1], b1[0], b1[1], 6, METD);
  const h0 = P(-5, 2), h1 = P(4, 2), rv = P(-1, 0);
  pl(h0[0], h0[1], h1[0], h1[1], 1, MET); R(Math.round(rv[0]), Math.round(rv[1]), 1, 1, METL);

  limb([k0[0], k0[1], k1[0], k1[1]], 2, GD, GDL);
  const c1 = P(9, -4), c2 = P(9, -7);
  R(Math.round(c1[0]), Math.round(c1[1]), 2, 1, GDD); R(Math.round(c2[0]), Math.round(c2[1]), 1, 2, GDD);
  // head: white dome, gold hooked beak, red visor-eye
  const hd = P(8, 1), hx = Math.round(hd[0]), hy = Math.round(hd[1]), bk = P(13, 0.5);
  pl(hd[0], hd[1], bk[0], bk[1], 2, GD, true);
  blob([[hx - 3, hy - 2, 6, 5], [hx - 2, hy - 3, 4, 7]], SNOW);
  pl(hd[0] + ca * 2, hd[1] + sa * 2, bk[0], bk[1], 2, GD); R(Math.round(bk[0]), Math.round(bk[1]), 1, 1, GDD);
  const ey = P(9, 2);
  R(Math.round(ey[0]) - 1, Math.round(ey[1]) - 1, 3, 2, METDD); R(Math.round(ey[0]), Math.round(ey[1]) - 1, 2, 1, EVIL);
  wing(0, 0, false);
  // speed lines
  if (!FLASH && e.state === 'dive') for (let i = 0; i < 3; i++) { const q = P(-18 - i * 5, -3 + i * 3); R(Math.round(q[0]), Math.round(q[1]), 3, 1, 'rgba(255,255,255,0.7)'); }
}

function updEagle(e) {
  if (e.pieces) { updPieces(e); return; }
  const p = G.p, L = scrL(), minX = L + 34, maxX = L + W - 34;
  e.st++;
  if (e.cry > 0) e.cry--;
  if (hitNow(e)) { e.vy -= 0.6; e.cry = 10; }
  const glide = (tx, ty, sp) => {
    e.vx += clamp(tx - e.x, -sp, sp) * 0.03 - e.vx * 0.04;
    e.vy += (ty - e.y) * 0.02 - e.vy * 0.12;
  };
  switch (e.state) {
    case 'enter': {
      const tx = clamp(p.x + e.offX, minX + 30, maxX - 30);
      glide(tx, e.alt, 2.2);
      if (e.x > minX && e.x < maxX) { go(e, 'glide'); if (G.t - screechAt > 90) { screechAt = G.t; e.cry = 16; SFX.screech(); } }
      break;
    }
    case 'glide': {
      if (e.st % 130 === 0) e.offX = -Math.sign(e.offX || 1) * rand(40, 100);
      const tx = clamp(p.x + e.offX, minX, maxX);
      glide(tx, e.alt + Math.sin(e.t * 0.04) * 6, 1.5);
      if (--e.cd <= 0 && e.x > minX && e.x < maxX && !p.dead) {
        const egg = e.atk % 3 === 1 || (e.atk % 3 === 2 && rand(0, 1) < 0.3);
        e.atk++;
        if (egg) go(e, 'carry'); else { go(e, 'aim'); SFX.screech(); e.cry = 30; }
      }
      break;
    }
    case 'aim': {
      // hover, drift away if right above the hero (for a slanting dive), track the hero, then lock the target
      e.vx *= 0.85; e.vy *= 0.85;
      if (Math.abs(p.x - e.x) < 50) e.x += (e.x < p.x ? -1 : 1) * 0.7;
      e.x = clamp(e.x, minX, maxX);
      if (e.st <= 12) { e.tx = clamp(p.x, L + 16, L + W - 16); e.ty = p.y - 14; }
      e.facing = e.tx < e.x ? -1 : 1;
      if (e.st >= 38) {
        const dx = e.tx - e.x, dy = e.ty - (e.y - 6), d = Math.hypot(dx, dy) || 1;
        e.dvx = dx / d * 3.8; e.dvy = dy / d * 3.8; e.dleft = d / 3.8 + 4;
        go(e, 'dive'); Snd.tone('sawtooth', 1500, 500, 0.3, 0.04);
      }
      break;
    }
    case 'dive':
      e.vx = e.dvx; e.vy = e.dvy;
      if (--e.dleft <= 0 || e.y > groundAt(e.x) - 10) { go(e, 'pullup'); e.vy = Math.min(e.vy, 2.5); }
      break;
    case 'pullup':
      e.vy -= 0.24; e.vx *= 0.985; e.dvy = e.vy; e.dvx = e.vx;
      if (e.vy < -1.6) { go(e, 'climb'); }
      break;
    case 'climb':
      e.vy = lerp(e.vy, -1.5, 0.1); e.vx = lerp(e.vx, e.facing * 0.9, 0.05);
      if (e.x < minX) e.vx = Math.max(e.vx, 0.8); else if (e.x > maxX) e.vx = Math.min(e.vx, -0.8);
      if (e.y <= e.alt + 2) { go(e, 'glide'); e.vy = 0; e.cd = rand(150, 220) | 0; }
      break;
    case 'carry': {
      // fly over the hero holding the blinking egg-bomb (telegraph), then let go
      glide(clamp(p.x, minX, maxX), e.alt, 2);
      if (e.st % 12 === 0) SFX.beep();
      if ((e.st >= 40 && Math.abs(p.x - e.x) < 22) || e.st >= 100) {
        G.eb.push({ k: 'egg', x: e.x + e.facing, y: e.y + 6, vx: e.vx * 0.5, vy: 0.4, g: 0.11, life: 400, fuse: 0 });
        Snd.throw(); go(e, 'glide'); e.cd = rand(150, 210) | 0;
      }
      break;
    }
  }
  // keep clear of the other eagles: two never fly as one blob
  if (e.state === 'glide' || e.state === 'enter' || e.state === 'carry' || e.state === 'climb') {
    for (const o of G.enemies) {
      if (o === e || o.type !== 'eagle' || o.pieces || !o.active) continue;
      const dx = e.x - o.x, dy = e.y - o.y, d = Math.hypot(dx, dy);
      if (d < 34) { e.vx += (d > 0.5 ? dx / d : e.facing) * 0.09; e.vy += (d > 0.5 ? dy / d : -1) * 0.05; }
    }
  }
  e.x += e.vx; e.y += e.vy;
  if (e.state === 'glide' || e.state === 'enter' || e.state === 'carry' || e.state === 'climb') {
    if (e.vx > 0.25) e.facing = 1; else if (e.vx < -0.25) e.facing = -1;
  } else if (e.state === 'dive' || e.state === 'pullup') e.facing = e.vx < 0 ? -1 : 1;
  // wing beats: flap while climbing or slow, glide otherwise
  e.glide = e.state === 'glide' && e.vy > -0.3 && Math.abs(e.vx) > 0.6 && (e.t % 200) < 120;
  if (!e.glide) {
    const was = e.flap;
    e.flap = (e.flap + (e.state === 'climb' ? 0.07 : 0.045)) % 1;
    if (was < 0.25 && e.flap >= 0.25 && e.x > L && e.x < L + W) SFX.flap();
  }
}

ENEMY_TYPES.eagle = {

// ============================================================
// BEAR (and the ROBO BEAR mini-boss): heavy walk that shakes the ground; picks an attack by distance, each with a
// wind-up: rear up + swipe (close), lift + throw a boulder or log (far), paw the ground + short charge (middle)
// ============================================================
// key poses at scale 1 (facing right, feet at 0,0): body profile [x, top, bottom], hip, shoulder, neck
const BPOSE = {
  four: { prof: [[-27, -27, -15], [-25, -32, -13], [-19, -36, -12], [-8, -39, -12], [0, -42, -13], [6, -43, -14], [11, -40, -17], [15, -33, -21]], hip: [-17, -19], sh: [7, -21], neck: [15, -22] },
  half: { prof: [[-21, -29, -14], [-18, -36, -12], [-10, -43, -11], [-2, -47, -12], [4, -47, -14], [9, -43, -17], [12, -36, -22]], hip: [-12, -17], sh: [5, -32], neck: [11, -36] },
  up: { prof: [[-14, -28, -13], [-13, -39, -11], [-10, -47, -10], [-4, -52, -10], [3, -53, -11], [9, -50, -13], [12, -44, -16], [14, -36, -21]], hip: [-4, -16], sh: [5, -43], neck: [9, -46] }

// attack order away from the bear's paws: throw, charge, throw (close up it always rears and swipes)
const BEAR_ATK = ['lift', 'paw', 'lift'];

// the swiping arm sweeps a circle round the shoulder: k 0 = cocked back over the head, 1 = down in front
const swipeAng = k => lerp(-1.75, 0.65, k);

function drawBear(e) {
  if (e.pieces) { drawPieces(e); return; }
  const S = e.S, robo = e.robo, s = e.state, t = e.t, ph2 = e.hp < e.max / 2;
  const [AL, A, AD, ADD] = bearPal(robo);
  const sx = v => Math.round(v * S);
  let pose = BPOSE.four, gait = 0, bob = 0, headI = 0, hdy = 0, arms = null, hold = null, lean = 0, jit = 0;

<script>
// ---- src/level2_boss.js ----
'use strict';

// ============================================================

// ============================================================
// Palette
// ============================================================

// ============================================================
const HIP = [28, -60], NECK = [-46, -88], JAWH = [-66, -72], CORE = [-57, -56], LIGHT = [-16, -120];
const SH = [[-28, -76], [-16, -76]], EL = [[-36, -46], [-24, -46]], WR = [[-58, -16], [-46, -16]];
const KN = [[34, -44], [20, -46]], AN = [[30, -13], [16, -13]];

// Part sprites (painted once at load)
// ============================================================

    return Array.isArray(va) ? va.map((v, k) => v + (vb[k] - v) * s) : va + (vb - va) * s;

  const an = [[AN[0][0] + g[2][0], AN[0][1] - g[2][1]], [AN[1][0] + g[3][0], AN[1][1] - g[3][1]]];
  let act = [null, null], pa = [0, 0], smear = null, glint = 0;
  const roarPose = (r, len) => { th = kf(r, [[0, 0], [14, 0.14], [len, 0.14], [len + 20, 0]]); ht = kf(r, [[0, 0], [14, 0.42], [len, 0.36], [len + 20, 0]]); jaw = kf(r, [[0, 0], [12, 1], [len, 1], [len + 16, 0]]); };
  switch (s) {
    case 'intro':

    case 'idle':

      break;
    case 'toss': {
      th = kf(st, [[0, 0], [14, -0.1], [34, 0.12], [40, 0.16], [48, -0.06, 'in'], [70, 0]]);
      eye = st < 40 ? 1 : 0;
      jaw = kf(st, [[0, 0], [12, 0.3], [20, 0], [38, 0.2], [44, 0.6], [60, 0]]);
      const k = kf(st, [[0, 0], [10, 1], [62, 1], [78, 0]]);
      act[0] = sh => {
        const reach = [-88, -14], over = [sh[0] + 4, sh[1] - 66], back = [sh[0] + 22, sh[1] - 60], fwd = [sh[0] - 66, sh[1] - 18];
        const w = st < 14 ? reach : st < 34 ? kf(st, [[14, reach], [34, over]]) : st < 40 ? kf(st, [[34, over], [40, back]]) : kf(st, [[40, back], [47, fwd, 'out'], [62, fwd]]);
        return [w, k];
      };
      pa[0] = kf(st, [[0, 0], [12, 0.5], [30, -1.6], [40, -2.2], [47, -0.6], [70, 0]]);
      break;
    }
    case 'pound': {
      th = kf(st, [[0, 0], [30, 0.62, 'out'], [46, 0.66], [54, -0.12, 'in'], [80, 0]]);
      by += Math.round(kf(st, [[0, 0], [30, -4], [46, -4], [54, 3], [62, 0]]));
      ht = -th * 0.55;
      eye = th > 0.3 ? 1 : 0;
      jaw = th > 0.3 ? 0.7 : 0;
      // up on its hind legs, both paws out in front of the chest with the claws showing (trembling), then down hard
      const top = th > 0.55, k = th > 0 ? clamp(th / 0.42, 0, 1) : 0;
      for (let i = 0; i < 2; i++) {
        const tr = top ? Math.round(Math.sin(st * 1.3 + i * 2)) : 0;
        act[i] = sh => [[sh[0] - 50 + i * 12 + tr, sh[1] + 14 - i * 12 + (top ? Math.abs(tr) : 0)], k];
        pa[i] = 0.75 * k;
      }
      glint = top ? 2 : 0;
      break;
    }
    case 'swipe': {
      // the paw goes up and back (0-24), holds with the claws glinting (24-34), then sweeps down in front (34-42)
      bx = kf(st, [[0, 0], [24, 6], [34, 6], [39, -26, 'out'], [50, -26], [68, 0]]);
      th = kf(st, [[0, 0], [24, 0.12], [34, 0.12], [40, -0.08], [50, -0.06], [68, 0]]);
      by += Math.round(kf(st, [[0, 0], [24, -2], [40, 2], [68, 0]]));
      eye = st < 36 ? 1 : 0;
      jaw = kf(st, [[0, 0], [20, 0.4], [36, 0.8], [46, 0.5], [62, 0]]);
      const phi = kf(st, [[0, -0.9], [24, -0.6], [34, -0.55], [42, -3.95, 'out'], [52, -4.0]]);
      const k = kf(st, [[0, 0], [12, 1], [52, 1], [66, 0]]);
      act[0] = sh => [[sh[0] + Math.cos(phi) * 64, sh[1] + Math.sin(phi) * 64], k];
      pa[0] = kf(st, [[0, 0], [24, -2.4], [34, -2.4], [42, 0.3], [52, 0.1], [66, 0]]);
      if (st >= 34 && st < 50) smear = { a0: -0.55, a1: phi, r: 78, t: st - 34 };
      glint = st >= 22 && st < 34 ? 1 : 0;
      break;
    }
    case 'laser': {
      const ln = LANES[e.lane], end = e.beamEnd || 999, k = kf(st, [[0, 0], [20, 1], [end, 1], [end + 20, 0]]);
      th = ln.th * k; by += Math.round(laneDrop(ln, ln.th) * k); bx = 8 * k;
      ht = -th * 0.8;
      eye = st < AIM ? 1 : 0;
      jaw = st >= AIM && st < end ? 0.35 : st > AIM - 16 && st < AIM ? 0.15 : 0;
      if (st >= AIM && st < end) bx += 2 + Math.round(Math.sin(st * 1.7));     // recoil shudder
      break;
    }
    case 'roar': roarPose(st, 50); eye = 1; break;
    case 'phase2':
      if (st < 24) { bx = Math.round((hsh(st * 1.3) - 0.5) * 4); th = (hsh(st * 2.1) - 0.5) * 0.06; jaw = 0.3; }
      else roarPose(st - 24, 46);
      eye = 1;
      break;
    case 'dying':
      bx = Math.round((hsh(e.t * 1.7) - 0.5) * 4); by += Math.min(16, Math.floor(st / 9));
      th = -Math.min(0.16, st * 0.002); ht = -Math.min(0.3, st * 0.004); jaw = 0.55 + Math.sin(st * 0.3) * 0.1;

  // joints
  const hip = [HIP[0] + bx, HIP[1] + by], c = Math.cos(th), sn = Math.sin(th);
  const T = q => [hip[0] + (q[0] - HIP[0]) * c - (q[1] - HIP[1]) * sn, hip[1] + (q[0] - HIP[0]) * sn + (q[1] - HIP[1]) * c];
  const sh = SH.map(T);
  const arms = [0, 1].map(i => {
    let t = plant[i];
    if (act[i]) { const [a, k] = act[i](sh[i]); t = [lerp(t[0], a[0], k), lerp(t[1], a[1], k)]; }
    return ik(sh[i], t);
  });
  const neck = T(NECK); neck[1] += hy;
  const ha = th + ht, hc = Math.cos(ha), hs = Math.sin(ha);
  const H = q => [neck[0] + (q[0] - NECK[0]) * hc - (q[1] - NECK[1]) * hs, neck[1] + (q[0] - NECK[0]) * hs + (q[1] - NECK[1]) * hc];
  const pawAt = i => { const a = arms[i], r = [-8, -2], q = Math.cos(pa[i]), w = Math.sin(pa[i]); return [a.wr[0] + r[0] * q - r[1] * w, a.wr[1] + r[0] * w + r[1] * q]; };
  const clawAt = i => { const a = arms[i], q = Math.cos(pa[i]), w = Math.sin(pa[i]); return [a.wr[0] - 17 * q - 13 * w, a.wr[1] - 17 * w + 13 * q]; };
  return {
    bx, by, br, th, ht, jaw, eye, pa, hip, T, H, neck, ha, sh, arms, an, smear, glint,
    knees: KN.map(T), core: T(CORE), light: T(LIGHT), pipes: PIPES.map(T), mouth: H([-102, -72]), pawN: pawAt(0), claws: [clawAt(0), clawAt(1)]
  };
}

// Drawing
// ============================================================
// sprite s with its rest point (ax, ay) placed at (x, y), turned by ang (0 = as painted, pixel-exact)
function part(s, x, y, ang, ax, ay) {
  const img = FLASH ? s.white : s.img;
  if (Math.abs(ang) < 0.03) { ctx.drawImage(img, Math.round(x + s.x0 - ax), Math.round(y + s.y0 - ay)); return; }
  ctx.save(); ctx.translate(Math.round(x), Math.round(y)); ctx.rotate(ang);
  ctx.drawImage(img, s.x0 - ax, s.y0 - ay);
  ctx.restore();
}
// a pixel disc (crisp, no anti-aliasing)
function disc(x, y, r, col) {
  for (let j = -r; j <= r; j++) { const w = Math.round(Math.sqrt(Math.max(0, r * r - j * j))); R(Math.round(x) - w, Math.round(y) + j, w * 2 + 1, 1, col); }
}

function drawArm(P, i) {
  const a = P.arms[i], f = i === 1;
  part(f ? SPR.upperF : SPR.upper, a.s[0], a.s[1], a.a1 - UA0, SH[0][0], SH[0][1]);
  part(f ? SPR.foreF : SPR.fore, a.el[0], a.el[1], a.a2 - FA0, EL[0][0], EL[0][1]);
  part(f ? SPR.pawF : SPR.paw, a.wr[0], a.wr[1], P.pa[i], WR[0][0], WR[0][1]);
}
function drawLeg(P, i) {
  // the shin leans toward the knee, but never so far that its top pokes out behind the haunch (crouched poses)
  const k = P.knees[i], a = P.an[i], f = i === 1, ang = clamp(Math.atan2(a[1] - k[1], a[0] - k[0]) - SHIN0, -0.28, 0.28);
  part(f ? SPR.shinF : SPR.shin, a[0], a[1], ang, AN[0][0], AN[0][1]);
  part(f ? SPR.footF : SPR.foot, a[0], a[1], 0, AN[0][0], AN[0][1]);
}

const eyeCol = (e, P) => e.state === 'dying' ? (e.t % 6 < 3 ? '#5a1a1a' : '#ff6a50') : P.eye && e.t % 8 < 5 ? '#ffffff' : e.ph2 ? '#ff2a20' : '#ffd23f';
function drawHead(e, P) {
  if (e.lost.head) return;
  ctx.save(); ctx.translate(Math.round(P.neck[0]), Math.round(P.neck[1]) + P.br);
  if (Math.abs(P.ha) >= 0.03) ctx.rotate(P.ha);
  const ox = -NECK[0], oy = -NECK[1];
  // mouth: dark inside, a glow in the throat, then the jaw swung open around its hinge
  const ja = -P.jaw * 0.55;
  if (P.jaw > 0.05) {
    ctx.fillStyle = FLASH ? '#ffffff' : MOUTH;
    const c = Math.cos(ja), s = Math.sin(ja), jx = JAWH[0] + ox, jy = JAWH[1] + oy;
    const fx = -104 - JAWH[0], fy = -74 - JAWH[1];
    ctx.beginPath(); ctx.moveTo(jx, jy - 3); ctx.lineTo(-104 + ox, -71 + oy); ctx.lineTo(jx + fx * c - fy * s, jy + fx * s + fy * c); ctx.closePath(); ctx.fill();
    if (!FLASH) { ctx.fillStyle = e.ph2 ? 'rgba(255,60,40,0.5)' : 'rgba(255,200,80,0.45)'; circ(jx - 10, jy, 3 + P.jaw * 3); }
  }
  part(SPR.head, ox + NECK[0], oy + NECK[1], 0, NECK[0], NECK[1]);
  part(SPR.jaw, JAWH[0] + ox, JAWH[1] + oy, ja, JAWH[0], JAWH[1]);
  // eyes: glowing slits, a blink now and then (amber, deep red in phase 2, white flashes when it winds up)
  const blink = e.state === 'idle' && e.t % 230 < 5;
  if (!blink) {
    const col = eyeCol(e, P);
    R(-77 + ox, -96 + oy, 11, 2, col); R(-77 + ox, -94 + oy, 9, 1, col); R(-94 + ox, -92 + oy, 7, 2, col);
    if (!FLASH) { R(-71 + ox, -97 + oy, 3, 1, '#ffffff'); R(-90 + ox, -93 + oy, 2, 1, '#ffffff'); }
    if (!FLASH && (e.ph2 || P.eye)) { ctx.fillStyle = e.ph2 ? 'rgba(255,40,30,0.3)' : 'rgba(255,230,120,0.32)'; circ(-72 + ox, -95 + oy, 7); circ(-90 + ox, -91 + oy, 5); }
  } else { R(-78 + ox, -95 + oy, 12, 1, B0); R(-95 + ox, -91 + oy, 8, 1, B0); }
  // a glint sweeping along the visor now and then
  const sw = e.t % 170;
  if (!FLASH && sw < 16 && e.state !== 'dying') {
    const x = -58 - sw * 2.7, sn = (cx, cy, rx, ry) => Math.abs(x - cx) < rx ? cy - ry * Math.sqrt(1 - ((x - cx) / rx) ** 2) : 0;
    const top = Math.round(-94 + (x + 101) * -8 / 45), bot = Math.round(Math.min(-84 + (x + 99) * -4 / 43, sn(-90, -80, 18, 10), sn(-78, -84, 10, 8)));
    if (bot - top > 3) { R(Math.round(x) + ox, top + 1 + oy, 1, bot - top - 1, 'rgba(255,255,255,0.45)'); R(Math.round(x) + 1 + ox, top + 2 + oy, 1, bot - top - 3, 'rgba(255,255,255,0.25)'); }
  }
  ctx.restore();
}

function drawTorso(e, P) {
  const s = e.ph2 ? SPR.torso2 : SPR.torso;
  ctx.save(); ctx.translate(Math.round(P.hip[0]), Math.round(P.hip[1]) + P.br);
  if (Math.abs(P.th) >= 0.03) ctx.rotate(P.th);
  ctx.drawImage(FLASH ? s.white : s.img, s.x0 - HIP[0], s.y0 - HIP[1]);
  const cx = CORE[0] - HIP[0], cy = CORE[1] - HIP[1];
  if (!FLASH) {
    // warning light on the hump
    R(LIGHT[0] - HIP[0] - 1, LIGHT[1] - HIP[1] - 1, 3, 2, e.t % 40 < 20 ? EVIL : '#5a1a1a');
    if (!e.ph2) {
      // the glow leaking through the hatch slit
      const k = 0.6 + Math.sin(e.t * 0.12) * 0.4;
      R(cx - 6, cy - 1, 13, 1, k > 0.5 ? K3 : K2); R(cx - 4, cy - 1, 9, 1, k > 0.8 ? K4 : K3);
    } else {
      // the exposed core: pulsing rings of light (brighter while the laser charges)
      const ch = e.state === 'laser' ? clamp(e.st / 50, 0, 1) : 0, pul = Math.sin(e.t * 0.2);
      if (e.state !== 'dying') { ctx.fillStyle = 'rgba(80,220,255,' + (0.18 + ch * 0.3).toFixed(2) + ')'; circ(cx, cy, 11 + ch * 6 + pul); }
      disc(cx, cy, 7, K1); disc(cx, cy, 6 + Math.round(pul * 0.6 + ch), K2); disc(cx, cy, 4 + Math.round(ch * 2), K3); disc(cx - 1, cy - 1, 1 + Math.round(ch * 2), K4);
      // a torn cable swinging out of the hole, sparking at its end
      const sw = Math.sin(e.t * 0.09) * 3, cx0 = -8 - HIP[0], cy0 = -99 - HIP[1];
      for (let i = 0; i < 9; i++) R(Math.round(cx0 - 2 + sw * i / 9), cy0 + i, 2, 1, i % 3 ? M0 : '#3b3f46');
      if (e.t % 9 < 4) { R(Math.round(cx0 - 3 + sw), cy0 + 9, 3, 2, K4); R(Math.round(cx0 - 2 + sw), cy0 + 11, 1, 1, '#ffffff'); }
      // electric arcs over the torn plate
      if (e.state !== 'dying' && hsh(Math.floor(e.t / 3) * 0.37) > 0.55) {
        const ax = -36 - HIP[0] + Math.floor(hsh(e.t * 0.11) * 26), ay = -108 - HIP[1];
        for (let i = 0; i < 6; i++) R(ax + i, ay + Math.round((hsh(e.t + i) - 0.5) * 6), 1, 2, i % 2 ? K3 : K4);
      }
    }
  }
  ctx.restore();
}

// a 4-point twinkle (claw glints)
function twinkle(x, y, s) {
  x = Math.round(x); y = Math.round(y);
  R(x - s, y, s * 2 + 1, 1, '#fff6c8'); R(x, y - s, 1, s * 2 + 1, '#fff6c8');
  if (s > 2) R(x - 1, y - 1, 3, 3, '#ffffff');
}

// its shadow on the grass: a flat pixel ellipse just under the ground line
function drawShadow(e) {
  const k = e.state === 'dying' ? clamp(1 - e.st / 160, 0.25, 1) : 1;
  ctx.fillStyle = 'rgba(22,16,28,' + (0.3 * k).toFixed(2) + ')';
  for (let j = 0; j < 4; j++) { const w = Math.round(84 * Math.sqrt(1 - ((j + 0.5) / 4.2) ** 2)); ctx.fillRect(-18 - w, j, w * 2, 1); }
  ctx.fillStyle = 'rgba(22,16,28,' + (0.18 * k).toFixed(2) + ')';
  for (let j = 0; j < 2; j++) { const w = Math.round(60 - j * 14); ctx.fillRect(-18 - w, j, w * 2, 1); }
}

function drawBearFx(e, P) {
  // pound and swipe: the raised claws glint
  for (let i = 0; i < P.glint; i++) { const c = P.claws[i]; twinkle(c[0], c[1], i ? 2 : 2 + ((G.t >> 2) % 3)); }
  // swipe: three claw trails following the paw's arc
  const sm = P.smear;
  if (sm) {
    const al = Math.max(0, 1 - sm.t / 16);
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = 'rgba(255,255,255,' + (al * (0.9 - i * 0.22)).toFixed(2) + ')'; ctx.lineWidth = 3 - i;
      ctx.beginPath(); ctx.arc(P.sh[0][0], P.sh[0][1], sm.r - 8 + i * 8, Math.min(sm.a0, sm.a1), Math.max(sm.a0, sm.a1)); ctx.stroke();
    }
  }
  // roar: rings out of the mouth and a big comic ROAR!
  for (const r of e.rings) {
    const k = r.t / 30;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.8 * (1 - k)).toFixed(2) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(P.mouth[0] - r.t * 2, P.mouth[1], 6 + r.t * 3, 4 + r.t * 2.2, 0, Math.PI * 0.55, Math.PI * 1.45); ctx.stroke();
  }
  if (e.roarT > 0) {
    const j = Math.round((hsh(e.t * 0.7) - 0.5) * 3);
    text('ROAR!', P.mouth[0] - 34 + j, P.mouth[1] - 40 + j, e.ph2 ? '#ff6a50' : '#ffe066', 2, 'center', '#3a1200');
  }
}

function drawBear(e) {
  const P = e.P || rig(e);
  ctx.save(); ctx.translate(Math.round(e.x), Math.round(e.y));
  drawShadow(e);
  FLASH = e.hitT > 2;
  drawLeg(P, 1);
  if (!e.lost.pawF) drawArm(P, 1);
  drawLeg(P, 0);
  drawTorso(e, P);
  drawHead(e, P);
  if (!e.lost.pawN) drawArm(P, 0);
  if (!e.lost.paul) part(e.ph2 ? SPR.paul2 : SPR.paul, P.sh[0][0], P.sh[0][1] + P.br, P.th, SH[0][0], SH[0][1]);
  FLASH = false;
  drawBearFx(e, P);
  ctx.restore();

// ============================================================
// Behaviour
// ============================================================
const wolvesAlive = () => G.enemies.filter(w => w.type === 'wolf' && !w.dead && !w.dying && w.state !== 'dying').length;
function go(e, s) { e.state = s; e.st = 0; }
function toIdle(e) {
  if (!e.ph2 && e.hp < e.max / 2) { go(e, 'phase2'); e.inv = true; return; }
  go(e, 'idle');
  // a breather between attacks (about 2.4 s, 1.9 s in phase 2: time for a child to read the next telegraph): longer
  // while its wolves run about, and after the hero got hit (a moment to recover)
  e.rest = Math.round(e.ph2 ? rand(106, 120) : rand(136, 150)) + (wolvesAlive() ? 30 : 0) + (G.p.inv > 0 || G.p.dead ? 45 : 0);
  // prowl to a new spot, but never walk up to the hero: the swipe is only for heroes who come close themselves
  const L = e.ax;
  e.tx = Math.min(L + 452, Math.max(L + rand(360, 430), G.p.x + REACH + 8));
}
function nextAttack(e) {
  const p = G.p;
  if (!p.dead && p.x > e.x - REACH + 4 && e.last !== 'swipe') return 'swipe';
  const seq = e.ph2 ? ['laser', 'roar', 'pound', 'toss', 'pound', 'laser', 'toss', 'pound', 'toss', 'pound'] : ['toss', 'pound'];
  let a = seq[e.atk % seq.length];
  // no laser while wolves run about (ducking under it with a wolf at your heels isn't fair): it waits its turn
  if (a === 'laser' && wolvesAlive()) return e.last === 'pound' ? 'toss' : 'pound';
  e.atk++;
  if (a === 'roar' && (wolvesAlive() >= 2 || !ENEMY_TYPES.wolf)) a = 'toss';
  if (a === 'laser') e.lane = e.lasers++ % 2 ? 'low' : 'high';
  return a;
}

function dustAt(x, n, s = 1) {
  const gy = groundAt(x);
  for (let i = 0; i < n; i++) G.parts.push({ type: 'dust', x: x + rand(-6, 6) * s, y: gy - rand(0, 4), vx: rand(-1.4, 1.4) * s, vy: rand(-0.9, -0.2), life: rand(22, 36), max: 36, size: rand(3, 5) * s });
}
function earth(x, n) {
  const gy = groundAt(x);
  for (let i = 0; i < n; i++) G.parts.push({ type: 'debris', x: x + rand(-8, 8), y: gy - 2, vx: rand(-2, 2), vy: rand(-3.6, -1.2), g: 0.22, life: rand(30, 50), max: 50, size: rand(2, 3) | 0, c: i % 3 ? '#6b4a2e' : '#4f8a3a' });
}
function fly(s, x, y, vx, vy, vr, life = 120) {
  G.parts.push({ type: 'sprite', s, x, y, vx, vy, g: 0.22, rot: 0, vr, life, max: life });
}

function slam(e) {
  const x = e.x - 84;
  G.shake = Math.max(G.shake, 9);
  Snd.boom(true); sfx.thud(1.4);
  dustAt(x, 14, 1.4); dustAt(e.x - 64, 8, 1.2); earth(x, 12);
  G.treeShake = Math.max(G.treeShake || 0, 26);
  G.eb.push({ k: 'mbwave', x: x - 6, y: groundAt(x) - 3, vx: e.ph2 ? -2.9 : -2.5, vy: 0, life: 230, t: 0 });   // faster in phase 2
}

function callWolves(e) {
  const n = Math.min(2, 3 - wolvesAlive());
  for (let i = 0; i < n; i++) {
    const side = i === 0 ? -1 : 1, w = makeEnemy({ t: 'wolf', x: side < 0 ? G.cam.x - 18 : G.cam.x + W + 18, side });
    if (w.dead) continue;
    w.active = true; w.facing = -side;
    G.enemies.push(w); e.pups.push(w);
  }
}

function burst(e, P) {
  // phase 2: plates and the chest hatch blow off, the core shows
  const T = P.T;
  const c = T(CORE), hm = T([-20, -108]);
  boom(e.x + c[0], e.y + c[1], 0.9);
  sparks(e.x + c[0], e.y + c[1], 14, K3); sparks(e.x + hm[0], e.y + hm[1], 12);
  fly(BITS.hatch, e.x + c[0], e.y + c[1], -2.2, -4.2, -0.3, 140);
  BITS.plates.forEach((s, i) => fly(s, e.x + hm[0] + i * 6 - 8, e.y + hm[1], rand(-2.4, 2.2), rand(-5, -3), rand(-0.4, 0.4), 130));
  G.sflash = Math.max(G.sflash, 0.35); G.shake = Math.max(G.shake, 10);
  sfx.crack();
}

function stepIntro(e) {
  const st = e.st, L = e.ax;
  if (st === 1) { G.treeShake = Math.max(G.treeShake || 0, 90); sfx.rumble(); }
  if (st < 64) {
    // tremors before it shows up: the ground shakes harder and harder
    if (st % 16 === 1) {
      G.shake = Math.max(G.shake, 1.5 + st / 20); sfx.thud(0.4 + st / 80);
      for (let i = 0; i < 4; i++) dustAt(L + rand(20, W - 20), 2, 0.8);
    }
    return;
  }
  if (st === 64) {
    G.treeShake = Math.max(G.treeShake || 0, 70);
    for (let i = 0; i < 26; i++) G.parts.push({ type: 'debris', x: L + W + rand(-6, 10), y: e.y - rand(20, 120), vx: rand(-3.2, -0.6), vy: rand(-2.4, 0.6), g: 0.12, life: rand(50, 90), max: 90, size: rand(2, 3) | 0, c: ['#ffc7da', '#ffffff', '#f48fb1', '#6b4a2e', '#4f8a3a'][i % 5] });
    sfx.crack(); sfx.thud(1.2);
  }
  if (!e.arrived) {
    e.x = Math.max(L + 396, e.x - 3.2);
    if (e.x <= L + 396) { e.arrived = st; dustAt(e.x - 70, 10, 1.3); dustAt(e.x + 30, 8, 1.2); sfx.thud(1.2); G.shake = Math.max(G.shake, 6); }
    return;
  }
  const r = st - e.arrived;
  if (r === 8) { sfx.roar(true); say('Mega Bear!', 0.7, 0.9); G.shake = Math.max(G.shake, 10); e.roarT = 56; G.treeShake = Math.max(G.treeShake || 0, 40); }
  if (r >= 8 && r < 60 && r % 9 === 0) e.rings.push({ t: 0 });
  if (r >= 88) { e.inv = false; toIdle(e); e.rest = 100; }    // time to step back from a hero it pushed against the wall
}

function stepIdle(e) {
  if (!e.ph2 && e.hp < e.max / 2) { go(e, 'phase2'); e.inv = true; return; }
  if (Math.abs(e.tx - e.x) > 1) e.x += Math.sign(e.tx - e.x) * (e.ph2 ? 0.8 : 0.55);
  if (e.st >= e.rest) { const a = nextAttack(e); e.last = a; go(e, a); }
}

function stepToss(e) {
  const st = e.st, p = G.p;
  if (st === 1) { e.n = e.ph2 ? 3 : e.tosses++ < 1 ? 1 : 2; sfx.grunt(); }   // rocks this time
  if (st === 14) {
    // the paw digs a cluster of granite out of the ground; rings mark where each one will land
    const px = e.x - 86;
    dustAt(px, 10, 1.1); earth(px, 10); sfx.thud(0.9); G.shake = Math.max(G.shake, 3);
    const L = e.ax, hi = e.x - WALL - 10, base = clamp(p.x, L + 16, hi);
    let xs = e.n === 1 ? [base] : e.n === 2 ? [base, base + (base - 70 < L + 16 ? 70 : -70)] : [base, base - 64, base + 64];
    xs = xs.map(x => clamp(x, L + 16, hi));
    if (e.n === 3 && xs[2] - xs[0] < 24) xs[2] = xs[0] - 46;
    e.rocks = xs.map(tx => { const b = { k: 'mbrock', x: e.x - 90, y: e.y - 20, vx: 0, vy: 0, g: 0, r: 0, life: 600, held: true, tx, t: 0, spin: 0 }; G.eb.push(b); return b; });
  }
  if (st === 41) {
    sfx.whoosh();
    e.rocks.forEach((b, i) => {
      if (b.life <= 0) return;
      const T = 48 + i * 7, gy = groundAt(b.tx);
      b.held = false; b.r = 7; b.g = 0.24;
      b.vx = (b.tx - b.x) / T; b.vy = (gy + 0.5 - b.y - b.g * T * (T - 1) / 2) / T;
      b.spin = i % 2 ? 1 : -1;
    });
  }
  if (st >= 82) toIdle(e);
}

function stepPound(e) {
  const st = e.st;
  if (st === 1) sfx.rise();
  if (st === 30) sfx.growl();
  if (st === 54) slam(e);
  if (st >= 84) toIdle(e);
}

function stepSwipe(e, P) {
  const st = e.st, p = G.p;
  if (st === 1) sfx.growl();
  if (st === 24) sfx.glint();
  if (st === 35) sfx.whoosh();
  if (st >= 35 && st <= 42 && !p.dead) {
    const gy = groundAt(e.x - 120), zone = { x: e.x - REACH, y: gy - 70, w: REACH - WALL + 6, h: 70 };
    if (overlap(zone, pbox(p))) {
      const inv = p.inv;
      hurtPlayer();
      if (p.inv > inv && !p.ride) { p.kb = -5.5; p.vy = -3; }
    }
  }
  if (st === 39) { const pw = P.pawN; sparks(e.x + pw[0], e.y + pw[1], 6, '#ffffff'); }
  if (st >= 70) toIdle(e);
}

// The chest laser. HIGH: after the aim line a long beam shoots across the screen and stays ~45 frames (duck!).
// LOW: a short pulse of light rolls along the ground (jump it!); "JUMP!" lights up ~22 frames before it reaches the
// hero, also before it fires when the hero stands close.
function stepLaser(e, P) {
  const st = e.st, ln = LANES[e.lane], low = e.lane === 'low', p = G.p;
  if (st === 1) {
    sfx.charge();
    e.beam = { ph: 'aim', y: Math.round(e.y + ln.y), tip: 0, tail: 0, src: 0, cue: 0, t: 0 };
    G.eb.push({ k: 'mbbeam', x: e.x - 60, y: e.y - 40, vx: 0, vy: 0, life: 9999, owner: e });
  }
  const bm = e.beam;
  if (!bm) { if (e.beamEnd && st >= e.beamEnd + 22) { e.beamEnd = 0; toIdle(e); } return; }
  const src = e.x + P.core[0] - 4, L = e.ax;
  bm.src = src; bm.t = st;
  if (st < AIM) {
    bm.tip = bm.tail = src;
    // energy flows into the core
    if (st % 2 === 0) { const a = rand(0, Math.PI * 2), d = rand(18, 32); G.parts.push({ type: 'spark', x: e.x + P.core[0] + Math.cos(a) * d, y: e.y + P.core[1] + Math.sin(a) * d, vx: -Math.cos(a) * d / 12, vy: -Math.sin(a) * d / 12, life: 12, max: 12, size: 1, c: st % 4 ? K3 : K4 }); }
    if (st === AIM - 14) sfx.whine();
  } else {
    if (st === AIM) { bm.ph = 'fire'; sfx.beam(); G.sflash = Math.max(G.sflash, 0.2); G.shake = Math.max(G.shake, 4); }
    if (!low) {
      bm.tail = src; bm.tip = Math.max(L - 20, src - (st - AIM) * 14);
      if (st === AIM + 44) bm.ph = 'fade';
      if (st >= AIM + 50) { e.beamEnd = st; e.beam = null; return; }
    } else {
      bm.tip = src - (st - AIM) * PULSE; bm.tail = Math.min(src, bm.tip + PLEN);
      if (bm.tail < L - 10) { e.beamEnd = st; e.beam = null; return; }
    }
    if (bm.ph === 'fire') {
      if ((st - AIM) % 24 === 12) sfx.hum();
      G.shake = Math.max(G.shake, 1.2);
      const r = low ? { x: bm.tip, y: bm.y - 4, w: bm.tail - bm.tip, h: 8 } : { x: bm.tip, y: bm.y - 3, w: bm.tail - bm.tip, h: 6 };
      if (!p.dead && overlap(r, pbox(p))) hurtPlayer();
      // sparks: LOW scorches the ground under the pulse, HIGH showers a few onto the grass below it
      if (low) for (let i = 0; i < 2; i++) { const x = bm.tip + rand(0, 10); G.parts.push({ type: 'spark', x, y: groundAt(x) - 1, vx: rand(-0.8, 1.6), vy: rand(-2.6, -0.8), g: 0.15, life: rand(10, 18), max: 18, size: 1, c: i ? K3 : '#ffffff' }); }
      else if (st % 2 === 0) { const x = rand(Math.max(bm.tip, G.cam.x), bm.tail - 10); G.parts.push({ type: 'spark', x, y: bm.y + 3, vx: rand(-0.6, 0.6), vy: rand(0.2, 1.2), g: 0.15, life: rand(14, 24), max: 24, size: 1, c: st % 6 < 3 ? K3 : K4 }); }
    }
  }
  // the LOW cue: frames until the pulse's front reaches the hero
  if (low && !bm.cue && !p.dead) {
    const arrive = AIM + (src - (p.x + 6)) / PULSE - st;
    if (arrive <= 22) { bm.cue = st; sfx.ding(); }
  }
}

function stepRoar(e) {
  const st = e.st;
  if (st === 16) { sfx.roar(false); e.roarT = 48; G.shake = Math.max(G.shake, 6); G.treeShake = Math.max(G.treeShake || 0, 40); dustAt(e.x - 80, 6, 1.2); }
  if (st >= 16 && st < 60 && st % 9 === 7) e.rings.push({ t: 0 });
  if (st === 26) callWolves(e);
  if (st >= 84) toIdle(e);
}

function stepPhase2(e, P) {
  const st = e.st;
  if (st === 1) sfx.crack();
  if (st < 24 && st % 4 === 0) { const q = P.T([rand(-50, 40), rand(-110, -60)]); sparks(e.x + q[0], e.y + q[1], 5); }
  if (st === 24) { e.ph2 = true; e.atk = 0; burst(e, P); }
  if (st === 30) { sfx.roar(true); e.roarT = 46; G.treeShake = Math.max(G.treeShake || 0, 40); }
  if (st >= 30 && st < 70 && st % 9 === 3) e.rings.push({ t: 0 });
  if (st >= 96) { e.inv = false; toIdle(e); }
}

function stepDying(e, P) {
  const st = e.st, T = P.T;
  G.shake = Math.max(G.shake, 3);
  if (st % 7 === 0 && st < 140) { const q = T([rand(-60, 50), rand(-110, -40)]); boom(e.x + q[0], e.y + q[1], rand(0.6, 1.15)); }
  if (st % 3 === 0) sparks(e.x + rand(-80, 50), e.y - rand(30, 100), 3);
  if (st % 5 === 0) G.parts.push({ type: 'smoke', x: e.x + rand(-40, 40), y: e.y - rand(60, 110), vx: rand(-0.3, 0.3), vy: -0.9, life: 60, max: 60, size: 6 });
  const lose = (k, s, q, vx, vy, vr) => { if (e.lost[k]) return; e.lost[k] = true; fly(s, e.x + q[0], e.y + q[1], vx, vy, vr, 380); };
  if (st === 30) lose('paul', BITS.paul, P.sh[0], -1.6, -4.6, -0.25);
  if (st === 52) { BITS.plates.forEach((s, i) => fly(s, e.x + rand(-30, 30), e.y - rand(70, 100), rand(-2.6, 2.6), rand(-5.5, -3), rand(-0.5, 0.5), 200)); sfx.crack(); }
  if (st === 72) { lose('head', BITS.head, P.neck, -2.4, -6.2, -0.16); sfx.crack(); boom(e.x + P.neck[0], e.y + P.neck[1], 1.2); }
  if (st === 92) { lose('pawN', BITS.paw, P.arms[0].wr, -1.8, -3.8, 0.3); lose('pawF', BITS.paw, P.arms[1].wr, 1.2, -4.4, -0.3); }
  if (st === 104) { const q = P.pipes[0]; fly(BITS.pipe, e.x + q[0], e.y + q[1], 1.6, -5, 0.4, 200); fly(BITS.pipe, e.x + q[0] + 14, e.y + q[1], 2.4, -4.4, -0.5, 200); }
  if (st > 118 && st % 4 === 0) G.sflash = Math.max(G.sflash, 0.12);
  if (st === 150) {
    const c = T([0, -70]);
    boom(e.x + c[0], e.y + c[1], 2.8);
    for (let i = 0; i < 7; i++) G.later.push({ t: 4 + i * 6, x: e.x + rand(-80, 50), y: e.y - rand(10, 90), s: rand(1.2, 1.9) });
    debris(e.x, e.y - 60, 26, B2); debris(e.x, e.y - 60, 16, M3); debris(e.x, e.y - 40, 10, M1);
    // the wreck flies apart: torso chunks, legs and arms tumble out of the blast
    for (const c of BITS.chunks) { const q = T([c.cx, c.by]); fly(c.s, e.x + q[0], e.y + q[1], clamp(c.cx * 0.05, -2.6, 2.6) + rand(-0.5, 0.5), rand(-6.2, -3.6), rand(-0.3, 0.3), 420); }
    BITS.limbs.forEach((s, i) => fly(s, e.x + (i % 2 ? -50 : 24), e.y - 6 - i * 10, (i % 2 ? -1 : 1) * rand(1, 2.4), rand(-5.4, -3.4), rand(-0.4, 0.4), 420));
    G.sflash = 0.6; G.shake = 14; G.treeShake = Math.max(G.treeShake || 0, 60);
    G.texts.push({ x: e.x - 40, y: e.y - 130, s: 'MEGA BEAR DOWN!', t: 140, c: '#ffe066' });
    bossDefeated(e);
  }
}

function updBear(e) {
  const p = G.p, x0 = e.x;
  e.y = groundAt(e.x);
  e.st++;
  if (e.roarT > 0) e.roarT--;
  for (const r of e.rings) r.t++;
  e.rings = e.rings.filter(r => r.t < 30);
  e.rocks = e.rocks.filter(b => b.life > 0);
  let P = rig(e);
  switch (e.state) {
    case 'intro': stepIntro(e); break;
    case 'idle': stepIdle(e); break;
    case 'toss': stepToss(e); break;
    case 'pound': stepPound(e); break;
    case 'swipe': stepSwipe(e, P); break;
    case 'laser': stepLaser(e, P); break;
    case 'roar': stepRoar(e); break;
    case 'phase2': stepPhase2(e, P); break;
    case 'dying': stepDying(e, P); break;
  }
  if (e.dead) return;
  if (e.state !== 'intro') e.x = clamp(e.x, e.ax + 340, e.ax + 452);       // stays in its arena
  // walking gait from how far it moved
  e.mv = e.x - x0;
  const sp = Math.abs(e.mv);
  if (sp > 0.05) e.stride = sp > 2 ? 26 : 14;
  e.walk = clamp(e.walk + (sp > 0.05 ? 0.1 : -0.05), 0, 1);
  const g0 = e.gait;
  e.gait += -e.mv * 0.62 / e.stride;
  if (sp > 2 && Math.floor(g0 * 2) !== Math.floor(e.gait * 2)) { sfx.thud(0.7); G.shake = Math.max(G.shake, 3); dustAt(e.x - 70, 3); dustAt(e.x + 30, 3); }
  P = e.P = rig(e);
  // the hero can't walk into it: a wall in front of the claws (a ride is pushed back by its box)
  if (e.state !== 'dying' && !p.dead) {
    const pb = pbox(p), lim = e.x - WALL + 6;
    if (pb.x + pb.w > lim) p.x -= pb.x + pb.w - lim;
  }
  // boulders ride in the paw until they are thrown
  e.rocks.forEach((b, i) => { if (b.held) { b.x = e.x + P.pawN[0] + (i - (e.rocks.length - 1) / 2) * 7; b.y = e.y + P.pawN[1] - 9 - (i % 2) * 4; } });
  // its thick plating takes half the punch out of the battle tractor's machine-gun bullets (b.rideGun, vehicle.js), so
  // the tractor shortens the fight without ending it in seconds; its cannon shells still hit hard
  if (e.state !== 'dying') {
    const bx = ebox(e);
    for (const b of G.pb) if (b.rideGun && !b.mbr && inBox(b.x + b.vx, b.y + b.vy, bx)) { b.mbr = 1; b.dmg *= 0.5; }
  }
  // the exposed core takes double damage: shots about to enter the body at its height hit it
  if (e.ph2 && !e.inv && e.state !== 'dying') {
    const bx = ebox(e), cy = e.y + P.core[1];
    for (const b of G.pb) {
      if (b.mbc || b.onHit || b.life <= 1) continue;
      const nx = b.x + b.vx, ny = b.y + b.vy;
      if (!inBox(b.x, b.y, bx) && inBox(nx, ny, bx) && Math.abs(ny - cy) <= 8) {
        b.mbc = 1; b.dmg *= 2;
        sparks(nx, ny, 5, K3); sfx.ping();
        G.texts.push({ x: nx, y: ny - 10, s: 'x2', t: 24, c: K3 });
      }
    }
  }
  // armour feedback: bits of plate fly off when it gets hit
  if (e.hp < e.lastHp && e.state !== 'dying' && e.t % 3 === 0) debris(e.x - 70, e.y - rand(20, 90), 1, rand(0, 1) < 0.5 ? M3 : B2);
  e.lastHp = e.hp;
  // exhaust smoke (thick and dark once it's damaged), sparks from the torn plates
  const smokeEvery = e.state === 'dying' ? 3 : e.ph2 ? 6 : 12;
  if (e.t % smokeEvery === 0) for (const q of P.pipes) G.parts.push({ type: 'smoke', x: e.x + q[0], y: e.y + q[1] - 2, vx: rand(0.2, 0.7), vy: rand(-1.3, -0.7), life: e.ph2 ? 70 : 46, max: 70, size: e.ph2 ? 4 : 3 });
  if (e.ph2 && e.state !== 'dying' && e.t % 26 === 0) { const q = P.T([rand(-32, -8), -110]); sparks(e.x + q[0], e.y + q[1], 3, K3); }
  if (e.ph2 && e.state !== 'dying' && e.t % 11 === 0) { const q = P.T([rand(-28, -12), -112]); G.parts.push({ type: 'smoke', x: e.x + q[0], y: e.y + q[1], vx: rand(0.1, 0.5), vy: rand(-0.8, -0.5), life: 50, max: 50, size: 2 }); }
}

// ============================================================
// Projectiles
// ============================================================
// where a boulder will land: blinking brackets on the ground, the falling rock's growing shadow, a dotted drop line
// and a "!" sign above head height (drawn with the boulder, over the hero)
function drawMark(b) {
  const x = Math.round(b.tx), gy = Math.round(groundAt(b.tx)), on = Math.floor(b.t / 5) % 2 === 0, c = on ? '#ff3b30' : '#ffe066';
  const k = b.held ? 0 : clamp(1 - (gy - b.y) / 150, 0, 1);
  ctx.fillStyle = 'rgba(20,16,30,' + (0.18 + k * 0.4).toFixed(2) + ')';
  ctx.beginPath(); ctx.ellipse(x, gy, 4 + k * 7, 1.5 + k * 1.5, 0, 0, Math.PI * 2); ctx.fill();
  R(x - 10, gy - 1, 4, 2, c); R(x + 7, gy - 1, 4, 2, c); R(x - 7, gy - 3, 14, 1, c); R(x - 7, gy + 1, 14, 1, c);
  for (let y = gy - 8; y > gy - 40; y -= 4) R(x, y, 1, 2, on ? c : 'rgba(255,224,102,0.55)');
  RO(x - 3, gy - 53, 7, 12, on ? '#ff3b30' : '#c0392b'); R(x - 1, gy - 51, 3, 5, '#ffffff'); R(x - 1, gy - 45, 3, 2, '#ffffff');
}

// granite boulders: carried in the paw, thrown at a marked spot, shootable, crumble on the ground
EB_TYPES.mbrock = {
  r: 7, shootable: true,
  update(b) {
    b.t++;
    if (!b.held && b.t % 3 === 0) G.parts.push({ type: 'dust', x: b.x, y: b.y, vx: -b.vx * 0.2, vy: 0, life: 14, max: 14, size: 2 });
  },
  draw(b) {
    drawMark(b);
    const f = b.held ? 0 : ((Math.floor(b.t / 5) * b.spin) % 4 + 4) % 4;
    spr(SPR.rocks[f], b.x - 8, b.y - 7);
  },
  onGround(b) {
    const gy = groundAt(b.x);
    debris(b.x, gy - 4, 8, GR2); debris(b.x, gy - 4, 4, GR1); dustAt(b.x, 6);
    G.shake = Math.max(G.shake, 3); sfx.thud(0.8);
  },
  onHit(b) { debris(b.x, b.y, 8, GR2); }
};

// the ground pound's shockwave: a rolling ridge of earth with rocks popping out of it (jump over it!)
EB_TYPES.mbwave = {
  r: 5,               // hurts feet lower than 8px over the ground (the crest is drawn 20px tall: clearing it is easy)
  update(b) {
    b.t++; b.y = groundAt(b.x) - 3;
    if (b.t % 4 === 0) G.parts.push({ type: 'dust', x: b.x + 6, y: b.y + 3, vx: rand(0.2, 0.9), vy: rand(-0.7, -0.2), life: 22, max: 22, size: 3 });
    if (b.t % 7 === 0) G.parts.push({ type: 'debris', x: b.x, y: b.y - 4, vx: rand(-0.6, 1.4), vy: rand(-3.2, -1.8), g: 0.2, life: 30, max: 30, size: 2, c: b.t % 14 ? '#6b4a2e' : '#4f8a3a' });
  },
  draw(b) {

// what to do, over the hero's head: DUCK! for HIGH; for LOW an arrow, then JUMP! when the pulse is close
function drawHint(e, bm) {

EB_TYPES.mbbeam = {

// Registry

ENEMY_TYPES.megabear = {

}

//    closes in (nearest trees first) and opens up (misty depths first) instead.
//  weather(): { rain, rainbow, wind } from the camera (drizzle ~3200, downpour 3500-4000, clear by 4200, rainbow after).
//  drawOverlay: rain and splashes, petals, leaves, butterflies, light tints (screen space, after the world).

// Scenes: each one is visible for a camera range (its crossfades included); its layer strips are wide enough for it
// ============================================================
const BOUNDS = [1350, 2850, 4400], FADE = 150;   // area starts (camera centre) and the half-width of each crossfade

// A Galician house: whitewashed or granite walls, red tile roof, a door and windows
function house(px, x, base, w, h, o) {
  o = o || {};
  const lx = o.lx || 1, wall = o.wall || '#f1ece1', wallD = o.wallD || '#cfc8bb', roof = o.roof || '#cf603f', roofL = o.roofL || '#e07a52', roofD = o.roofD || '#9c432c';
  px.rect(x, base - h, w, h, P(wall));
  px.col(lx > 0 ? x : x + w - 1, base - h, base, P(wallD));
  if (o.stone) for (let y = base - h + 2; y < base; y += 3) for (let k = x + ((y >> 1) & 1) * 2; k < x + w - 1; k += 4) px.dot(k, y, P(wallD));
  const rh = o.rh || Math.max(2, Math.round(w / 4));
  for (let i = 0; i < rh; i++) px.rect(x - 1 + i, base - h - 1 - i, w + 2 - i * 2, 1, P(i === 0 ? roofD : i === rh - 1 ? roofL : roof));
  if (w >= 6 && h >= 4) {
    const dx = x + Math.floor(w * (hsh(x * 1.3) > 0.5 ? 0.3 : 0.6));
    px.rect(dx, base - Math.min(4, h - 1), Math.max(1, w >> 3), Math.min(4, h - 1), P(o.door || '#6b4a33'));

  }
  if (o.chimney) px.rect(x + (lx > 0 ? w - 4 : 2), base - h - rh - 2, 2, 3, P(wallD));
}

// Eucalyptus: a tall pale trunk, a narrow crown of drooping blue-green clumps
function eucalyptus(px, x, base, h, pal) {
  const top = Math.round(base - h), lean = hsh(x * 1.9) > 0.5 ? 1 : -1;
  px.col(x, top + 4, base, P(pal[0]));
  px.col(x + 1, top + Math.round(h * 0.45), base, P(pal[4]));

    px.disc(cx, cy, r, P(pal[1]));

    if (k < 3 && hsh(x * 5.3 + k) > 0.4) px.dot(cx + 1, cy - r + 0.5, P(pal[3]));
  }
}
// A grove: tallest in the middle, crowns overlapping
function grove(px, x, base, n, h, pal) {
  for (let k = 0; k < n; k++) {
    const t = n > 1 ? k / (n - 1) : 0.5, hh = h * (0.7 + 0.3 * Math.sin(t * Math.PI)) * (0.85 + 0.3 * hsh(x * 2 + k));

}
// Maritime pine: a bare trunk under an irregular flat crown
function pine(px, x, base, h, pal) {

}

// A round leafy tree in clumps, three tones
function leafy(px, x, base, r, pal, lx) {

function horreo(px, x, base, w) {

// Ferns: fronds fanning out from the base
function fern(px, x, base, s, c1, c2) {
  for (let k = -3; k <= 3; k++) {

      else if (z < 0.3) { px.rect(x, y, 1, 6, P('#4c8646')); if (hsh(x * 1.3 + k) > 0.6) px.dot(x, y, P('#5f9a55')); }
    }

  }

    else if (r < 0.32) { pine(px, x + 2, e + 3, 11 + hsh(x * 3) * 7, HILL_PAL.pine); pine(px, x + 9, e + 4, 9 + hsh(x * 5) * 6, HILL_PAL.pine); x += 24; }
    else if (r < 0.5) { // a village: a few houses on the slope, one with a little church gable

}

const MID_TREE = ['#2f6b37', '#3f8a43', '#62ad55', '#5b4030'];
// The hillside closer by: granite walls with hydrangeas, vine pergolas, round trees, a granite house, a horreo
function homeMid(px, chim) {
  const X1 = px.w - 10;
  const edge = x => 189 - 9 * fbm(x / 64, 51, 3) - 4 * Math.sin(x / 47);
  px.fill(-10, X1, edge, P('#4f9446'));
  for (let x = -10; x < X1; x++) {
    const e = Math.round(edge(x));
    px.dot(x, e, P(edge(x + 2) > edge(x - 2) ? '#9ccf62' : '#6aae52'));
    if (hsh(x * 1.1) > 0.7) px.dot(x, e - 1, P('#4a8c44'));
    for (let k = 1; k < 5; k++) if (fbm(x / 40 + k * 5, 52, 2) > 0.55) px.rect(x, e + 4 + k * 8, 1, 4, P(k % 2 ? '#559a4a' : '#5fa552'));
  }

    if (r < 0.22) { leafy(px, x + 10, e + 4, 8 + hsh(x * 3) * 5, MID_TREE, 1); x += 26; }
    else if (r < 0.36) {

    else if (r < 0.66) {

      px.rect(x, e + 1, n * 8 + 4, 3, P('#b5afa2')); for (let k = x + 1; k < x + n * 8 + 3; k += 4) px.dot(k, e + 2, P('#8f897d'));
      for (let k = 0; k < n; k++) { const c = [['#7f9fe8', '#b8ccff'], ['#e98ac4', '#ffc4e6'], ['#a98ae0', '#d6c4ff']][Math.floor(hsh(x + k) * 3)]; hydrangea(px, x + 4 + k * 8, e + 4, 4, c[0], c[1]); }

      for (let k = x + 2; k < x + n * 5; k += 3) if (hsh(k * 7) > 0.5) px.rect(k, e - 5, 1, 2, P('#5a2e5a'));
