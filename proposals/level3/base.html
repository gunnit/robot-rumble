// ---- src/audio.js ----
'use strict';
// ============================================================
// Sound (all generated, no files needed)
// ============================================================
const Snd = {
  ac: null, out: null, sfxBus: null, musBus: null, nbuf: null,
  init() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ac = new AC();
      this.out = this.ac.createGain(); this.out.gain.value = 0.6; this.out.connect(this.ac.destination);
      this.sfxBus = this.ac.createGain(); this.sfxBus.gain.value = 0.8; this.sfxBus.connect(this.out);
      this.musBus = this.ac.createGain(); this.musBus.gain.value = 0.3; this.musBus.connect(this.out);
      const len = this.ac.sampleRate * 2;
      this.nbuf = this.ac.createBuffer(1, len, this.ac.sampleRate);
      const d = this.nbuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } catch (e) { this.ac = null; }
  },
  tone(type, f1, f2, dur, vol, delay = 0, bus) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay = 0, bus) {
    if (!this.ac) return;
    const t = this.ac.currentTime + delay;
    const s = this.ac.createBufferSource(); s.buffer = this.nbuf;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(freq * 0.2, 40), t + dur);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },
  shoot() { this.tone('square', 880, 220, 0.07, 0.1); },
  hmg() { this.tone('square', 520, 140, 0.05, 0.08); this.noise(0.05, 0.1, 4000); },
  laser() { this.tone('sawtooth', 700, 300, 0.12, 0.05); },
  jump() { this.tone('square', 220, 520, 0.12, 0.06); },
  hit() { this.tone('square', 260, 120, 0.04, 0.07); },
  clank() { this.tone('square', 1300, 700, 0.03, 0.05); },
  boom(big) {
    this.noise(big ? 1.1 : 0.5, big ? 0.7 : 0.45, big ? 900 : 1400);
    this.tone('sine', big ? 90 : 140, 30, big ? 0.9 : 0.4, big ? 0.5 : 0.35);
  },
  cannon() { this.noise(0.25, 0.35, 1500); this.tone('sine', 200, 60, 0.2, 0.3); },
  throw() { this.tone('triangle', 300, 700, 0.15, 0.12); },
  hurt() { this.tone('sawtooth', 480, 90, 0.35, 0.18); },
  die() { [523, 392, 330, 262].forEach((f, i) => this.tone('square', f, f * 0.98, 0.18, 0.12, i * 0.15)); },

  slash() { this.noise(0.08, 0.2, 6000); },
  select() { this.tone('square', 660, 660, 0.06, 0.1); },

// Spoken lines use the browser's built-in voice
function say(text, pitch = 1, rate = 1) {

    if (!window.speechSynthesis) return;

// Chiptune music: one entry per eighth note, 0 = rest (MIDI note numbers).
// Optional per track: lead (melody oscillator, default 'square') and
// drums: { kick, snare, hat } patterns with one char per step, 'x' = hit; a drum left out is silent.
// Without drums a track gets the 4/4 beat (BEAT44).
const TRACKS = {
  main: {
    bpm: 150,
    bass: [45, 45, 57, 45, 45, 57, 45, 57, 43, 43, 55, 43, 43, 55, 43, 55, 41, 41, 53, 41, 41, 53, 41, 53, 40, 40, 52, 40, 40, 52, 44, 47],

          69, 72, 76, 81, 79, 0, 76, 0, 74, 0, 71, 0, 67, 71, 74, 0, 72, 74, 76, 77, 76, 0, 72, 0, 71, 0, 68, 0, 64, 0, 0, 0]
  },
  boss: {
    bpm: 172,
    bass: [40, 40, 52, 40, 40, 52, 40, 50, 40, 40, 52, 40, 40, 52, 40, 50, 36, 36, 48, 36, 36, 48, 36, 48, 38, 38, 50, 38, 38, 50, 40, 43],
    mel: [64, 0, 0, 67, 0, 0, 71, 0, 70, 0, 0, 67, 0, 0, 64, 0, 60, 0, 0, 64, 0, 0, 67, 0, 66, 0, 62, 0, 66, 0, 71, 0]
  }

const Music = {
  track: null, step: 0, next: 0, on: true,
  play(name) {
    this.track = TRACKS[name] || null; this.step = 0; this.next = 0;
    if (!this.track) warnOnce('music track', name);
  },
  stop() { this.track = null; },
  update() {
    const ac = Snd.ac;
    if (!ac || !this.track || !this.on) return;
    const tr = this.track, sd = 60 / tr.bpm / 2, dr = tr.drums || BEAT44;
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.03;
    while (this.next < ac.currentTime + 0.12) {
      const i = this.step, d = this.next - ac.currentTime;
      const b = tr.bass[i % tr.bass.length], m = tr.mel[i % tr.mel.length];
      if (b) Snd.tone('triangle', mf(b), mf(b), sd * 0.9, 0.5, d, Snd.musBus);
      if (m) Snd.tone(tr.lead || 'square', mf(m), mf(m), sd * 0.85, 0.11, d, Snd.musBus);
      if (drumHit(dr.kick, i)) Snd.tone('sine', 150, 45, 0.12, 0.6, d, Snd.musBus);
      if (drumHit(dr.hat, i)) Snd.noise(0.04, 0.12, 8000, d, Snd.musBus);
      if (drumHit(dr.snare, i)) Snd.noise(0.1, 0.25, 2500, d, Snd.musBus);
      this.step++;
      this.next += sd;
    }
  }
};

  if (!back) R(lx, y, 1, 8, h.pantsD);
  RO(lx, y + 8, 5, 3, back ? BOOTD : BOOT);
  R(lx, y + 10, 5, 1, SOLE);
  if (!back) R(lx + 1, y + 8, 3, 1, BOOTL);
}
function flashAt(x, y, big) {
  const a = big ? 6 : 4;
  R(x - a, y - 1, a * 2 + 1, 3, '#ffb52e'); R(x - 1, y - a, 3, a * 2 + 1, '#ffb52e');
  R(x - 2, y - 2, 5, 5, '#ffe066'); R(x - 1, y - 1, 3, 3, '#ffffff');
}

// Draws a hero with feet at (x, y). o = { pose, t, aim, weapon, muzzle, knife, rot }
function drawHero(h, x, y, facing, o) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));
  ctx.scale(facing, 1);
  if (o.rot) { ctx.translate(0, -14); ctx.rotate(o.rot); ctx.translate(0, 14); }
  const crouch = o.pose === 'crouch';
  let legs = [[-4, 0], [0, 0]], bob = 0;
  if (o.pose === 'run') { const f = Math.floor(o.t / 4) % 6; legs = RUN6[f]; bob = f === 2 || f === 5 ? -1 : 0; }
  else if (o.pose === 'jump') legs = [[-5, 3], [1, 1]];
  else if (o.pose === 'idle') bob = Math.floor(o.t / 32) % 2;
  const dy = (crouch ? 8 : 0) + bob, ty = -21 + dy;
  const r = o.muzzle > 2 ? 1 : 0; // recoil

  // back leg
  if (crouch) { RO(-8, -6, 7, 3, h.pantsD); RO(-9, -3, 5, 3, BOOTD); R(-9, -1, 5, 1, SOLE); }
  else heroLeg(h, legs[0][0], legs[0][1], true);
  // backpack + ponytail
  RO(-9, ty + 1, 4, 7, h.pack); R(-9, ty + 1, 4, 1, h.packL); R(-8, ty + 4, 2, 1, OUT);
  if (h.tail) spr(h.tail, -13, ty - 11 + (o.pose === 'run' ? Math.floor(o.t / 6) % 2 : 0) - (o.pose === 'jump' ? 1 : 0));
  // rear arm: its hand steadies the gun
  if (!o.knife && o.aim === 'fwd') { RO(-2, ty + 4, 8, 2, h.outD); RO(6 - r, ty + 4, 2, 2, SKIND); }
  // hips + torso
  RO(-5, -13 + dy, 10, 2, h.pants);
  RO(-5, ty, 10, 9, h.out);
  R(-5, ty, 2, 9, h.outD); R(-3, ty, 7, 1, h.outL); R(4, ty + 1, 1, 6, h.outL);
  R(-1, ty, 3, 1, SKIND);
  for (let i = 0; i < 7; i++) R(-4 + i, ty + 1 + i, 2, 1, h.strap);
  R(-5, ty + 7, 10, 2, '#4a2f1b'); R(1, ty + 7, 2, 2, h.acc);
  // head
  spr(h.head, -7, ty - h.head.h + 1);
  // front leg
  if (crouch) { RO(-1, -7, 7, 3, h.pants); RO(4, -5, 3, 3, h.pants); RO(3, -3, 6, 3, BOOT); R(3, -1, 6, 1, SOLE); R(4, -3, 4, 1, BOOTL); }
  else heroLeg(h, legs[1][0], legs[1][1], false);
  // front arm + weapon
  if (o.knife > 0) {
    RO(-1, ty + 2, 5, 3, h.out); RO(4, ty + 3, 5, 2, SKIN);
    RO(9, ty + 2, 8, 2, '#dfe6e9'); R(9, ty + 3, 8, 1, '#95a5a6'); RO(7, ty + 2, 2, 3, '#5b3a1e');
    ctx.strokeStyle = 'rgba(255,255,255,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(4, ty + 4, 17, -1.3, 1.1); ctx.stroke();
  } else {
    const wp = weaponOf(o.weapon);
    if (o.aim === 'up') { RO(1, ty - 2, 3, 5, h.out); RO(4, ty - 5, 3, 3, SKIN); }
    else if (o.aim === 'down') { RO(0, ty + 3, 3, 5, h.out); RO(0, ty + 8, 3, 2, SKIN); }
    else { R(-1, ty + 2, 5, 3, h.out); R(-1, ty + 2, 5, 1, h.outL); R(-1, ty + 5, 5, 1, OUT); R(-2, ty + 2, 1, 3, h.outD); RO(4 - r, ty + 3, 3, 2, SKIN); }
    wp.drawGun(o.aim, ty, r);
    if (o.muzzle > 0) {
      const m = wp.muzzle(o.aim);
      if (wp.flash) wp.flash(m[0], m[1] + dy - bob, o.aim); else flashAt(m[0], m[1] + dy - bob, wp.bigFlash);
    }
  }
  ctx.restore();
}

<script>
// ---- src/weapons.js ----
'use strict';
// ============================================================
// Weapons: name -> { label, ammo, maxAmmo, cd, tapCd?, muzzle(aim), fire(p, mx, my, dx, dy),
//   drawGun(aim, ty, r), icon(x, y), bigFlash?, flash?(x, y, aim) }  (see docs/engine-api.md)
// ============================================================
const GUN = '#6f7a86', GUNL = '#b8c2cc', GUND = '#3c434d';
const WEAPONS = {};

// Weapon by name; unknown names fall back to the pistol
function weaponOf(name) {
  const w = WEAPONS[name];
  if (w) return w;
  if (name) warnOnce('weapon', name);
  return WEAPONS.pistol;
}

// Spent shell flying out of the gun
function casing(p, size) {
  G.parts.push({ type: 'debris', x: p.x + p.facing * 5, y: p.y - 21 + (p.crouch ? 8 : 0), vx: -p.facing * rand(0.6, 1.4), vy: -rand(1.6, 2.6), g: 0.2, life: 40, max: 40, size, c: '#e8b43a' });
}

WEAPONS.pistol = {
  label: 'PISTOL', ammo: Infinity, maxAmmo: Infinity, cd: 9, tapCd: 4,
  muzzle: aim => aim === 'up' ? [5, -37] : aim === 'down' ? [1, -2] : [16, -19],
  fire(p, mx, my, dx, dy) {
    G.pb.push({ x: mx, y: my, vx: dx * 6, vy: dy * 6, dmg: 1, life: 90 });
    casing(p, 1);
    Snd.shoot();
  },
  drawGun(aim, ty, r) {
    if (aim === 'up') { RO(4, ty - 14 + r, 3, 9, GUN); R(5, ty - 14 + r, 1, 9, GUNL); }
    else if (aim === 'down') { RO(0, ty + 10 - r, 3, 8, GUN); R(1, ty + 10 - r, 1, 8, GUNL); }
    else {
      RO(6 - r, ty + 1, 9, 3, GUN); R(6 - r, ty + 1, 9, 1, GUNL); R(13 - r, ty + 2, 2, 1, GUND);
      RO(7 - r, ty + 4, 3, 3, GUND);
    }
  },
  icon(x, y) { RO(x + 2, y, 9, 3, GUN); R(x + 2, y, 9, 1, GUNL); RO(x + 3, y + 3, 3, 3, GUND); }
};

function hmgShot(b) {
  const x = Math.round(b.x), y = Math.round(b.y);
  if (Math.abs(b.vy) > Math.abs(b.vx)) { R(x - 1, y - 5, 2, 10, '#ffb52e'); R(x - 1, y - 2, 2, 4, '#ffffff'); }
  else { R(x - 5, y - 1, 10, 2, '#ffb52e'); R(x - 2, y - 1, 4, 2, '#ffffff'); }
}

WEAPONS.hmg = {
  label: 'H.M.G.', ammo: 200, maxAmmo: 400, cd: 4, tapCd: 4, bigFlash: true,
  muzzle: aim => aim === 'up' ? [5, -45] : aim === 'down' ? [1, 1] : [24, -19],
  fire(p, mx, my, dx, dy) {
    const s = (Math.random() - 0.5) * 0.8;
    G.pb.push({ x: mx, y: my, vx: dx ? dx * 7 : s, vy: dy ? dy * 7 : s, dmg: 1, life: 90, draw: hmgShot });
    casing(p, 2);
    Snd.hmg();
  },
  drawGun(aim, ty, r) {
    if (aim === 'up') { RO(3, ty - 18 + r, 5, 13, GUND); R(4, ty - 18 + r, 1, 13, GUN); RO(4, ty - 22 + r, 3, 4, GUN); RO(8, ty - 13 + r, 4, 5, '#5a6270'); }
    else if (aim === 'down') { RO(-1, ty + 9 - r, 5, 12, GUND); R(0, ty + 9 - r, 1, 12, GUN); }
    else {
      RO(2 - r, ty, 13, 5, GUND); R(3 - r, ty, 11, 1, GUN); R(4 - r, ty + 2, 8, 1, '#262b33');
      RO(15 - r, ty + 1, 7, 2, GUN); RO(21 - r, ty, 2, 4, GUND);
      RO(5 - r, ty + 5, 5, 4, '#5a6270'); R(5 - r, ty + 5, 5, 1, '#7f8a99');
    }
  },
  icon(x, y) { RO(x, y, 14, 4, GUND); R(x + 1, y, 12, 1, GUN); RO(x + 14, y + 1, 4, 2, GUN); RO(x + 3, y + 4, 4, 3, '#5a6270'); }
};

<script>
// ---- src/engine.js ----
'use strict';
// ============================================================
// Engine: registries, game state, mission flow, physics, player, enemies,
// bullets, props, prisoners, items, effects, camera, locks, update()
// ============================================================
const LEVELS = [];          // LEVELS[0] = mission 1, LEVELS[1] = mission 2
let LV = null;              // current level definition (set by startMission / devStart)
const ENEMY_TYPES = {};     // name -> enemy type
const PROP_TYPES = {};      // kind -> prop type (crate, barrel live in level1.js)
const POW_KINDS = {};       // kind -> prisoner/animal type ('human' lives in level1.js)
const ITEMS = {};           // item letter/kind -> pickup
const RIDES = {};           // ride type -> vehicle (vehicle.js)
const EB_TYPES = {};        // custom enemy-projectile kinds

// ============================================================
// Game state
// ============================================================
const G = {
  state: 'title', t: 0, hero: 0, level: 0, score: 0, lives: 3, best: 0, time: 0, checkpoint: 0, section: 0,
  cam: { x: 0 }, p: null, enemies: [], pb: [], eb: [], grenades: [], props: [], pows: [], items: [],
  parts: [], rings: [], texts: [], later: [], markers: [], locks: [], fw: [], sflash: 0,
  freed: new Set(), continues: 0, fade: 0, shake: 0, banner: null, big: null, goT: 0, warnT: 0, winT: 0, overT: 0, endT: 0,
  intro: false, introKeys: {}, lockT: 0
};
try { G.best = +localStorage.getItem('robotRumbleBest') || 0; } catch (e) {}
window.G = G;
const dbg = { god: false, onHurt: null }; // onHurt(sectionIndex) is called for every hit the player takes
window.dbg = dbg;

function saveBest() {
  if (G.score > G.best) {
    G.best = G.score;
    try { localStorage.setItem('robotRumbleBest', String(G.best)); } catch (e) {}
  }
}

function newPlayer(x) {
  return {
    x, y: groundAt(x), vx: 0, vy: 0, kb: 0, facing: 1, onGround: true, onPlat: null, crouch: false, aim: 'fwd', t: 0,
    hearts: 3, inv: 0, fireCd: 0, muzzle: 0, knife: 0, weapon: 'pistol', ammo: 0, bombs: 10, dropT: 0, dead: 0, rot: 0, ride: null
  };
}

// Stand-in for an enemy type nobody has written yet. makeEnemy returns one (already dead, so nothing touches it and
// updateEnemies drops it) instead of null, so content can push or set up whatever makeEnemy returns.
ENEMY_TYPES['?'] = { hp: 1, contact: 'none', update() {}, draw() {}, box: e => ({ x: e.x, y: e.y, w: 0, h: 0 }) };

function makeEnemy(s, lock) {
  const known = !!ENEMY_TYPES[s.t], type = ENEMY_TYPES[known ? s.t : '?'];
  if (!known) warnOnce('enemy type', s.t);
  const e = { type: known ? s.t : '?', x: s.x, y: s.y || groundAt(s.x), vx: 0, vy: 0, t: 0, hitT: 0, facing: -1, active: false, dead: !known, lock: lock || null, hp: type.hp || 1, max: 0 };
  if (type.make) type.make(e, s);
  if (!e.max) e.max = e.hp;
  return e;
}

function makeProp(s) {
  const type = PROP_TYPES[s.k];
  if (!type) { warnOnce('prop kind', s.k); return null; }
  const o = { ...s, y: s.y != null ? s.y : groundAt(s.x), hitT: 0, dead: false };
  if (type.make) type.make(o, s);
  return o;
}

function powKind(k = 'human') {
  if (POW_KINDS[k]) return k;
  warnOnce('POW kind', k);
  return 'human';
}

// Build the current level (LV) from checkpoint x = cp
function loadLevel(cp) {
  G.cam.x = cp;
  G.p = newPlayer(cp === 0 && LV.heroStart != null ? LV.heroStart : cp + 60);
  G.enemies = LV.spawns.filter(s => s.x >= cp + 40).map(s => makeEnemy(s)).filter(e => !e.dead);
  G.pows = LV.pows.map((o, i) => ({ id: i, x: o.x, y: groundAt(o.x), item: o.item, kind: powKind(o.kind), state: 'tied', t: 0 })).filter(o => o.x >= cp);
  G.props = LV.props.filter(o => o.x >= cp).map(makeProp).filter(Boolean);
  G.locks = LV.locks.map(l => ({ ...l, done: l.at < cp, active: false, t: 0, queue: [] }));
  G.pb = []; G.eb = []; G.grenades = []; G.items = []; G.parts = []; G.rings = [];
  G.texts = []; G.later = []; G.markers = [];
  G.section = Math.max(0, LV.sections.findIndex(s => s.x === cp));
  G.banner = { s: LV.sections[G.section].name, t: 200 };
  G.big = { s: 'MISSION START!', t: 130 };
  G.shake = 0; G.goT = 0; G.warnT = 0; G.winT = 0; G.intro = false;
  if (LV.load) LV.load(cp);
}

// ============================================================
// Mission flow
// ============================================================
// Fresh run from the hero select screen
function startGame() {
  G.score = 0;
  startMission(G.level);
}

// Start mission i from its beginning (hero and score carry over)
function startMission(i) {
  G.level = i; LV = LEVELS[i];
  beginMission(0, true);
}

// Fresh lives and timers, LV built for camera x cp. The intro (if LV has one) only plays when asked: fresh starts,
// not devStart jumps.
function beginMission(cp, intro) {
  G.lives = 3; G.time = 0; G.checkpoint = 0; G.freed = new Set(); G.continues = 0; G.fade = 1;
  loadLevel(cp);
  G.state = 'play';
  Music.play(LV.music || 'main');
  G.intro = !!(intro && LV.intro);
  // the intro owns the opening banners and voice; player controls come from G.introKeys until it ends
  if (G.intro) { G.banner = null; G.big = null; G.introKeys = {}; prevIntroKeys = {}; LV.intro.start(); }
  else say('Mission start!');
}

function continueGame() {
  G.lives = 3; G.continues++; G.fade = 1;
  loadLevel(G.checkpoint);
  G.state = 'play';
  Music.play(LV.music || 'main');
  say('Mission start!');
}

function toWin() {
  G.state = 'win'; G.endT = 0; G.fw = []; G.fade = 0.8;
  saveBest();
  Music.stop(); Snd.win();
  say('Mission complete!');
}

// ============================================================
// Effects
// ============================================================
function boom(x, y, s = 1) {
  const n = Math.round(9 * s) + 3;
  G.parts.push({ type: 'flash', x, y, life: 5, max: 5, size: 16 * s });
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), d = rand(0, 9 * s);
    G.parts.push({ type: 'fire', x: x + Math.cos(a) * d, y: y + Math.sin(a) * d * 0.8, vx: Math.cos(a) * rand(0.3, 1.5) * s, vy: Math.sin(a) * rand(0.3, 1.2) * s - 0.5, life: rand(18, 34), max: 34, size: rand(4, 8) * s });
  }
  for (let i = 0; i < n * 0.7; i++) G.parts.push({ type: 'smoke', x: x + rand(-8, 8) * s, y: y + rand(-8, 4) * s, vx: rand(-0.5, 0.5), vy: rand(-0.9, -0.3), life: rand(40, 70), max: 70, size: rand(4, 8) * s });
  for (let i = 0; i < n; i++) G.parts.push({ type: 'spark', x, y, vx: rand(-3.5, 3.5), vy: rand(-4, 1), g: 0.18, life: rand(15, 30), max: 30, size: 2 });
  G.rings.push({ x, y, r: 24 * s, t: 0, max: 10 });
  G.shake = Math.max(G.shake, 3 * s);
  if (s >= 1.5) G.sflash = Math.max(G.sflash, Math.min(0.6, s * 0.2));
  Snd.boom(s > 1.3);
}
function dust(x, y, n, dir = 0) {
  for (let i = 0; i < n; i++) G.parts.push({ type: 'dust', x: x + rand(-3, 3), y: y - rand(0, 3), vx: (dir || (i % 2 ? 1 : -1)) * rand(0.2, 0.9), vy: rand(-0.5, -0.1), life: rand(16, 26), max: 26, size: rand(2, 4) });
}
function sparks(x, y, n = 4, c = '#ffe066') {
  for (let i = 0; i < n; i++) G.parts.push({ type: 'spark', x, y, vx: rand(-2, 2), vy: rand(-2.5, 0.5), g: 0.15, life: rand(8, 16), max: 16, size: 1, c });
}
function debris(x, y, n, c) {
  for (let i = 0; i < n; i++) G.parts.push({ type: 'debris', x: x + rand(-4, 4), y: y + rand(-4, 4), vx: rand(-2.2, 2.2), vy: rand(-3.5, -1), g: 0.22, life: rand(40, 70), max: 70, size: rand(2, 4) | 0, c });
}
function addScore(n, x, y) {
  G.score += n;
  G.texts.push({ x, y, s: String(n), t: 50, c: '#ffffff' });
}

// Damage area: src 'player' / 'barrel' hurts enemies, 'enemy' hurts the player
function blast(x, y, r, dmg, src) {
  boom(x, y, r / 24);
  if (src === 'enemy') {
    if (!G.p.dead && distToBox(x, y, pbox(G.p)) < r * 0.8) hurtPlayer();
    return;
  }
  for (const e of G.enemies) if (e.active && !e.dead && distToBox(x, y, ebox(e)) < r) damageEnemy(e, dmg);
  for (const o of G.props) { const b = !o.dead && propBox(o); if (b && distToBox(x, y, b) < r) hitProp(o, 99, src); }
  for (const o of G.pows) if (o.state === 'tied' && Math.abs(o.x - x) < r) freePow(o);
}

// ============================================================
// Collision boxes
// ============================================================
function pbox(p) {
  if (p.ride) return RIDES[p.ride.type].box(p, p.ride);
  const h = p.crouch ? 24 : 32; return { x: p.x - 6, y: p.y - h, w: 12, h };
}
function ebox(e) { return ENEMY_TYPES[e.type].box(e); }
function propBox(o) { return PROP_TYPES[o.k].box(o); } // null = can't be hit
function powBox(o) { const k = POW_KINDS[o.kind]; return k.box ? k.box(o) : { x: o.x - 8, y: o.y - 32, w: 18, h: 32 }; }

// One-way platforms + terrain. Walkers that were on the ground stick to it going downhill.
function land(e, prevY) {
  const stick = e.onGround && !e.onPlat;
  e.onGround = false; e.onPlat = null;
  if (e.vy < 0) return;
  const gy = groundAt(e.x);
  if (e.y >= gy || (stick && gy - e.y < 6)) { e.y = gy; e.vy = 0; e.onGround = true; return; }
  if (e.dropT > 0) return;
  for (const pl of LV.plats) {
    if (prevY <= pl.y + 0.01 && e.y >= pl.y && e.x > pl.x - 3 && e.x < pl.x + pl.w + 3) {
      e.y = pl.y; e.vy = 0; e.onGround = true; e.onPlat = pl; return;
    }
  }
}

// ============================================================
// Player
// ============================================================
// Player controls: the keyboard, or the intro's scripted keys (G.introKeys) while a cutscene runs.
// An intro key counts as tapped on the first player update that sees it, keys set in intro.start() included
// (prevIntroKeys = the keys the last player update saw, {} at the start).
let prevIntroKeys = {};
const ctl = a => G.intro ? !!G.introKeys[a] : held(a);
const ctlTap = a => G.intro ? !!G.introKeys[a] && !prevIntroKeys[a] : tap(a);

function hurtPlayer() {
  const p = G.p;
  if (dbg.god || p.inv > 0 || p.dead || G.winT > 0 || G.state !== 'play' || G.intro) return;
  if (dbg.onHurt) dbg.onHurt(G.section);
  if (p.ride) { RIDES[p.ride.type].hurt(p, p.ride); return; }
  p.hearts--;
  G.shake = Math.max(G.shake, 4);
  if (p.hearts <= 0) {
    p.dead = 1; p.vy = -4.5; p.vx = -p.facing * 1.3; p.rot = 0; p.knife = 0; p.muzzle = 0;
    Snd.die();
  } else {
    p.inv = 100; p.kb = -p.facing * 2.6; p.vy = -2.4; p.onGround = false;
    Snd.hurt();
  }
}

function playerRespawn() {
  const old = G.p;
  G.lives--;
  if (G.lives > 0) {
    const p = newPlayer(clamp(old.x, G.cam.x + 40, G.cam.x + W - 60));
    p.y = -20; p.onGround = false; p.inv = 180; p.bombs = Math.max(10, old.bombs);
    G.p = p;
  } else {
    G.state = 'over'; G.overT = 600;
    saveBest();
    Music.stop();
    say('Game over', 0.8, 0.9);
  }
}

// Rides (vehicles): while p.ride is set, RIDES[p.ride.type] moves, boxes, draws and takes hits for the player
function boardRide(p, ride) {
  if (!RIDES[ride.type]) { warnOnce('ride', ride.type); return false; }
  p.ride = ride; p.vx = 0; p.vy = 0; p.kb = 0; p.crouch = false; p.knife = 0; p.muzzle = 0; p.aim = 'fwd';
  return true;
}
function exitRide(p, ejected) {
  const ride = p.ride;
  p.ride = null; p.onGround = false; p.onPlat = null; p.crouch = false;
  p.vy = ejected ? -5 : -3.6;
  if (ejected) { p.inv = Math.max(p.inv, 120); p.kb = -p.facing * 2; }
  return ride;
}

function knifeTarget(p) {
  for (const e of G.enemies) {
    if (!e.active || e.dead || offStage(e) || !ENEMY_TYPES[e.type].melee) continue; // no slashing at a dying wolf
    const dx = e.x - p.x;
    if (Math.abs(dx) < 20 && (Math.sign(dx) === p.facing || Math.abs(dx) < 6) && Math.abs(e.y - p.y) < 20) return e;
  }
  return null;
}

// Weapon pickup: switch to it, or top up its ammo when already holding it
function giveWeapon(p, name) {
  const w = WEAPONS[name];
  if (!w) { warnOnce('weapon', name); return; }
  if (p.weapon === name) p.ammo = Math.min(w.maxAmmo, p.ammo + w.ammo); else { p.weapon = name; p.ammo = w.ammo; }
}

function shoot(p) {
  const wp = weaponOf(p.weapon), m = wp.muzzle(p.aim);
  const mx = p.x + (m[0] - (p.aim === 'fwd' ? 6 : 0)) * p.facing, my = p.y + m[1] + (p.crouch ? 8 : 0);
  wp.fire(p, mx, my, p.aim === 'fwd' ? p.facing : 0, p.aim === 'up' ? -1 : p.aim === 'down' ? 1 : 0);
  p.muzzle = 4; p.fireCd = wp.cd;
  if (wp.ammo !== Infinity && --p.ammo <= 0) { p.weapon = 'pistol'; p.ammo = 0; }
}

function updatePlayer() {
  const p = G.p;
  if (p.dead) {
    p.dead++;
    p.vy += 0.25; p.x += p.vx; p.y += p.vy;
    const gy = groundAt(p.x);
    if (p.y >= gy) { p.y = gy; p.vy *= -0.3; p.vx *= 0.6; p.rot = -Math.PI / 2; }
    else p.rot -= 0.15;
    if (p.dead > 110) playerRespawn();
    return;
  }
  p.t++;
  if (p.inv > 0) p.inv--;
  if (p.ride) { RIDES[p.ride.type].update(p, p.ride); return; }
  const L = ctl('left'), Rt = ctl('right'), U = ctl('up'), D = ctl('down');
  const mv = L && !Rt ? -1 : Rt && !L ? 1 : 0;
  if (mv) p.facing = mv;
  p.crouch = D && p.onGround;
  p.vx = mv * (p.crouch ? 0.9 : 1.7);
  if (p.kb) { p.vx += p.kb; p.kb *= 0.85; if (Math.abs(p.kb) < 0.15) p.kb = 0; }
  if (ctlTap('jump') && p.onGround) {
    if (D && p.onPlat) { p.dropT = 12; p.y += 1; p.onGround = false; }
    else { p.vy = -5.4; p.onGround = false; Snd.jump(); }
  }
  if (!ctl('jump') && p.vy < -2.6) p.vy = -2.6; // short hop when jump is released early
  p.vy = Math.min(p.vy + 0.26, 6);
  const py = p.y, wasGround = p.onGround, fall = p.vy;
  p.x += p.vx; p.y += p.vy;
  if (p.dropT > 0) p.dropT--;
  land(p, py);
  if (p.onGround && !wasGround && fall > 2) dust(p.x, p.y, 6);
  if (!p.onGround && wasGround && p.vy < 0) dust(p.x, p.y, 3);
  if (p.onGround && p.vx && p.t % 10 === 0) dust(p.x - p.facing * 4, p.y, 1, -p.facing);
  p.crouch = D && p.onGround;
  p.aim = U ? 'up' : (D && !p.onGround ? 'down' : 'fwd');

  if (p.fireCd > 0) p.fireCd--;
  if (p.muzzle > 0) p.muzzle--;
  if (p.knife > 0) p.knife--;
  if ((ctlTap('fire') && p.fireCd <= (weaponOf(p.weapon).tapCd ?? 4)) || (ctl('fire') && p.fireCd <= 0)) {
    const tg = p.aim === 'fwd' ? knifeTarget(p) : null;
    if (tg) { p.knife = 10; p.fireCd = 14; damageEnemy(tg, 2); Snd.slash(); }
    else shoot(p);
  }
  if (ctlTap('bomb') && p.bombs > 0 && G.grenades.length < 2) {
    p.bombs--;
    G.grenades.push({ x: p.x + p.facing * 4, y: p.y - 18 + (p.crouch ? 7 : 0), vx: p.facing * 2.4 + p.vx * 0.4, vy: -3.4, b: 0, t: 0 });
    Snd.throw();
  }
}

// ============================================================
// Enemies
// ============================================================
// An enemy in its intro or death animation doesn't hurt on touch, lets grenades through and shows no boss bar
const offStage = e => e.dying || e.state === 'dying' || e.state === 'intro';

function damageEnemy(e, d) {
  if (e.dead || e.inv || e.dying || e.state === 'dying') return false;
  e.hp -= d; e.hitT = 4;
  if (e.hp <= 0) killEnemy(e);
  else if (ENEMY_TYPES[e.type].armored) Snd.clank();
  else Snd.hit();
  return true;
}

// onKill(e, cx, cy, box) plays the effects and adds score. Returning 'dying' keeps the enemy for its own death
// animation (in any e.state): e.dying makes it immune and harmless until it calls bossDefeated(e) or sets e.dead.
function killEnemy(e) {
  const type = ENEMY_TYPES[e.type], b = ebox(e), cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (!type.onKill) { e.dead = true; boom(cx, cy, 0.8); return; }
  if (type.onKill(e, cx, cy, b) === 'dying') { e.dying = true; e.hitT = 0; } else e.dead = true;
}

function bossDefeated(e) { e.dead = true; G.winT = 210; }

function updateEnemies() {
  const p = G.p;
  for (const e of G.enemies) {
    const type = ENEMY_TYPES[e.type];
    if (!e.active) { if (e.x <= G.cam.x + W + (type.activateMargin ?? 30)) e.active = true; else continue; }
    e.t++;
    if (e.hitT > 0) e.hitT--;
    try { type.update(e); } catch (err) { e.dead = true; errorOnce(err); continue; } // a broken enemy is dropped
    if (!e.dead && !p.dead && !offStage(e)) {
      const c = typeof type.contact === 'function' ? type.contact(e) : type.contact || 'hurt';
      if (c === 'block') {
        // solid enemies push you back (jump over them!) but touching them doesn't hurt.
        // The hero's box is centred on p.x; a ride's box need not be, so it is pushed out by its edges.
        const tb = ebox(e), pb = pbox(p);
        if (overlap(pb, tb) && p.y > tb.y + 8) {
          if (!p.ride) p.x = p.x < e.x ? tb.x - pb.w / 2 : tb.x + tb.w + pb.w / 2;
          else p.x += pb.x + pb.w / 2 < tb.x + tb.w / 2 ? tb.x - (pb.x + pb.w) : tb.x + tb.w - pb.x;
        }
      } else if (c === 'hurt' && overlap(pbox(p), ebox(e))) hurtPlayer();
    }
  }
  G.enemies = G.enemies.filter(e => !e.dead && !(e.x < G.cam.x - 120 && !ENEMY_TYPES[e.type].boss));
}

// ============================================================
// Bullets, grenades, props, prisoners, items
// ============================================================
// Player bullets: { x, y, vx, vy, dmg, life, pierce?, update?(b), draw?(b), onHit?(b, e), onGround?(b), onProp?(b, o), onPow?(b, o) }
// onGround / onProp / onPow replace the default (sparks / hitProp / freePow); the bullet stops unless they return
// exactly true. A bullet whose own hook throws is dropped.
function updateBullets() {
  for (const b of G.pb) try { updateBullet(b); } catch (err) { b.life = 0; errorOnce(err); }
  G.pb = G.pb.filter(b => b.life > 0);
}
function updateBullet(b) {
  if (b.life <= 0) return; // dropped since the last update (its draw failed)
  if (b.update) { b.update(b); if (b.life <= 0) return; } // e.g. a rocket that exploded by itself
  b.x += b.vx; b.y += b.vy; b.life--;
  if (b.x < G.cam.x - 10 || b.x > G.cam.x + W + 10 || b.y < -10 || b.y > H) { b.life = 0; return; }
  const gy = groundAt(b.x);
  if (b.y >= gy) {
    if (b.onGround) { if (b.onGround(b) !== true) b.life = 0; }
    else { b.life = 0; sparks(b.x, gy - 1, 3, '#d9c79a'); }
    return;
  }
  for (const e of G.enemies) {
    if (!e.active || e.dead || (b.hits && b.hits.includes(e))) continue;
    if ((e.dying || e.state === 'dying') && !ENEMY_TYPES[e.type].boss) continue; // flies through a dying enemy (not a boss's wreck)
    if (inBox(b.x, b.y, ebox(e))) {
      if (b.onHit) b.onHit(b, e); else { damageEnemy(e, b.dmg); sparks(b.x, b.y); }
      if (!b.pierce) { b.life = 0; break; }
      (b.hits || (b.hits = [])).push(e); // piercing shots hit each enemy once
    }
  }
  if (b.life <= 0) return;
  for (const o of G.props) {
    const pb = !o.dead && propBox(o);
    if (pb && inBox(b.x, b.y, pb)) {
      if (b.onProp) { if (b.onProp(b, o) !== true) b.life = 0; }
      else { hitProp(o, b.dmg, 'bullet'); b.life = 0; }
      break;
    }
  }
  if (b.life <= 0) return;
  for (const o of G.pows) {
    if (o.state !== 'tied' || !inBox(b.x, b.y, powBox(o))) continue;
    if (b.onPow) { if (b.onPow(b, o) !== true) b.life = 0; }
    else { freePow(o); b.life = 0; }
    break;
  }
  if (b.life <= 0) return;
  for (const s of G.eb) {
    if ((s.shoot || (EB_TYPES[s.k] && EB_TYPES[s.k].shootable)) && Math.hypot(s.x - b.x, s.y - b.y) < 8) { s.life = 0; boom(s.x, s.y, 0.4); b.life = 0; break; }
  }
}

// Enemy projectiles: built-in kinds below, new kinds in EB_TYPES[k] = { r, update?, draw, onGround?, onHit?, shootable? }.
// A kind that is neither is dropped with a warning (it would be invisible but still hurt), one whose hook throws too.
const EB_BUILTIN = new Set(['laser', 'orb', 'mg', 'shell', 'bomb', 'mup', 'mdown', 'wave']);
function updateEnemyBullets() {
  const pb = G.p.dead ? null : pbox(G.p);
  for (const b of G.eb) try { updateEnemyBullet(b, pb); } catch (err) { b.life = 0; errorOnce(err); }
  G.eb = G.eb.filter(b => b.life > 0);
}
function updateEnemyBullet(b, pb) {
  if (b.life <= 0) return; // shot down or dropped since the last update
  const type = EB_TYPES[b.k];
  if (!type && !EB_BUILTIN.has(b.k)) { warnOnce('enemy projectile', b.k); b.life = 0; return; }
  if (type && type.update) type.update(b);
  b.x += b.vx; b.y += b.vy; if (b.g) b.vy += b.g; b.life--;
  if (b.k === 'wave' && G.t % 3 === 0) G.parts.push({ type: 'smoke', x: b.x, y: groundAt(b.x) - 3, vx: 0.5, vy: -0.4, life: 20, max: 20, size: 3 });
  if (b.k === 'mup' && b.y < -20) b.life = 0;
  if (pb && b.life > 0) {
    const hit = b.k === 'wave' ? overlap({ x: b.x - 6, y: groundAt(b.x) - 12, w: 12, h: 12 }, pb) : distToBox(b.x, b.y, pb) < (b.r != null ? b.r : type ? type.r : 3);
    if (hit) {
      hurtPlayer();
      if (type) { if (type.onHit) type.onHit(b); }
      else if (b.k === 'shell' || b.k === 'bomb' || b.k === 'mdown') boom(b.x, b.y, 0.6);
      if (b.k !== 'wave') b.life = 0;
    }
  }
  if (b.life > 0 && b.k !== 'wave') {
    const gy = groundAt(b.x);
    if (b.y >= gy) {
      if (type) { if (!(type.onGround && type.onGround(b) === true)) b.life = 0; } // onGround returns true to keep it (bounce)
      else {
        if (b.k === 'shell' || b.k === 'mdown') blast(b.x, gy - 4, 18, 0, 'enemy');
        else if (b.k === 'bomb') blast(b.x, gy - 4, 16, 0, 'enemy');
        else sparks(b.x, gy - 1, 3, '#ff8a80');
        b.life = 0;
      }
    }
  }
  if (b.x < G.cam.x - 30 || b.x > G.cam.x + W + 30 || b.y > H) b.life = 0;
}

function updateGrenades() {
  for (const g of G.grenades) {
    g.vy += 0.18; g.x += g.vx; g.y += g.vy; g.t++;
    if (G.enemies.some(e => e.active && !e.dead && !offStage(e) && inBox(g.x, g.y, ebox(e)))) {
      g.done = true; blast(g.x, g.y, 30, 6, 'player'); continue;
    }
    const gy = groundAt(g.x);
    if (g.y >= gy - 2) {
      if (g.b === 0) { g.y = gy - 2; g.vy *= -0.45; g.vx *= 0.6; g.b = 1; }
      else { g.done = true; blast(g.x, gy - 6, 30, 6, 'player'); }
    }
    if (g.x > G.cam.x + W + 40 || g.x < G.cam.x - 40) g.done = true;
  }
  G.grenades = G.grenades.filter(g => !g.done);
}

// src: 'bullet' (player shot), 'player' (grenade / player blast) or 'barrel'
function hitProp(o, d, src) { if (!o.dead) PROP_TYPES[o.k].hit(o, d, src); }
// Shared prop damage: flash + click, true once the prop is broken
function propHurt(o, d) {
  o.hp -= d; o.hitT = 3;
  if (o.hp > 0) { Snd.hit(); return false; }
  return true;
}

function updateProps() {
  for (const o of G.props) {
    if (o.hitT > 0) o.hitT--;
    const type = PROP_TYPES[o.k];
    if (type.update) try { type.update(o); } catch (err) { o.dead = true; errorOnce(err); } // a broken prop is dropped
  }
  G.props = G.props.filter(o => !o.dead && o.x > G.cam.x - 60);
}

function freePow(o) {
  if (o.state !== 'tied') return;
  const k = POW_KINDS[o.kind];
  o.state = 'free'; o.t = 0;
  G.freed.add(o.id);
  G.texts.push({ x: o.x, y: o.y - 44, s: k.thanks || 'THANK YOU!', t: 80, c: '#ffe066' });
  addScore(500, o.x, o.y - 32);
  Snd.freed();
  if (k.onFree) k.onFree(o);
}

function updatePows() {
  const p = G.p;
  for (const o of G.pows) {
    o.t++;
    if (o.state === 'tied') {
      if (!p.dead && Math.abs(p.x - o.x) < 12 && Math.abs(p.y - o.y) < 20) freePow(o);
    } else if (o.state === 'free') {
      if (o.t === 24) o.state = 'salute';
    } else if (o.state === 'salute') {
      if (o.t === 40) dropItem(o.item, o.x - 10, o.y - 14, -1);
      if (o.t >= 64) o.state = 'run';
    } else if (o.state === 'run') { o.x -= 2.2; o.y = groundAt(o.x); }
  }
  G.pows = G.pows.filter(o => o.x > G.cam.x - 40);
}

function dropItem(k, x, y, dir) {
  if (!ITEMS[k]) { warnOnce('item', k); return; }
  G.items.push({ k, x, y, vx: dir * 0.6, vy: -2.5, onGround: false, t: 0 });
}

function updateItems() {
  const p = G.p;
  for (const it of G.items) {
    it.t++;
    if (!it.onGround) {
      it.vy = Math.min(it.vy + 0.2, 5);
      const py = it.y;
      it.y += it.vy; it.x += it.vx;
      land(it, py);
      if (it.onGround) it.vx = 0;
    }
    if (!p.dead && it.t > 10 && overlap(pbox(p), { x: it.x - 7, y: it.y - 14, w: 14, h: 14 })) {
      Snd.pickup(); ITEMS[it.k].collect(it, p); it.gone = true;
    }
  }
  G.items = G.items.filter(it => !it.gone && it.x > G.cam.x - 30);
}

// Letter crate pickups (H, B and the other weapon letters)
function letterBox(it, col, top, ink) {
  const x = Math.round(it.x), y = Math.round(it.y);
  RO(x - 6, y - 12, 12, 12, col); R(x - 6, y - 12, 12, 2, top);
  text(it.k, x - 2, y - 10, ink, 1, 'left', null);
  if (it.t % 40 < 6) R(x + 4, y - 15, 2, 2, '#ffffff');
}

ITEMS.H = {
  draw: it => letterBox(it, '#f4d03f', '#fff3a0', '#c0392b'),
  collect(it, p) {
    giveWeapon(p, 'hmg');
    G.texts.push({ x: it.x, y: it.y - 24, s: 'HEAVY MACHINE GUN!', t: 80, c: '#ffe066' });
    say('Heavy machine gun!', 0.7, 1);
  }
};
ITEMS.B = {
  draw: it => letterBox(it, '#58a55c', '#8fd18f', '#ffffff'),
  collect(it, p) {
    p.bombs = Math.min(30, p.bombs + 10);
    G.texts.push({ x: it.x, y: it.y - 24, s: '+10 GRENADES', t: 70, c: '#8be0a8' });
    say('Bombs!', 0.8, 1);
  }
};
ITEMS.heart = {
  draw: it => drawHeart(Math.round(it.x) - 7, Math.round(it.y) - 12, 2, true),
  collect(it, p) {
    if (p.hearts < 3) { p.hearts++; G.texts.push({ x: it.x, y: it.y - 24, s: '+1 HEART', t: 70, c: '#ff8a9a' }); }
    else addScore(500, it.x, it.y - 20);
  }
};
ITEMS.coin = {
  draw(it) {
    const x = Math.round(it.x), y = Math.round(it.y);
    RO(x - 4, y - 9, 8, 8, '#f1c40f'); R(x - 2, y - 8, 2, 5, '#fff6b0'); R(x + 2, y - 7, 1, 5, '#c79a0b');
  },
  collect: it => addScore(500, it.x, it.y - 20)
};

function updateFx() {
  for (const p of G.parts) {
    p.x += p.vx; p.y += p.vy;
    if (p.g) {
      p.vy += p.g;
      const gy = groundAt(p.x);
      if (p.y > gy && p.vy > 0) { p.y = gy; p.vy *= -0.35; p.vx *= 0.6; if (p.vr) p.vr *= 0.5; }
      if (p.vr) p.rot += p.vr;
    } else if (p.type === 'smoke' || p.type === 'dust') { p.vx *= 0.96; p.size += p.type === 'smoke' ? 0.07 : 0.03; }
    else if (p.type === 'fire') { p.vx *= 0.92; p.vy = p.vy * 0.92 - 0.03; }
    p.life--;
  }
  if (G.parts.length > 700) G.parts.splice(0, G.parts.length - 700);
  G.parts = G.parts.filter(p => p.life > 0);
  for (const r of G.rings) r.t++;
  G.rings = G.rings.filter(r => r.t < r.max);
  for (const t of G.texts) { t.t--; t.y -= 0.35; }
  G.texts = G.texts.filter(t => t.t > 0);
  for (const l of G.later) if (--l.t <= 0) { boom(l.x, l.y, l.s); l.done = true; }
  G.later = G.later.filter(l => !l.done);
  for (const m of G.markers) {
    m.t++;
    if (m.t === 50) G.eb.push({ k: 'mdown', x: m.x, y: -10, vx: 0, vy: 2, g: 0.25, r: 4, life: 200, shoot: true });
  }
  G.markers = G.markers.filter(m => m.t < 88);
}

// ============================================================
// Camera, locks, checkpoints
// ============================================================
function updateCamera() {
  const p = G.p;
  let maxCam = LV.end - W;
  const lk = G.locks.find(l => !l.done);
  if (lk) maxCam = Math.min(maxCam, lk.at);
  const target = p.x - W * 0.42;
  if (target > G.cam.x) G.cam.x = Math.min(G.cam.x + Math.min(target - G.cam.x, 4), maxCam);
  if (!p.dead) p.x = clamp(p.x, G.cam.x + 8, G.cam.x + W - 8);
}

// Camera locks: the screen stops scrolling at l.at until its waves are beaten
function updateLocks() {
  const l = G.locks.find(l => !l.done);
  if (!l) return;
  if (!l.active) {
    if (G.cam.x >= l.at - 0.5) {
      l.active = true; l.t = 0; l.queue = l.waves.map(w => ({ ...w }));
      if (l.boss) { G.warnT = 160; Music.play(LV.bossMusic || 'boss'); Snd.noise(1.5, 0.3, 300); }
    }
    return;
  }
  l.t++;
  for (let i = l.queue.length - 1; i >= 0; i--) {
    const w = l.queue[i];
    if (l.t < w.d) continue;
    // wave enemies enter just outside the screen edge (type.edge px, default 16); make(e, spec) gets the whole entry
    const off = (ENEMY_TYPES[w.t] || {}).edge || 16;
    const e = makeEnemy({ ...w, x: w.side > 0 ? G.cam.x + W + off : G.cam.x - off }, l);
    if (!e.dead) { e.active = true; e.facing = -w.side; G.enemies.push(e); }
    l.queue.splice(i, 1);
  }
  if (!l.queue.length && !G.enemies.some(e => e.lock === l)) {
    l.done = true;
    if (!l.boss) { G.goT = 180; Snd.select(); }
  }
}

function updatePlay() {
  if (tap('pause')) { G.state = 'pause'; return; }
  if (G.intro && LV.intro.update()) G.intro = false;
  if (!G.intro) G.time++;
  updatePlayer();
  if (G.intro) prevIntroKeys = { ...G.introKeys }; // what the player has seen: a key set after this is a new tap
  updateCamera();
  updateLocks();
  for (let i = G.section + 1; i < LV.sections.length; i++) {
    if (G.p.x >= LV.sections[i].x + 30) {
      G.section = i; G.checkpoint = LV.sections[i].x;
      G.banner = { s: LV.sections[i].name, t: 200 };
    }
  }
  updateEnemies();
  updateBullets();
  updateEnemyBullets();
  updateGrenades();
  updateProps();
  updatePows();
  updateItems();
  updateFx();
  if (G.banner && --G.banner.t <= 0) G.banner = null;
  if (G.big && --G.big.t <= 0) G.big = null;
  if (G.goT > 0) G.goT--;
  if (G.warnT > 0) G.warnT--;
  G.shake *= 0.88; if (G.shake < 0.2) G.shake = 0;
  if (G.sflash > 0) G.sflash = Math.max(0, G.sflash - 0.03);
  if (LV.update) LV.update();
  if (G.winT > 0 && --G.winT === 0) toWin();
}

// Fireworks over the end screens (one burst every n frames)
function fireworks(n) {
  G.endT++;
  updateFx();
  if (G.endT % n === 0) {
    const x = rand(40, W - 40), y = rand(30, 120), c = ['#ffe066', '#ff6b6b', '#6bd5ff', '#8be0a8', '#d7a6ef'][Math.random() * 5 | 0];
    for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, sp = rand(1, 2.4); G.fw.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 50, c }); }
    Snd.tone('triangle', rand(500, 900), 200, 0.25, 0.05);
  }
  for (const f of G.fw) { f.x += f.vx; f.y += f.vy; f.vy += 0.03; f.vx *= 0.98; f.life--; }
  G.fw = G.fw.filter(f => f.life > 0);
}

// ============================================================
// Main update
// ============================================================
function update() {
  G.t++;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - 0.04);
  if (tap('mute')) Music.on = !Music.on;
  switch (G.state) {
    case 'title':
      if (tap('ok')) { G.state = 'missions'; G.level = clamp(G.level, 0, LEVELS.length - 1); G.fade = 1; Snd.select(); }
      break;
    case 'missions':
      if (G.lockT > 0) G.lockT--;
      if (tap('left') && G.level > 0) { G.level--; Snd.select(); }
      if (tap('right')) {
        if (G.level < LEVELS.length - 1) { G.level++; Snd.select(); }
        else { G.lockT = 30; Snd.tone('square', 140, 90, 0.12, 0.08); } // nothing (unlocked) further right: the padlock shakes
      }
      if (tap('ok')) { G.state = 'select'; G.lockT = 0; G.fade = 1; Snd.select(); } // the padlock shake ends here
      break;
    case 'select':
      if (tap('left') && G.hero !== 0) { G.hero = 0; Snd.select(); }
      if (tap('right') && G.hero !== 1) { G.hero = 1; Snd.select(); }
      if (tap('ok')) startGame();
      break;
    case 'play':
      updatePlay();
      break;
    case 'pause':
      if (tap('pause') || tap('ok')) G.state = 'play';
      break;
    case 'over':
      G.overT--;
      updateFx();
      if (tap('ok') && G.overT < 570) continueGame();
      else if (G.overT <= 0) { G.state = 'title'; G.fade = 1; }
      break;
    case 'win':
      fireworks(22);
      if (G.endT > 120 && tap('ok')) {
        if (G.level + 1 < LEVELS.length) startMission(G.level + 1);
        else if (LEVELS.length > 1) { G.state = 'allclear'; G.endT = 0; G.fw = []; G.fade = 1; Snd.win(); say('All missions complete!'); }
        else { G.state = 'title'; G.fade = 1; } // the only mission (so far): play again, as before Mission 2 existed
      }
      if (G.endT < 90 && G.endT % 4 === 0) Snd.tone('square', 900, 900, 0.03, 0.04);
      if (G.endT === 40 || G.endT === 60 || G.endT === 80) Snd.pickup();
      break;
    case 'allclear':
      fireworks(12);
      if (G.endT > 120 && tap('ok')) { G.state = 'title'; G.fade = 1; }
      break;
  }
  if (G.state !== 'pause') Music.update();
}

// ============================================================
// Drawing: game objects (world space)
// ============================================================
// A prop, enemy or bullet whose draw throws is dropped (gone on the next update); the error goes on to main.js,
// which logs it and puts the canvas right
function drawProp(o) { FLASH = o.hitT > 0; try { PROP_TYPES[o.k].draw(o); } catch (err) { o.dead = true; throw err; } FLASH = false; }
function drawPow(o) { POW_KINDS[o.kind].draw(o); }
function drawItem(it) { ITEMS[it.k].draw(it); }
function drawEnemy(e) { try { ENEMY_TYPES[e.type].draw(e); } catch (err) { e.dead = true; throw err; } }

function drawPlayer() {
  const p = G.p;
  if (p.ride) { RIDES[p.ride.type].draw(p, p.ride); return; }
  if (p.hidden) return; // out of sight, e.g. still inside the house during Mission 2's intro
  if (p.inv > 0 && !p.dead && Math.floor(p.inv / 3) % 2) return;
  const pose = p.dead ? 'jump' : p.crouch ? 'crouch' : !p.onGround ? 'jump' : p.vx ? 'run' : 'idle';
  drawHero(HEROES[G.hero], p.x, p.y, p.facing, { pose, t: p.t, aim: p.aim, weapon: p.weapon, muzzle: p.muzzle, knife: p.knife, rot: p.dead ? p.rot : 0 });
}

function drawGrenades() {
  for (const g of G.grenades) { RO(Math.round(g.x) - 2, Math.round(g.y) - 3, 4, 5, '#3e6b35'); R(Math.round(g.x) - 1, Math.round(g.y) - 4, 2, 1, '#c0c0c0'); }
}

function drawPB(b) {
  if (b.draw) { try { b.draw(b); } catch (err) { b.life = 0; throw err; } return; }
  const x = Math.round(b.x), y = Math.round(b.y);
  if (Math.abs(b.vy) > Math.abs(b.vx)) { R(x - 1, y - 3, 3, 6, '#ffe066'); R(x, y - 2, 1, 4, '#ffffff'); }
  else { R(x - 3, y - 1, 6, 3, '#ffe066'); R(x - 2, y, 4, 1, '#ffffff'); }
}

function drawEB(b) {
  const type = EB_TYPES[b.k];
  if (type) { try { type.draw(b); } catch (err) { b.life = 0; throw err; } return; }
  const x = Math.round(b.x), y = Math.round(b.y);
  switch (b.k) {
    case 'laser': R(x - 3, y - 2, 6, 4, '#ff3b30'); R(x - 2, y - 1, 4, 2, '#ffd6d1'); break;
    case 'orb': {
      const c = G.t % 8 < 4 ? '#ff9f1c' : '#ff5e3a';
      R(x - 4, y - 3, 8, 6, c); R(x - 3, y - 4, 6, 8, c); R(x - 1, y - 1, 3, 3, '#fff6c2');
      break;
    }
    case 'mg': R(x - 3, y - 1, 6, 2, '#ffe066'); break;
    case 'shell': RO(x - 3, y - 3, 6, 6, '#3d3d3d'); R(x - 2, y - 2, 2, 2, '#9a9a9a'); break;
    case 'bomb': RO(x - 2, y - 3, 5, 7, '#2c3e50'); R(x - 2, y - 5, 5, 2, '#566573'); R(x, y + 1, 1, 1, G.t % 10 < 5 ? EVIL : '#2c3e50'); break;
    case 'mup': RO(x - 2, y - 6, 4, 10, '#d5d8dc'); R(x - 2, y - 6, 4, 2, '#e74c3c'); R(x - 1, y + 4, 2, 3 + (G.t % 3), '#ff9f1c'); break;
    case 'mdown': RO(x - 2, y - 5, 4, 10, '#d5d8dc'); R(x - 2, y + 3, 4, 2, '#e74c3c'); R(x - 1, y - 8 - (G.t % 3), 2, 3, '#ff9f1c'); break;
    case 'wave': {
      const k = G.t % 6 < 3, gy = Math.round(groundAt(b.x));
      R(x - 7, gy - 8, 14, 8, k ? '#ffe9a0' : '#ffd060'); R(x - 4, gy - 13, 8, 13, '#fff6d0'); R(x - 1, gy - 16, 2, 16, '#ffffff');
      break;
    }
  }
}

function drawMarkers() {
  for (const m of G.markers) {
    if (m.t < 0) continue;
    const on = Math.floor(m.t / 5) % 2 === 0, gy = groundAt(m.x);
    ctx.strokeStyle = on ? '#ff3b30' : '#ffe066'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(m.x, gy - 1, 10, 3, 0, 0, Math.PI * 2); ctx.stroke();
    if (on) text('!', m.x, gy - 18, '#ff3b30', 1, 'center');
  }
}

function drawFx() {
  for (const r of G.rings) {
    const k = r.t / r.max;
    ctx.strokeStyle = 'rgba(255,' + (200 - k * 120 | 0) + ',120,' + (1 - k) + ')'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.3 + k * 0.7), 0, Math.PI * 2); ctx.stroke();
  }
  for (const p of G.parts) {
    const k = p.life / p.max;
    if (p.type === 'fire') {
      const rr = p.size * (0.45 + 0.55 * Math.sin(Math.PI * Math.min(1, (1 - k) * 1.3 + 0.15)));
      const x = Math.round(p.x), y = Math.round(p.y);
      if (k < 0.55) { ctx.fillStyle = k < 0.2 ? '#3b2f2f' : '#8a2a12'; circ(x, y, rr + 1); }
      ctx.fillStyle = k > 0.78 ? '#fffbe0' : k > 0.55 ? '#ffd23f' : k > 0.35 ? '#ff8c2e' : k > 0.2 ? '#d9431e' : '#4a3b3b';
      circ(x, y, rr);
      if (k > 0.45) { ctx.fillStyle = k > 0.7 ? '#ffffff' : '#fff1a0'; circ(x - rr * 0.25, y - rr * 0.25, rr * 0.45); }
    } else if (p.type === 'flash') {
      ctx.fillStyle = 'rgba(255,255,240,' + k.toFixed(2) + ')'; circ(p.x, p.y, p.size * (1.2 - k * 0.4));
    } else if (p.type === 'dust') {
      ctx.fillStyle = 'rgba(214,196,160,' + (k * 0.8).toFixed(2) + ')'; circ(Math.round(p.x), Math.round(p.y), p.size * (1.4 - k * 0.6));
    } else if (p.type === 'sprite') {
      ctx.save(); ctx.translate(Math.round(p.x), Math.round(p.y)); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, k * 4);
      ctx.drawImage(p.s.img, -Math.floor(p.s.w / 2), -Math.floor(p.s.h / 2));
      ctx.restore();
    } else if (p.type === 'smoke') {
      ctx.fillStyle = 'rgba(64,62,70,' + (Math.min(1, k * 1.5) * 0.5).toFixed(2) + ')';
      circ(Math.round(p.x), Math.round(p.y), p.size * 0.7);
    } else {
      ctx.fillStyle = p.c || '#ffe066';
      ctx.fillRect(Math.round(p.x), Math.round(p.y), p.size, p.size);
    }
  }
  for (const t of G.texts) text(t.s, t.x, t.y, t.c, 1, 'center');
}

function drawPrisoner(o) {
  ctx.save(); ctx.translate(Math.round(o.x), Math.round(o.y));
  const SH = '#f2efe6', SHD = '#c9c3b3', PN = '#8a6b4a', PND = '#6b5236', ROPE = '#c49a5a';
  if (o.state === 'tied') {
    const w = Math.floor(o.t / 18) % 4 === 0 ? 1 : 0;
    // post
    RO(-11, -36, 5, 36, '#7a5230'); R(-11, -36, 1, 36, '#5b3a1e'); R(-10, -36, 3, 1, '#9a7048');
    // sitting legs + bare feet
    RO(-3, -5, 11, 5, PN); R(-3, -5, 11, 1, '#a88760'); RO(8, -4, 3, 4, SKIN);
    // torso + ropes
    RO(-6, -19 + w, 10, 14, SH); R(-6, -19 + w, 2, 14, SHD); R(-2, -14 + w, 2, 2, '#d8d2c0');
    R(-11, -15 + w, 15, 2, ROPE); R(-11, -10 + w, 15, 2, ROPE); R(-11, -13 + w, 15, 1, '#8a6a3a');
    spr(POW_HEAD, -6, -31 + w);
    if (Math.floor(o.t / 40) % 2 === 0) text('HELP!', 0, -46, '#ffffff', 1, 'center');
  } else {
    const run = o.state === 'run';
    if (run) ctx.scale(-1, 1);
    let legs = [[-4, 0], [0, 0]], bob = 0;
    if (run) { const f = Math.floor(o.t / 3) % 6; legs = RUN6[f]; bob = f === 2 || f === 5 ? -1 : 0; }
    else if (o.state === 'free') bob = -Math.round(Math.abs(Math.sin(o.t * 0.25)) * 4);
    ctx.translate(0, bob);
    for (const [i, lg] of legs.entries()) { RO(lg[0], -11 - lg[1], 3, 8, i ? PN : PND); RO(lg[0], -3 - lg[1], 4, 3, SKIN); }
    RO(-5, -21, 10, 10, SH); R(-5, -21, 2, 10, SHD); R(-3, -21, 1, 6, '#8a6b4a'); R(2, -21, 1, 6, '#8a6b4a');
    RO(-5, -13, 10, 2, PN);
    spr(POW_HEAD, -6, -33);
    if (o.state === 'salute') { RO(3, -23, 2, 6, SKIN); RO(4, -30, 2, 7, SKIN); }
    else if (o.state === 'free') { RO(-8, -27, 2, 8, SKIN); RO(5, -27, 2, 8, SKIN); }
    else RO(1, -19, 2, 7, SKIN);
  }
  ctx.restore();
}

function updSoldier(e) {
  const p = G.p, dx = p.x - e.x, adx = Math.abs(dx);
  const vis = e.x > G.cam.x + 4 && e.x < G.cam.x + W - 4;
  e.moving = false;
  if (e.state === 'walk') {
    e.facing = dx < 0 ? -1 : 1;
    const minX = G.cam.x + 14, maxX = G.cam.x + W - 14;
    const out = e.x < minX || e.x > maxX;
    let mv = 0;
    if (out) mv = e.x < minX ? 1 : -1; // always walk onto the screen so they can be shot
    else if (adx > e.range) mv = Math.sign(dx);
    else if (adx < 36) mv = -Math.sign(dx);
    if (!out && mv && (e.x + mv < minX || e.x + mv > maxX)) mv = 0; // never back off the screen
    if (mv) { e.x += mv * 0.6; e.moving = true; }
    if (--e.cd <= 0 && vis && !p.dead) { e.state = 'aim'; e.st = 32; }
  } else if (e.state === 'aim') {
    e.facing = dx < 0 ? -1 : 1;
    if (--e.st <= 0) {
      const mx = e.x + e.facing * 19, my = e.y - 16;
      const a = Math.atan2(p.y - (p.crouch ? 12 : 18) - my, p.x - mx);
      G.eb.push({ k: 'laser', x: mx, y: my, vx: Math.cos(a) * 2.1, vy: Math.sin(a) * 2.1, r: 3, life: 280 });
      Snd.laser();
      e.state = 'walk'; e.cd = rand(80, 140) | 0;
    }
  }
  const py = e.y;
  e.vy = Math.min(e.vy + 0.26, 6); e.y += e.vy;
  land(e, py);
  if (e.onPlat) e.x = clamp(e.x, e.onPlat.x + 4, e.onPlat.x + e.onPlat.w - 4);
}

function updDrone(e) {
  const p = G.p;
  if (e.t % 160 === 1) e.offX = rand(-50, 50);
  const tx = p.x + e.offX, ty = groundAt(e.x) - e.alt + Math.sin(e.t * 0.05) * 6;
  e.x += clamp(tx - e.x, -1.1, 1.1);
  e.y += clamp(ty - e.y, -0.8, 0.8);
  e.facing = p.x < e.x ? -1 : 1;
  const vis = e.x > G.cam.x && e.x < G.cam.x + W;
  if (--e.cd <= 0 && vis && Math.abs(p.x - e.x) < 40 && !p.dead) {
    G.eb.push({ k: 'bomb', x: e.x, y: e.y + 2, vx: 0, vy: 0.5, g: 0.09, r: 3, life: 300, shoot: true });
    e.cd = rand(120, 180) | 0;
    Snd.throw();
  }
}

function updTank(e) {
  const p = G.p;
  e.y = groundAt(e.x);
  if (e.recoil > 0) e.recoil -= 0.5;
  if (e.state === 'enter') {
    e.x -= 0.8; e.tread += 0.8; e.facing = -1;
    if (e.x < G.cam.x + W - 70) { e.state = 'fight'; e.cd = 50; e.tx = e.x; }
    return;
  }
  if (Math.abs(e.tx - e.x) < 1) e.tx = rand(G.cam.x + 200, G.cam.x + W - 50);
  const mv = Math.sign(e.tx - e.x) * 0.45;
  e.x += mv; e.tread += mv * e.facing;
  e.facing = p.x < e.x ? -1 : 1;
  if (e.burst > 0 && --e.burstT <= 0) {
    G.eb.push({ k: 'mg', x: e.x + e.facing * 37, y: e.y - 28, vx: e.facing * 3, vy: 0, r: 2, life: 200 });
    e.burst--; e.burstT = 9;
    Snd.shoot();
  }
  if (--e.cd <= 0 && !p.dead) {
    e.atk++;
    if (e.atk % 3 === 0) { e.burst = 3; e.burstT = 1; }
    else {
      const mx = e.x + e.facing * 46, my = e.y - 30;
      const vx = clamp((p.x - mx) / 61 * rand(0.9, 1.1), -3.2, 3.2);
      G.eb.push({ k: 'shell', x: mx, y: my, vx, vy: -4.2, g: 0.15, r: 3, life: 300, shoot: true });
      e.recoil = 4;
      for (let i = 0; i < 4; i++) G.parts.push({ type: 'smoke', x: mx, y: my, vx: e.facing * rand(0.2, 0.8), vy: rand(-0.6, -0.1), life: 30, max: 30, size: 4 });
      Snd.cannon();
    }
    e.cd = 150;
  }
}

function crabToIdle(e, ph2) { e.state = 'idle'; e.st = ph2 ? 45 : 70; e.tx = null; }

function updCrab(e) {
  const p = G.p, L = G.cam.x, ph2 = e.hp < e.max / 2;
  if (e.state !== 'dying' && !p.dead && p.x > e.x - 112) p.x = e.x - 112; // stay in front of the crab's claws
  if (ph2 && e.state !== 'dying' && e.t % 40 === 0) sparks(e.x + rand(-40, 30), e.y + e.oy - rand(40, 70), 6);
  if (ph2 && e.state !== 'dying' && e.t % 12 === 0) G.parts.push({ type: 'smoke', x: e.x + rand(-40, 30), y: e.y + e.oy - 66, vx: rand(-0.3, 0.3), vy: -0.8, life: 50, max: 50, size: 5 });
  switch (e.state) {
    case 'intro':
      e.x -= 0.9; e.walk++;
      if (e.x <= L + 380) { e.inv = false; crabToIdle(e, false); e.st = 40; }
      break;
    case 'idle':
      if (e.tx == null || Math.abs(e.tx - e.x) < 2) e.tx = rand(L + 270, L + 400);
      e.x += Math.sign(e.tx - e.x) * (ph2 ? 0.9 : 0.6); e.walk++;
      if (--e.st <= 0) {
        const pat = ph2 ? ['spread', 'stomp', 'missile', 'stomp'] : ['spread', 'missile'];
        e.state = pat[e.atkI++ % pat.length]; e.st = 0;
      }
      break;
    case 'spread':
      e.st++; e.claw = Math.min(5, e.st / 4);
      if (e.st === 36 || e.st === 56 || e.st === 76) {
        const mx = e.x - 100, my = e.y + e.oy - 51, n = ph2 ? 7 : 5;
        const base = Math.atan2(p.y - 14 - my, p.x - mx);
        for (let i = 0; i < n; i++) {
          const a = base + (i - (n - 1) / 2) * 0.2;
          G.eb.push({ k: 'orb', x: mx, y: my, vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2, r: 4, life: 300 });
        }
        Snd.laser();
      }
      if (e.st >= 100) { e.claw = 0; crabToIdle(e, ph2); }
      break;
    case 'missile':
      e.st++;
      e.hatch = e.st <= 70 ? Math.min(8, e.st / 2) : Math.max(0, 8 - (e.st - 70) / 2);
      if (e.st >= 20 && e.st <= 50 && e.st % 10 === 0) { G.eb.push({ k: 'mup', x: e.x + 24, y: e.y - 92, vx: 0, vy: -4, r: 3, life: 60 }); Snd.throw(); }
      if (e.st === 70) {
        const xs = [p.x, p.x - 64, p.x + 64];
        if (ph2) xs.push(rand(L + 20, e.x - 120));
        xs.forEach((x, i) => G.markers.push({ x: clamp(x, L + 12, e.x - 116), t: -i * 8 }));
      }
      if (e.st >= 100) crabToIdle(e, ph2);
      break;
    case 'stomp':
      e.st++;
      if (e.st < 20) e.oy = Math.min(4, e.st / 4);
      else if (e.st < 60) e.oy = -Math.sin((e.st - 20) / 40 * Math.PI) * 60;
      else if (e.st === 60) {
        e.oy = 0; G.shake = 8; Snd.boom(true);
        G.eb.push({ k: 'wave', x: e.x - 104, y: e.y, vx: -3, vy: 0, r: 6, life: 220 });
        for (let i = 0; i < 12; i++) G.parts.push({ type: 'smoke', x: e.x + rand(-80, 60), y: e.y - 4, vx: rand(-1, 1), vy: rand(-0.6, -0.1), life: 40, max: 40, size: 6 });
      }
      if (e.st >= 90) crabToIdle(e, ph2);
      break;
    case 'dying':
      e.st++;
      G.shake = Math.max(G.shake, 3);
      if (e.st % 6 === 0) boom(e.x + rand(-90, 40), e.y - rand(20, 90), rand(0.6, 1.2));
      if (e.st >= 150) {
        boom(e.x - 20, e.y - 50, 2.4);
        for (let i = 0; i < 6; i++) G.later.push({ t: 4 + i * 6, x: e.x + rand(-80, 40), y: e.y - rand(10, 80), s: 1.8 });
        debris(e.x - 20, e.y - 50, 24, '#d0453a');
        bossDefeated(e);
      }
      break;
  }
}

// Drawing: backgrounds and scenery
// ============================================================
// Each area has its own sky and distant scenery; neighbours blend as the camera moves.
const AREA_BOUNDS = [1600, 3020, 4380];
function areaWeights(cx) {
  const c = cx + W / 2, w = [0, 0, 0, 0];
  let i = 0;
  while (i < 3 && c >= AREA_BOUNDS[i] + 150) i++;
  if (i < 3 && c > AREA_BOUNDS[i] - 150) { const k = (c - (AREA_BOUNDS[i] - 150)) / 300; w[i] = 1 - k; w[i + 1] = k; }
  else w[i] = 1;
  return w;
}

function drawPipes(x) {

function drawDecor(cx) {

// Low plants, posts and sandbags in front of the action (moves faster than the world)
function drawForeground(cx) {
  const off = cx * 1.3, sp = 90;
  for (let i = Math.floor((off - 80) / sp); i * sp - off < W + 80; i++) {
    if (hsh(i + 3) < 0.35) continue;

// Platforms (world space), one at a time: the engine skips the ones off screen
function drawPlat(pl) {

    ctx.strokeStyle = '#7a4f25'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 6); ctx.lineTo(x + w - 4, GROUND - 2); ctx.moveTo(x + w - 4, y + 6); ctx.lineTo(x + 4, GROUND - 2); ctx.stroke();
    RO(x, y, w, 4, '#b07a3c'); R(x, y, w, 1, '#d39b5a');
  } else if (pl.t === 'tower') {
    RO(x + 2, y, 4, hgt, '#6b4423'); RO(x + w - 6, y, 4, hgt, '#6b4423');
    ctx.strokeStyle = '#6b4423'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, GROUND - 2); ctx.moveTo(x + w - 4, y + 4); ctx.lineTo(x + 4, GROUND - 2); ctx.stroke();
    R(x - 2, y - 42, 2, 32, '#6b4423'); R(x + w, y - 42, 2, 32, '#6b4423');
    ctx.fillStyle = '#556b2f';
    ctx.beginPath(); ctx.moveTo(x - 10, y - 40); ctx.lineTo(x + w / 2, y - 56); ctx.lineTo(x + w + 10, y - 40); ctx.fill();
    R(x - 4, y - 10, w + 8, 2, '#8b5a2b'); R(x - 4, y - 10, 2, 10, '#8b5a2b'); R(x + w + 2, y - 10, 2, 10, '#8b5a2b');
    RO(x - 4, y, w + 8, 4, '#a0662d');

}

// Mission-select card art: a slice of the jungle, a hero squaring up to a robot soldier
function drawPreview(x, y, w, h) {
  const cx = 20, ox = 44, wx = cx + ox;
  ctx.save();
  ctx.translate(x - ox, y - (GROUND + 12 - h));
  drawBG(cx);
  ctx.translate(-cx, 0);
  drawDecor(cx); drawGround(cx);
  const fire = G.t % 40 < 18;
  drawSoldier({ x: wx + w - 28, y: GROUND, facing: -1, hitT: 0, moving: false, t: G.t, state: 'aim', st: G.t });
  drawHero(HEROES[G.hero], wx + 30, GROUND, 1, { pose: 'idle', t: G.t, aim: 'fwd', muzzle: fire && G.t % 6 < 3 ? 3 : 0 });

<script>
// ---- src/weapons_extra.js ----
'use strict';
// ============================================================
// Mission 2 weapons: S shotgun, R rocket launcher, F flame shot, and the pickups S / R / F / cherry / chestnut.
// Everything in this block is private: it is reached through WEAPONS.shotgun / rocket / flame and
// ITEMS.S / R / F / cherry / chestnut (see docs/engine-api.md, WEAPONS and ITEMS).
// ============================================================
{
// ============================================================
// Pixel maps: rects of palette letters painted on a grid, then a 1px OUT outline around them
// ============================================================
const PAL = {
  k: OUT,
  // gun steel, and the darker blued steel of the shotgun
  a: '#1d2129', d: '#343b46', s: '#566170', l: '#8d99a7', w: '#dfe7ee',
  A: '#1b1e28', B: '#2e3443', C: '#4b5570', D: '#7f8cab',
  // wood
  b: '#4a2c15', o: '#7a4b24', O: '#a86d36', y: '#d89c58',
  // olive drab
  g: '#3b4720', G: '#5a6a2e', h: '#7d9140', H: '#a8bd62',
  // reds
  r: '#962318', R: '#d1372a', e: '#ff7560', E: '#ffd0c4',
  // brass / copper
  p: '#8a4f1c', P: '#c98236', q: '#f2c06a',
  // misc: glass, warning yellow, white, stems and leaves (no outline)
  c: '#7fd8ff', Y: '#ecc63a', Z: '#9a7c1c', n: '#ffffff',
  v: '#2f6b2a', V: '#5c9e3a', L: '#3f8a34', M: '#8fcf4a'
};
const NO_OUT = 'kvV'; // dark lines and thin stems: no outline of their own

// rects [x, y, w, h, letter] in local coords -> { img, white, w, h, ox, oy } (ox, oy = local coords of the top-left)
function pixSprite(rects, round) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y, w, h] of rects) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x + w); y1 = Math.max(y1, y + h); }
  const ox = x0 - 1, oy = y0 - 1, w = x1 - x0 + 2, h = y1 - y0 + 2;
  const g = Array.from({ length: h }, () => Array(w).fill('.'));
  for (const [x, y, rw, rh, c] of rects) for (let j = y; j < y + rh; j++) for (let i = x; i < x + rw; i++) g[j - oy][i - ox] = c;
  return { ...makeSprite(outline(g, round), PAL), ox, oy };
}
// 1px OUT outline around every painted pixel (round: no corner pixels)
function outline(g, round) {
  const h = g.length, w = g[0].length, o = g.map(r => r.slice());
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (g[y][x] !== '.') continue;
    let n = false;
    for (let dy = -1; dy <= 1 && !n; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (round && dx && dy) continue;
      const c = g[y + dy] && g[y + dy][x + dx];
      if (c && c !== '.' && !NO_OUT.includes(c)) { n = true; break; }

}
// A gun is painted pointing forward (x along the barrel, y down, the hand at 0,0) and turned for the other aims:
// 'up' turned 90 degrees left, 'down' pointing down with its top side to the left (light still comes from the left)
const turn = (rs, aim) => aim === 'fwd' ? rs : rs.map(([x, y, w, h, c]) => aim === 'up' ? [y, -x - w + 1, h, w, c] : [y, x, h, w, c]);
const turnPt = (x, y, aim) => aim === 'fwd' ? [x, y] : aim === 'up' ? [y, -x] : [y, x];

// The hand in front of the gun's grip (hero-local, hand top-left at hx, hy)
function hand(hx, hy) { R(hx, hy, 3, 2, SKIN); R(hx, hy + 1, 3, 1, SKIND); R(hx + 2, hy, 1, 1, '#ffe2c8'); }

// Weapon kit: sprites for each aim (and each variant), the hand anchor and the muzzle (standing, facing right)
// paint(aim, variant) -> rects; anchor[aim] = [x, row below the torso top]; mz = muzzle in painted coords
function kit(paint, variants, anchor, mz) {
  const k = { spr: {}, anchor, muzzle: {} };
  for (const aim of AIMS) {
    k.spr[aim] = [];
    for (let v = 0; v < variants; v++) k.spr[aim].push(pixSprite(turn(paint(aim, v), aim)));
    const [mx, my] = turnPt(mz[0], mz[1], aim);
    k.muzzle[aim] = [anchor[aim][0] + mx, -21 + anchor[aim][1] + my];

}
// draw a kit sprite at the aim's hand anchor (r = recoil pixel, pushes the gun back along its barrel)
function drawKit(k, aim, ty, r, v) {
  const [ax, ay] = k.anchor[aim], s = k.spr[aim][v || 0];
  const x = ax - (aim === 'fwd' ? r : 0), y = ty + ay + (aim === 'up' ? r : aim === 'down' ? -r : 0);
  spr(s, x + s.ox, y + s.oy);

}

// Drawing-only timers (G.t of the last shot of each weapon): pump, reload and flash animations
let pumpT = -999, rocketT = -999, flameT = -999, hissT = -999;

// ============================================================
// Crisp pixel discs for smoke and fire (no blurry anti-aliased circles): one strip per colour, diameters 1..MAXD
// ============================================================
const MAXD = 28, DOFF = [];
for (let d = 1, o = 0; d <= MAXD; o += d, d++) DOFF[d] = o;
const DSTRIP = {};
for (const col of [
  '#ffffff', '#e6e1d8', '#b8b2a8', '#f4efe6', '#cfc8bc', '#9d968c', '#8c8287', '#6b6267', '#4b4448', // smoke
  '#fff1a0', '#ffd23f', '#ffc23a', '#ff9a2e', '#e8501e', '#a3301a', '#6e2412' // fire

    const r = d / 2, lim = r * r - r / 2;

      g.fillRect(DOFF[d] + (d - n) / 2, j, n, 1);

}
function disc(x, y, r, col) {
  const s = DSTRIP[col], d = r < 0.5 ? 1 : r * 2 > MAXD ? MAXD : Math.round(r * 2);
  if (s) ctx.drawImage(s, DOFF[d], 0, d, d, Math.round(x - d / 2), Math.round(y - d / 2), d, d);
}

// ============================================================
// Effects host: one entry in G.pb, under the ground where the engine never collides it (it returns at the ground
// check). It moves and draws the smoke puffs, then the flame jet. A level rebuild (a new G.pb) drops it.
// fire() calls fxHost() before pushing its shots, so the smoke is drawn under them.
// ============================================================
const SMOKE = {
  trail: ['#ffffff', '#e6e1d8', '#b8b2a8'],
  blast: ['#f4efe6', '#cfc8bc', '#9d968c'],
  soot: ['#8c8287', '#6b6267', '#4b4448']
};
const PUFFS = [], FIRES = [];
let host = null;
function fxHost() {
  if (host && host.life > 0 && G.pb.includes(host)) return;
  PUFFS.length = 0; FIRES.length = 0;
  host = { x: G.cam.x + W / 2, y: H - 1, vx: 0, vy: 0, dmg: 0, life: 1e9, idle: 0, update: hostUpd, onGround: () => true, draw: hostDraw };

}
function hostUpd(b) {
  b.x = G.cam.x + W / 2;
  for (const q of PUFFS) { q.x += q.vx; q.y += q.vy; q.vx *= 0.92; q.vy = q.vy * 0.92 - 0.025; q.life--; onFloor(q); }

  for (const f of FIRES) {

  for (let i = FIRES.length - 1; i >= 0; i--) if (FIRES[i].age >= FIRES[i].max) FIRES.splice(i, 1);
  if (PUFFS.length || FIRES.length || G.pb.some(q => q.flame)) b.idle = 0;

}
function hostDraw() {
  // smoke, layer by layer so touching puffs merge into one cloud: shadow, body, highlight; old puffs shrink away
  const L = G.cam.x - 30, Rr = G.cam.x + W + 30;

<script>
// ---- src/vehicle.js ----
'use strict';
// ============================================================
// Mission 2: the BATTLE TRACTOR (RIDES.tractor + PROP_TYPES.tractor, parked at x 2950).
// A cheerful red Galician farm tractor turned tank: big rear wheel, small front wheel, bolted grey armour plates,
// an exhaust stack, a nose machine gun on a ball mount that swings up to 90 degrees (X, hold Up: forward shots fly
// at feet - 14 or lower, so they hit wolves), a sun canopy over the seat carrying a dome turret with a stubby cannon
// (C, 15 shells), an amber beacon and a Galician flag. Walk into it to get in; Down + Z gets out (it stays parked,
// armour and shells kept). Armour 6: at 0 the hero is thrown clear and the tractor blows up 0.7 s later.
// Drawing: every frame the tractor is composed facing right and level on two small offscreen canvases (behind and
// in front of the seated hero), then drawn turned and tilted to the slope with nearest-neighbour pixels.
// ============================================================
{
// ============================================================
// Palette and the load-time pixel painter
// ============================================================
const PAL = {
  k: OUT,
  r: '#d8392b', R: '#ff6d4d', q: '#a2251e', Q: '#6c1714',                // red paint
  p: '#8f9aa7', P: '#cbd3dc', o: '#5e6773', v: '#363d47', V: '#f2f6f9',   // armour plates, rivets
  t: '#33333d', T: '#56566b', u: '#1c1c23',                               // tyres
  y: '#f6c431', Y: '#fff08a', z: '#c08612',                               // wheel hubs
  s: '#7c8794', S: '#c6ced8', d: '#464d58', m: '#23252b',                 // steel
  g: '#2a2224', l: '#fff6c2', L: '#ffb52e',                               // grille, lamps
  e: '#3f444c', E: '#80878f',                                             // exhaust
  n: '#4b3a33', N: '#735a4e',                                             // seat, mud
  w: '#ffffff', W: '#d3dbe4', b: '#72bdf0', B: '#4e98cf',                 // the Galician flag
  c: '#e8b43a', C: '#ffe08a', j: '#fff1c9',                               // brass, cream
  A: '#ffd23f', f: '#ff8c1a', F: '#fff3b0', i: '#1b1012'                // beacon, flame, bolt holes
};

// Paints a sprite on a char grid in local coordinates (local 0,0 = grid cell ox, oy), adds a 1px OUT outline
// around the silhouette and returns makeSprite(...) plus its origin. Load time only.
function paint(w, h, ox, oy, fn, outline = true) {
  const g = [];
  for (let y = 0; y < h; y++) g.push(new Array(w).fill('.'));
  const P = (x, y, c) => { x = Math.round(x) + ox; y = Math.round(y) + oy; if (x >= 0 && y >= 0 && x < w && y < h) g[y][x] = c; };
  const box = (x, y, bw, bh, c) => { for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) P(x + i, y + j, c); };
  const disc = (cx, cy, rr, c) => {
    for (let y = Math.floor(cy - rr); y <= Math.ceil(cy + rr); y++) for (let x = Math.floor(cx - rr); x <= Math.ceil(cx + rr); x++) if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= rr * rr) P(x, y, c);
  };

  const bar = (px, py, a, t0, t1, s0, s1, c) => {

  };
